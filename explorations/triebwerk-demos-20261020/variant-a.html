<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triebwerk-Leitstand</title>
<meta name="description" content="Interaktiver Leitstand: Funktionsprinzip von Feststoff-, Gasgenerator-, Stufenverbrennungs- und Ionentriebwerken in drei Freigabestufen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --bg:#03070e; --bg2:#06101e; --panel:rgba(6,15,29,.72);
  --line:rgba(95,227,255,.14); --line2:rgba(95,227,255,.30); --line3:rgba(95,227,255,.55);
  --cyan:#5fe3ff; --amber:#ffb547; --red:#ff5d5d; --text:#cfe6f2; --dim:#7a96ab; --mute:#41596d;
  --fuel:#ff8a3d; --lox:#3fd7ff; --hot:#ffd27a; --hotf:#ffb067; --hoto:#c8f4ff; --smoke:#8a93a6;
  --xe:#b18cff; --ion:#8ea2ff; --el:#e8f6ff;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --disp:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;line-height:1.5}
body{
  min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(1200px 700px at 52% 42%, rgba(18,52,92,.55), transparent 70%),
    linear-gradient(180deg, #04090f, #02050a);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(95,227,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(95,227,255,.055) 1px, transparent 1px),
    linear-gradient(rgba(95,227,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(95,227,255,.022) 1px, transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-position:-1px -1px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
b{font-weight:500}

.app{
  position:relative;z-index:1;display:grid;
  grid-template-columns:minmax(272px,320px) minmax(0,1fr) minmax(284px,336px);
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head head" "tabs view tele" "brief view tele" "foot foot foot";
  height:100vh;height:100dvh;
}

/* ---------- header ---------- */
.head{grid-area:head;display:flex;align-items:center;gap:24px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(4,10,20,.9),rgba(4,10,20,.55))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.b1{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:.14em;line-height:1;color:#e9f7ff}
.b2{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clear{display:flex;align-items:center;gap:14px;margin-left:auto}
.clear-lbl{font-size:10px;letter-spacing:.2em;color:var(--dim);white-space:nowrap}
.clear-lbl kbd{font-family:var(--mono);font-size:9px;color:var(--mute);border:1px solid var(--line);padding:0 4px;margin-left:6px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line2);min-width:min(420px,100%)}
.seg-ind{position:absolute;left:0;top:0;bottom:0;width:33.3333%;background:linear-gradient(180deg,rgba(255,181,71,.18),rgba(255,181,71,.06));border:1px solid var(--amber);box-shadow:0 0 18px rgba(255,181,71,.25) inset;transition:transform .55s var(--ease);pointer-events:none}
.seg button{position:relative;display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:10px;letter-spacing:.14em;color:var(--dim);transition:color .3s}
.seg button + button{border-left:1px solid var(--line)}
.seg button b{font-family:var(--disp);font-size:20px;line-height:1;font-weight:600;color:var(--mute);transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff3df}
.seg button[aria-pressed="true"] b{color:var(--amber)}
.seg button:hover{color:var(--text)}
.badge{flex:none;font-size:10px;letter-spacing:.1em;color:var(--amber);border:1px solid rgba(255,181,71,.45);padding:4px 8px;white-space:nowrap;background:rgba(255,181,71,.06)}

/* ---------- panels ---------- */
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.ph::before{content:"";width:6px;height:6px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:none}
.ph > :first-child{margin-right:auto}
.ph span{color:var(--mute);letter-spacing:.12em}
.ph .live{color:var(--amber)}

.tabs{grid-area:tabs;padding:16px 16px 12px 20px;border-right:1px solid var(--line)}
.tablist{display:grid;gap:6px}
.tab{position:relative;display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:9px 10px;border:1px solid var(--line);background:rgba(6,15,29,.5);transition:border-color .3s,background .3s}
.tab .ti{grid-row:1/3;font-family:var(--disp);font-size:24px;line-height:1;color:var(--mute);align-self:center;transition:color .3s}
.tab .tn{font-family:var(--disp);font-size:17px;font-weight:500;letter-spacing:.06em;line-height:1.1;color:var(--text);text-transform:uppercase}
.tab .ts{font-size:10px;color:var(--dim);letter-spacing:.04em}
.tab::after{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:var(--cyan);transform:scaleY(0);transform-origin:top;transition:transform .5s var(--ease);box-shadow:0 0 12px var(--cyan)}
.tab:hover{border-color:var(--line2);background:rgba(10,26,46,.6)}
.tab[aria-selected="true"]{border-color:var(--line3);background:linear-gradient(90deg,rgba(95,227,255,.12),rgba(95,227,255,.02))}
.tab[aria-selected="true"]::after{transform:scaleY(1)}
.tab[aria-selected="true"] .ti{color:var(--cyan)}

.brief{grid-area:brief;overflow-y:auto;padding:6px 18px 20px 20px;border-right:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.b-meta{font-size:10px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;margin:6px 0 4px}
.b-title{font-family:var(--disp);font-weight:600;font-size:30px;line-height:1.02;letter-spacing:.04em;margin:0 0 10px;text-transform:uppercase;color:#eef9ff}
.b-ex{font-size:11px;color:var(--dim);border-left:1px solid var(--amber);padding-left:10px;margin-bottom:14px}
.b-ex span{display:block;font-size:9px;letter-spacing:.2em;color:var(--amber)}
.b-text{font-size:12.5px;line-height:1.65;color:var(--text);margin:0 0 16px}
.b-text b,.b-sec b{color:#fff;font-weight:500;border-bottom:1px dotted var(--cyan)}
body[data-level="1"] .b-text{font-size:14px;line-height:1.6}
.b-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.b-sec h3{margin:0 0 8px;font-size:10px;font-weight:400;letter-spacing:.2em;color:var(--dim)}
.b-sec p{margin:0 0 12px;font-size:11.5px;line-height:1.6;color:#b5cfdd}
.fx{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.fx li{padding:7px 9px;border:1px solid var(--line);background:rgba(95,227,255,.04);font-size:11.5px;color:#e8f6ff}
.fx li small{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.enter > *{animation:enter .7s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- viewport ---------- */
.view{grid-area:view;position:relative;min-height:0;min-width:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.leaders polyline{fill:none;stroke:var(--cyan);stroke-width:1;opacity:.8}
.leaders .dot{fill:var(--cyan)}
.leaders .ring{fill:none;stroke:var(--cyan);stroke-width:1;opacity:.5}
.callouts{position:absolute;inset:0;pointer-events:none}
.co{position:absolute;left:0;top:0;max-width:210px;padding:5px 8px 6px;border:1px solid var(--line2);background:rgba(3,9,18,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);will-change:transform,opacity;opacity:0;transition:border-color .25s, background .25s}
.co-n{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.co-d{font-size:11px;line-height:1.38;color:var(--text)}
.co-d:empty{display:none}
.co.hl{border-color:var(--amber);background:rgba(40,26,6,.85)}
.co.hl .co-n{color:var(--amber)}

.hud-tl{position:absolute;left:22px;top:18px;pointer-events:none;max-width:calc(100% - 44px)}
.hk{font-size:10px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.hn{font-family:var(--disp);font-weight:600;font-size:clamp(28px,3.6vw,50px);line-height:.95;letter-spacing:.03em;text-transform:uppercase;color:#f2fbff;text-shadow:0 0 30px rgba(95,227,255,.25)}
.he{font-size:11px;color:var(--dim);margin-top:4px}
.hud-tr{position:absolute;right:22px;top:18px;text-align:right;pointer-events:none;font-size:10px;letter-spacing:.12em;color:var(--dim)}
.st{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);padding:3px 8px;color:var(--text);background:rgba(3,9,18,.6)}
.st i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.st.warn i{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1s steps(2) infinite}
.st.hot i{background:var(--red);box-shadow:0 0 10px var(--red)}
@keyframes blink{50%{opacity:.2}}
.cam{margin-top:6px;font-variant-numeric:tabular-nums}
.hud-bl{position:absolute;left:22px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:60%;pointer-events:none;font-size:10px;color:var(--dim);letter-spacing:.06em}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:2px;box-shadow:0 0 6px currentColor}
.hud-br{position:absolute;right:22px;bottom:16px;font-size:9.5px;letter-spacing:.14em;color:var(--mute);pointer-events:none;text-align:right}
.brk{position:absolute;width:16px;height:16px;border:1px solid var(--line3);pointer-events:none}
.brk.a{left:8px;top:8px;border-right:0;border-bottom:0}.brk.b{right:8px;top:8px;border-left:0;border-bottom:0}
.brk.c{left:8px;bottom:8px;border-right:0;border-top:0}.brk.d{right:8px;bottom:8px;border-left:0;border-top:0}
.ruler{position:absolute;left:40px;right:40px;bottom:0;height:6px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 12px);opacity:.7}
.ruler.v{left:0;top:40px;bottom:40px;right:auto;width:6px;height:auto;background:repeating-linear-gradient(180deg,var(--line2) 0 1px,transparent 1px 12px)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.cd{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .35s}
.cd.on{opacity:1}
.cd-box{text-align:center}
.cd-t{font-family:var(--disp);font-weight:600;font-size:clamp(64px,11vw,148px);line-height:.9;color:var(--amber);letter-spacing:.04em;text-shadow:0 0 40px rgba(255,181,71,.45)}
.cd-s{font-size:10px;letter-spacing:.3em;color:var(--amber);opacity:.8;margin-top:6px}
.cd-t.tick{animation:tick .9s var(--ease)}
@keyframes tick{0%{transform:scale(1.35);opacity:0;filter:blur(6px)}25%{opacity:1;filter:none}100%{transform:scale(1);opacity:.85}}

/* ---------- telemetry ---------- */
.tele{grid-area:tele;overflow-y:auto;border-left:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.panel{padding:14px 18px 14px;border-bottom:1px solid var(--line)}
.panel.off{display:none}
.tr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(95,227,255,.10);animation:enter .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.tk{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.tv{white-space:nowrap;font-variant-numeric:tabular-nums}
.tv em{font-style:normal;font-size:10px;color:var(--mute);margin-right:4px}
.tv b{font-family:var(--disp);font-size:22px;font-weight:500;color:#eaf8ff;letter-spacing:.02em}
.tv b.txt{font-family:var(--mono);font-size:11.5px;color:var(--cyan)}
.tv b.warn{color:var(--amber)}
.tv i{font-style:normal;font-size:10px;color:var(--dim);margin-left:4px}
.lock{border:1px dashed var(--line2);padding:12px;background:rgba(95,227,255,.03)}
.lock .lk-h{font-size:10px;letter-spacing:.2em;color:var(--amber);margin-bottom:6px}
.lock p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--text)}
.lock .lk-f{font-size:10px;color:var(--mute);letter-spacing:.08em}
#chart{width:100%;height:64px;display:block}
.thr{display:flex;align-items:baseline;gap:6px}
.thr b{font-family:var(--disp);font-size:26px;font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.thr span{font-size:10px;color:var(--dim);letter-spacing:.1em}
#isp svg,#sch{width:100%;height:auto;display:block;overflow:visible}
.isp-l{font-size:8px;fill:var(--dim);letter-spacing:.04em;font-family:var(--mono)}
.isp-t{font-size:7px;fill:var(--mute);font-family:var(--mono)}
.isp-bar{fill:var(--mute);transform-box:fill-box;transform-origin:left;animation:grow .9s var(--ease) both}
.isp-row.on .isp-bar{fill:var(--amber)}
.isp-row.on .isp-l{fill:#ffe2b0}
.isp-v{font-size:7.5px;fill:var(--mute);font-family:var(--mono)}
.isp-row.on .isp-v{fill:var(--amber)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* schematic */
#sch text{font-family:var(--mono);font-size:7.6px;letter-spacing:.06em;fill:var(--text)}
#sch .node rect{fill:rgba(6,18,34,.92);stroke:var(--line3);stroke-width:1}
#sch .node{animation:nodeIn .6s var(--ease) both;animation-delay:var(--d,0ms);cursor:default}
#sch .node:hover rect{stroke:var(--amber)}
#sch .sx{fill:var(--dim);font-size:6.8px}
@keyframes nodeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lk-b{fill:none;stroke-width:1;opacity:.28}
.lk-f{fill:none;stroke-width:1.6;stroke-dasharray:3 7;animation:dash 1.6s linear infinite}
.sch-live .lk-f{animation-duration:.45s}
@keyframes dash{to{stroke-dashoffset:-20}}
.m-fuel{stroke:var(--fuel)}.m-lox{stroke:var(--lox)}.m-hot{stroke:var(--hot)}.m-hotf{stroke:var(--hotf)}.m-hoto{stroke:var(--hoto)}
.m-smoke{stroke:var(--smoke)}.m-xe{stroke:var(--xe)}.m-ion{stroke:var(--ion)}.m-el{stroke:var(--el)}.m-pwr{stroke:var(--amber)}
.m-shaft{stroke:var(--cyan)}
.lk-f.m-shaft{stroke-dasharray:1 3;animation:none;opacity:.6}
.lk-f.m-pwr{stroke-dasharray:6 3}

/* ---------- footer ---------- */
.foot{grid-area:foot;display:flex;align-items:center;gap:20px;padding:12px 20px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(4,10,20,.92),rgba(4,10,20,.6))}
.ign{position:relative;display:flex;align-items:center;gap:12px;flex:none;min-width:230px;padding:12px 20px;border:1px solid var(--amber);color:#ffe6bd;font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.18em;background:linear-gradient(180deg,rgba(255,181,71,.16),rgba(255,181,71,.04));overflow:hidden;transition:background .3s,color .3s,border-color .3s}
.ign::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,181,71,.12) 0 8px,transparent 8px 16px);opacity:0;transition:opacity .3s}
.ign:hover::before{opacity:1}
.ign .ic{width:12px;height:12px;border:1px solid currentColor;transform:rotate(45deg);flex:none}
.ign.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,181,71,.35),0 0 28px rgba(255,181,71,.35)}}
.ign.abort{border-color:var(--red);color:#ffd3d3;background:linear-gradient(180deg,rgba(255,93,93,.16),rgba(255,93,93,.04))}
.ign.run{border-color:var(--cyan);color:#d7f8ff;background:linear-gradient(180deg,rgba(95,227,255,.14),rgba(95,227,255,.03))}
.ign:disabled{cursor:not-allowed;opacity:.65}
.pips{display:flex;gap:4px;flex:none}
.pip{font-size:9px;letter-spacing:.12em;color:var(--mute);padding:4px 7px;border:1px solid var(--line);transition:all .3s;white-space:nowrap}
.pip.done{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.pip.now{color:var(--amber);border-color:var(--amber)}
.log{flex:1;min-width:0;font-size:10.5px;color:var(--dim);display:grid;gap:1px;max-height:52px;overflow:hidden;align-content:end}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:enter .4s var(--ease) both}
.log div span{color:var(--mute);margin-right:8px}
.log div.amb{color:var(--amber)}
.log div.cy{color:var(--cyan)}
.log div:last-child{color:var(--text)}
.log div.amb:last-child{color:var(--amber)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .seg button span{display:none}
  .seg{min-width:0}
  .pips{display:none}
}
@media (max-width:980px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .head{order:0;flex-wrap:wrap;gap:10px 16px;padding:12px 16px}
  .clear{order:3;width:100%;margin-left:0;flex-direction:column;align-items:stretch;gap:6px}
  .seg{width:100%}
  .seg button{justify-content:center;padding:8px 6px;gap:6px}
  .seg button span{display:inline;font-size:9px;letter-spacing:.08em}
  .badge{margin-left:auto}
  .tabs{order:1;border-right:0;padding:12px 16px 10px}
  .tablist{grid-template-columns:1fr 1fr}
  .view{order:2;height:62vh;height:62svh;min-height:380px;max-height:680px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .foot{order:3;flex-wrap:wrap;padding:12px 16px}
  .ign{flex:1 1 100%;justify-content:center}
  .log{flex:1 1 100%}
  .brief{order:4;overflow:visible;border-right:0;padding:12px 16px 18px}
  .tele{order:5;overflow:visible;border-left:0}
  .panel{padding:14px 16px}
  .hud-br{display:none}
  .hud-bl{max-width:calc(100% - 44px)}
}
@media (max-width:560px){
  .b2{display:none}
  .b1{font-size:17px}
  .hud-tl{left:16px;top:14px}
  .hud-tr{right:14px;top:14px}
  .hud-tr .cam{display:none}
  .hud-bl{left:16px;bottom:12px;gap:4px 10px;font-size:9px}
  .co{max-width:150px;padding:4px 6px}
  .co-d{font-size:9.5px}
  .co-n{font-size:8.5px}
  .tab{padding:8px;grid-template-columns:24px 1fr;column-gap:8px}
  .tab .ti{font-size:20px}
  .tab .tn{font-size:14px}
  .tab .ts{font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body data-level="2">
<div class="app">
  <header class="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true">
        <rect x=".5" y=".5" width="33" height="33" fill="none" stroke="rgba(95,227,255,.45)"/>
        <path d="M9 8 H25 L22 15 H12 Z" fill="none" stroke="#5fe3ff"/>
        <path d="M14 15 L12 24 H22 L20 15" fill="none" stroke="#5fe3ff"/>

        out.a = 0.8 * (1 - sstep(0.55, 1, u));

/* ---------- Partikelpool ---------- */
const POOL = 2800;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(POOL * 3), pCol = new Float32Array(POOL * 3), pSize = new Float32Array(POOL), pAlpha = new Float32Array(POOL);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 600 }, uMin: { value: -60 }, uMax: { value: 60 }, uGlobal: { value: 0 } },
  vertexShader: P_VS, fragmentShader: P_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
points.renderOrder = 5;
scene.add(points);
const phase = new Float32Array(POOL), rnd = new Float32Array(POOL * 3), eid = new Int16Array(POOL).fill(-1);
for (let i = 0; i < rnd.length; i++) rnd[i] = Math.random();
let activeEm = [];
const PART = { a: 0 };
const pout = { x: 0, y: 0, z: 0, r: 0, g: 0, b: 0, s: 0, a: 0 };
const flow = { feed: 0, gg: 0, hot: 0, plume: 0, ion: 0, beam: 0, elec: 0 };

function assignParticles(e) {
  activeEm = e.emitters.filter((m) => level >= m.min && level <= m.max);
  let i = 0;
  for (let k = 0; k < activeEm.length; k++) {
    for (let j = 0; j < activeEm[k].n && i < POOL; j++, i++) { eid[i] = k; phase[i] = Math.random(); }
  }
  for (; i < POOL; i++) { eid[i] = -1; pAlpha[i] = 0; }
}
function updateParticles(dt) {
  const mv = REDUCED ? 0 : 1;
  for (let i = 0; i < POOL; i++) {
    const k = eid[i];
    if (k < 0) { pAlpha[i] = 0; continue; }
    const m = activeEm[k];
    const f = flow[m.stage];
    const vis = m.idle ? 0.3 + 0.7 * f : f;
    if (vis <= 0.002) { pAlpha[i] = 0; continue; }
    const sp = m.idle ? 0.15 + 0.85 * f : 0.35 + 0.65 * f;
    let ph = phase[i] + dt * m.speed * sp * mv;
    if (ph >= 1) ph -= Math.floor(ph);
    phase[i] = ph;
    m.fn(ph, rnd[i * 3], rnd[i * 3 + 1], rnd[i * 3 + 2], pout);
    pPos[i * 3] = pout.x; pPos[i * 3 + 1] = pout.y; pPos[i * 3 + 2] = pout.z;
    pCol[i * 3] = pout.r; pCol[i * 3 + 1] = pout.g; pCol[i * 3 + 2] = pout.b;
    pSize[i] = pout.s;
    pAlpha[i] = pout.a * vis;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;
}

/* ---------- Text-Scramble ---------- */
function scramble(el, text, dur = 0.7) {
  if (el._tw) el._tw.dead = true;
  if (REDUCED) { el.textContent = text; return; }
  const glyphs = '▮▯▪01<>/#*+=ABCDEFXYZ';
  const o = { k: 0 };
  el._tw = tween(o, { k: 1 }, {
    dur, ease: EASE.lin,
    onUpdate() {
      const n = Math.floor(o.k * text.length);
      let s = text.slice(0, n);
      for (let i = n; i < text.length; i++) s += text[i] === ' ' ? ' ' : glyphs[(Math.random() * glyphs.length) | 0];
      el.textContent = s;
    },
    onComplete() { el.textContent = text; }
  });
}

  for (const m in MCOL) s += `<marker id="ah-${m}" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="${MCOL[m]}"/></marker>`;
  s += '</defs>';
  S.links.filter(inL).forEach((l) => {
    const arrow = l.m === 'shaft' ? '' : ` marker-end="url(#ah-${l.m})"`;
    s += `<path class="lk-b m-${l.m}" d="${l.d}"/><path class="lk-f m-${l.m}" d="${l.d}"${arrow}/>`;
  });
  S.nodes.filter(inL).forEach((n, i) => {
    const label = n.l[level - 1];
    if (!label) return;
    s += `<g class="node" data-key="${n.k}" style="--d:${i * 45}ms"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"/><text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + 2.6}" text-anchor="middle">${label}</text></g>`;
  });
  (S.extra || []).filter(inL).forEach((x) => { s += x.s; });
  schEl.innerHTML = s;
  schEl.querySelectorAll('.node').forEach((g) => {
    g.addEventListener('mouseenter', () => hlCallout(g.dataset.key, true));
    g.addEventListener('mouseleave', () => hlCallout(g.dataset.key, false));
  });
}
function hlCallout(key, on) { for (const o of calloutsBuilt) if (o.c.key === key) o.el.classList.toggle('hl', on); }

/* ---------- Legende ---------- */
function renderLegend() {
  const d = DATA[cur.id];
  $('#legend').innerHTML = d.legend.filter((x) => level >= (x.min || 1) && x.n[level - 1])
    .map((x) => `<span class="lg" style="color:${MCOL[x.c]}"><i style="background:${MCOL[x.c]}"></i><span style="color:var(--dim)">${x.n[level - 1]}</span></span>`).join('');
}

/* ---------- Callouts (3D → Bildschirm) ---------- */
function buildCallouts() {
  const lay = $('#callouts'), svg = $('#leaders');
  lay.innerHTML = '';
  svg.innerHTML = '';
  calloutsBuilt = cur.callouts.map((c) => {
    const el = document.createElement('div');
    el.className = 'co';
    el.innerHTML = '<div class="co-n"></div><div class="co-d"></div>';
    lay.appendChild(el);
    const ln = document.createElementNS(NS, 'polyline');
    const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', '2.5'); dot.setAttribute('class', 'dot');
    const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('r', '6'); ring.setAttribute('class', 'ring');
    svg.append(ln, dot, ring);
    return { c, el, ln, dot, ring, p: new THREE.Vector3(c.at[0], c.at[1], c.at[2]), vis: { a: 0 }, w: 120, h: 30, on: false };
  });
  updateCalloutText();
}
function updateCalloutText() {
  for (const o of calloutsBuilt) {
    const on = level >= (o.c.min || 1) && level <= (o.c.max || 3);
    o.on = on;
    if (on) {
      o.el.querySelector('.co-n').textContent = pick(o.c.name);
      o.el.querySelector('.co-d').textContent = pick(o.c.d) || '';
    }
    tween(o.vis, { a: on ? 1 : 0 }, { dur: 0.45 });
  }
  measureCallouts();
}
function measureCallouts() { for (const o of calloutsBuilt) { o.w = o.el.offsetWidth || o.w; o.h = o.el.offsetHeight || o.h; } }
const tmpV = new THREE.Vector3();
function updateCallouts() {
  const k = viewW < 620 ? 0.6 : 1;
  for (const o of calloutsBuilt) {
    const a = o.vis.a * coFade.a;
    if (a < 0.01) {
      if (o.shown !== false) { o.el.style.opacity = '0'; o.ln.style.opacity = '0'; o.dot.style.opacity = '0'; o.ring.style.opacity = '0'; o.shown = false; }
      continue;
    }
    tmpV.copy(o.p).project(camera);
    if (tmpV.z > 1) { o.el.style.opacity = '0'; o.ln.style.opacity = '0'; o.dot.style.opacity = '0'; o.ring.style.opacity = '0'; o.shown = false; continue; }
    o.shown = true;
    const sx = (tmpV.x * 0.5 + 0.5) * viewW, sy = (-tmpV.y * 0.5 + 0.5) * viewH;
    const dx = o.c.off[0] * k, dy = o.c.off[1] * k;
    const right = dx >= 0;
    const lx = sx + dx, ly = sy + dy;
    const bx = clamp(right ? lx : lx - o.w, 6, Math.max(6, viewW - o.w - 6));
    const by = clamp(ly - o.h / 2, 6, Math.max(6, viewH - o.h - 6));
    const yl = by + o.h / 2;
    const xl = right ? bx : bx + o.w;
    const ex = xl + (right ? -14 : 14);
    o.el.style.transform = `translate3d(${bx.toFixed(1)}px,${by.toFixed(1)}px,0)`;
    o.el.style.opacity = a.toFixed(3);
    o.ln.setAttribute('points', `${sx.toFixed(1)},${sy.toFixed(1)} ${ex.toFixed(1)},${yl.toFixed(1)} ${xl.toFixed(1)},${yl.toFixed(1)}`);
    o.ln.style.opacity = (a * 0.8).toFixed(3);
    o.dot.setAttribute('cx', sx.toFixed(1)); o.dot.setAttribute('cy', sy.toFixed(1)); o.dot.style.opacity = a.toFixed(3);
    o.ring.setAttribute('cx', sx.toFixed(1)); o.ring.setAttribute('cy', sy.toFixed(1));
    const pr = REDUCED ? 0.5 : 0.5 + 0.5 * Math.sin(clock * 3 + o.p.x);
    o.ring.style.opacity = (a * 0.6 * pr).toFixed(3);
    o.ring.setAttribute('r', (5 + 3 * pr).toFixed(2));
  }
}

/* ---------- Log, Status, Pips, Countdown ---------- */
const logEl = $('#log');
const t0 = performance.now();
function log(msg, cls) {
  const s = Math.floor((performance.now() - t0) / 1000);
  const ts = `T+${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.innerHTML = `<span>${ts}</span>`;
  div.appendChild(document.createTextNode(msg));
  logEl.appendChild(div);
  while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
}
function setStatus(txt, mode) {
  $('#stTxt').textContent = txt;
  const st = $('#st');
  st.classList.toggle('warn', mode === 'warn');
  st.classList.toggle('hot', mode === 'hot');
}
let pipIdx = -1;
function renderPips() {
  const d = DATA[cur.id];
  $('#pips').innerHTML = d.seq.filter((s) => s.pip).map((s, i) => `<span class="pip${i < pipIdx ? ' done' : i === pipIdx ? ' now' : ''}">${s.pip}</span>`).join('');
}
const cdEl = $('#cd'), cdT = $('#cdT'), cdS = $('#cdS');
function showCD(txt, sub) {
  if (!txt) { cdEl.classList.remove('on'); return; }
  cdT.textContent = txt;
  cdS.textContent = sub;
  cdT.classList.remove('tick');
  void cdT.offsetWidth;
  cdT.classList.add('tick');
  cdEl.classList.add('on');
}

/* ---------- Zündsequenz ---------- */
const ign = $('#ign'), ignTxt = $('#ignTxt');
function updateBtn() {
  const d = DATA[cur.id];
  ign.classList.remove('abort', 'run', 'pulse');
  ign.disabled = false;
  if (seqState === 'idle') { ignTxt.textContent = d.ign; ign.classList.add('pulse'); }
  else if (seqState === 'count') { ignTxt.textContent = 'ABBRECHEN'; ign.classList.add('abort'); }
  else if (seqState === 'run') {
    if (cur.id === 'solid') { ignTxt.textContent = 'NICHT ABSCHALTBAR'; ign.disabled = true; }
    else { ignTxt.textContent = cur.id === 'ion' ? 'STRAHL AUS' : 'ABSCHALTEN'; ign.classList.add('run'); }
  } else if (seqState === 'burnt') { ignTxt.textContent = 'NEUER TREIBSATZ'; ign.classList.add('pulse'); }
  $('#sch').classList.toggle('sch-live', seqState === 'run');
}
const RUN = {
  feedHalf: () => tween(flow, { feed: 0.5 }, { dur: 1 }),
  feedFull: () => tween(flow, { feed: 1 }, { dur: 1 }),
  ggOn: () => tween(flow, { gg: 1, feed: 1 }, { dur: 1.4 }),
  mainOn: () => { tween(flow, { hot: 1 }, { dur: 0.7 }); tween(flow, { plume: 1 }, { dur: 1.1, delay: 0.2 }); },
  ionOn: () => tween(flow, { ion: 1 }, { dur: 1 }),
  beamOn: () => { tween(flow, { beam: 1 }, { dur: 0.9 }); tween(flow, { plume: 1 }, { dur: 1.2 }); },
  elecOn: () => tween(flow, { elec: 1 }, { dur: 0.8 }),
  solidIgnite: () => {
    tween(flow, { hot: 1 }, { dur: 0.5 });
    tween(flow, { plume: 1 }, { dur: 0.8, delay: 0.1 });
    tween(ENG.solid.burn.uBurnR, { value: 0.7 }, { dur: 12.4, ease: EASE.lin, exact: true });
  }
};
async function ignite() {
  if (!ready || seqState !== 'idle') return;
  const tok = ++seqTok;
  const e = cur;
  const d = DATA[e.id];
  seqState = 'count';
  pipIdx = 0;
  updateBtn();
  renderPips();
  setStatus(e.id === 'ion' ? 'STRAHLSEQUENZ' : 'ZÜNDSEQUENZ', 'warn');
  log(e.id === 'ion' ? 'Freigabe erteilt · Strahlsequenz gestartet' : 'Freigabe erteilt · Zündsequenz gestartet', 'amb');
  let tPrev = 0;
  for (let i = 0; i < d.seq.length; i++) {
    const s = d.seq[i];
    if (s.t > tPrev) await wait(s.t - tPrev);
    if (tok !== seqTok) return;
    tPrev = s.t;
    pipIdx = i;
    renderPips();
    if (s.cd !== undefined) showCD(s.cd, e.id === 'ion' ? 'STRAHLSEQUENZ' : 'ZÜNDSEQUENZ');
    if (s.msg) log(s.msg, s.cls);
    if (s.run) RUN[s.run]();
    if (i === d.seq.length - 2) seqState = 'run';
    updateBtn();
  }
  pipIdx = d.seq.length;
  renderPips();
  await wait(0.6);
  if (tok !== seqTok) return;
  showCD('');
  setStatus(e.id === 'ion' ? 'STRAHL AKTIV' : 'NENNBETRIEB', 'hot');
  if (e.id === 'solid') {
    await wait(10.5);
    if (tok !== seqTok) return;
    log('Brennschluss · Treibsatz vollständig abgebrannt', 'amb');
    tween(flow, { hot: 0, plume: 0 }, { dur: 1.6 });
    seqState = 'burnt';
    setStatus('BRENNSCHLUSS');
    updateBtn();
  }
}
function shutdown(silent) {
  ++seqTok;
  const wasActive = seqState === 'run' || seqState === 'count';
  seqState = 'idle';
  pipIdx = -1;
  showCD('');
  tween(flow, { feed: 0, gg: 0, hot: 0, plume: 0, ion: 0, beam: 0, elec: 0 }, { dur: silent ? 0.4 : 1.2 });
  if (cur) {
    renderPips();
    updateBtn();
    if (!silent && wasActive) { log(cur.id === 'ion' ? 'Strahl aus · Gitterspannung abgeschaltet' : 'Abschaltung · Ventile geschlossen', 'cy'); setStatus('BEREIT'); }
  }
}
ign.addEventListener('click', () => {
  if (!cur || !ready) return;
  if (seqState === 'idle') ignite();
  else if (seqState === 'count') { shutdown(false); log('Sequenz abgebrochen', 'amb'); }
  else if (seqState === 'run' && cur.id !== 'solid') shutdown(false);
  else if (seqState === 'burnt') {
    tween(ENG.solid.burn.uBurnR, { value: 0.2 }, { dur: 1.4, ease: EASE.inOut });
    seqState = 'idle';
    pipIdx = -1;
    renderPips();
    updateBtn();
    setStatus('BEREIT');
    log('Neuer Treibsatz eingesetzt', 'cy');
  }
});

/* ---------- Kamera ---------- */
function viewPose(e) {
  const V = e.view;
  const aspect = viewW / Math.max(1, viewH);
  const t = Math.tan(camera.fov * Math.PI / 360);
  const dist = Math.max(V.h / (2 * t), V.w / (2 * t * aspect)) * 1.04 + 0.8;
  const dir = new THREE.Vector3(Math.sin(V.az) * Math.cos(V.el), Math.sin(V.el), Math.cos(V.az) * Math.cos(V.el));
  const target = new THREE.Vector3(V.cx, V.cy, 0);
  return { target, pos: target.clone().addScaledVector(dir, dist) };
}
let camTw = null;
function flyTo(pose, dur, arc) {
  if (camTw) camTw.dead = true;
  const p0 = camera.position.clone(), q0 = controls.target.clone();
  const o = { k: 0 };
  const dvec = new THREE.Vector3();
  controls.enabled = false;
  camTw = tween(o, { k: 1 }, {
    dur, ease: EASE.inOut,
    onUpdate() {
      const e = o.k;
      camera.position.lerpVectors(p0, pose.pos, e);
      controls.target.lerpVectors(q0, pose.target, e);
      dvec.copy(camera.position).sub(controls.target).normalize();
      camera.position.addScaledVector(dvec, Math.sin(Math.PI * e) * arc);
    },
    onComplete() { controls.enabled = true; camTw = null; }
  });
}

/* ---------- Triebwerkswechsel ---------- */
async function switchEngine(id) {
  const nxt = ENG[id];
  if (cur === nxt) return;
  const tok = ++swTok;
  shutdown(true);
  const old = cur;
  cur = nxt;
  ready = false;
  updateTabs();
  renderBrief();
  renderTele();
  renderIsp();
  renderSchem();
  renderLegend();
  renderPips();
  updateBtn();
  scramble($('#hudName'), DATA[id].title, 0.8);
  setStatus('TRIEBWERK WIRD GELADEN', 'warn');
  log(`Triebwerk ${DATA[id].idx} gewählt · ${DATA[id].title}`);
  for (const k of ORDER) { const e = ENG[k]; if (e !== old && e !== nxt) e.group.visible = false; }
  tween(PART, { a: 0 }, { dur: 0.35 });
  tween(coFade, { a: 0 }, { dur: 0.25 });
  if (old) {
    killTweensOf(old.u.uMin); killTweensOf(old.u.uMax);
    old.u.uMin.value = Math.max(old.u.uMin.value, -6.5);
    tween(old.u.uMin, { value: 7 }, { dur: 1.15, ease: EASE.inOut, onComplete() { if (cur !== old) old.group.visible = false; } });
  }
  flyTo(viewPose(nxt), old ? 2.0 : 2.4, old ? 2.4 : 0);
  await wait(old ? 0.7 : 0.25);
  if (tok !== swTok) return;
  killTweensOf(nxt.u.uMin); killTweensOf(nxt.u.uMax);
  nxt.u.uMin.value = -60;
  nxt.u.uMax.value = -6.5;
  applyParts(nxt, true);
  if (id === 'solid') { killTweensOf(nxt.burn.uBurnR); nxt.burn.uBurnR.value = 0.2; }
  nxt.group.visible = true;
  buildCallouts();
  await tweenP(nxt.u.uMax, { value: 7 }, { dur: 1.5, ease: EASE.inOut });
  if (tok !== swTok) return;
  nxt.u.uMax.value = 60;
  assignParticles(nxt);
  ready = true;
  tween(PART, { a: 1 }, { dur: 0.6 });
  tween(coFade, { a: 1 }, { dur: 0.6 });
  measureCallouts();
  setStatus('BEREIT');
  updateBtn();
  if (firstLoad) {
    firstLoad = false;
    await wait(0.5);
    if (tok === swTok) ignite();
  }
}

/* ---------- Tastatur ---------- */
window.addEventListener('keydown', (ev) => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === '1' || ev.key === '2' || ev.key === '3') setLevel(+ev.key);
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
    if (!cur) return;
    const i = ORDER.indexOf(cur.id);
    const n = (i + (ev.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length;
    switchEngine(ORDER[n]);
    const b = tablist.querySelector(`[data-id="${ORDER[n]}"]`);
    if (b && document.activeElement && document.activeElement.classList.contains('tab')) b.focus();
  } else if (ev.key === 'z' || ev.key === 'Z') ign.click();
});

/* ---------- Diagramm: Schubniveau ---------- */
const chart = $('#chart');
const cctx = chart.getContext('2d');
const hist = new Float32Array(150);
let thrVal = 0, chartTick = 0;
function sizeChart() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = chart.clientWidth || 280, h = chart.clientHeight || 64;
  chart.width = Math.round(w * dpr);
  chart.height = Math.round(h * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawChart() {
  const w = chart.clientWidth || 280, h = chart.clientHeight || 64;
  cctx.clearRect(0, 0, w, h);
  cctx.strokeStyle = 'rgba(95,227,255,.10)';
  cctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { const y = Math.round(h * i / 4) + 0.5; cctx.beginPath(); cctx.moveTo(0, y); cctx.lineTo(w, y); cctx.stroke(); }
  const n = hist.length;
  cctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = w * i / (n - 1), y = h - 3 - (h - 8) * hist[i];
    if (i) cctx.lineTo(x, y); else cctx.moveTo(x, y);
  }
  cctx.strokeStyle = '#ffb547';
  cctx.lineWidth = 1.4;
  cctx.stroke();
  cctx.lineTo(w, h); cctx.lineTo(0, h); cctx.closePath();
  const gr = cctx.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, 'rgba(255,181,71,.22)'); gr.addColorStop(1, 'rgba(255,181,71,0)');
  cctx.fillStyle = gr;
  cctx.fill();
}

/* ---------- Größe ---------- */
function resize() {
  const r = viewEl.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  const changed = Math.abs(w - viewW) > 1 || Math.abs(h - viewH) > 1;
  viewW = w; viewH = h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value = renderer.getPixelRatio() * h / (2 * Math.tan(camera.fov * Math.PI / 360));
  if (changed && cur && ready && !camTw) {
    const pose = viewPose(cur);
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, pose.pos.distanceTo(pose.target));
  }
  sizeChart();
  measureCallouts();
}
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(viewEl);
window.addEventListener('resize', resize);

/* ---------- Render-Loop ---------- */
let running = true, last = performance.now(), hudTick = 0;
const camRo = $('#camRo'), thrPct = $('#thrPct');
function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  clock += dt;
  stepTweens(dt);
  if (!REDUCED) U_TIME.value += dt;

  for (const id of ORDER) {
    const e = ENG[id];
    const target = e === cur ? flow.plume : 0;
    e.plumeU.uInt.value += (target - e.plumeU.uInt.value) * Math.min(1, dt * 6);
    if (e === cur && !REDUCED) {
      const w = (0.6 + 9 * flow.feed * (0.4 + 0.6 * Math.max(flow.gg, flow.hot))) * dt;
      for (const s of e.spinners) s.rotation.x += w;
    }
  }
  if (cur) {
    cur.burn.uBurn.value = cur.id === 'solid' ? flow.hot : 0;
    pMat.uniforms.uMin.value = cur.u.uMin.value;
    pMat.uniforms.uMax.value = cur.u.uMax.value;
  }
  pMat.uniforms.uGlobal.value = PART.a;
  updateParticles(dt);

  const idle = clock - lastUser > 5 && !camTw;
  controls.autoRotate = idle && !REDUCED;
  controls.autoRotateSpeed = 0.35 * Math.sin(clock * 0.12);
  controls.update(dt);
  renderer.render(scene, camera);
  updateCallouts();

  if (++hudTick % 6 === 0) {
    const az = THREE.MathUtils.radToDeg(controls.getAzimuthalAngle());
    const el = 90 - THREE.MathUtils.radToDeg(controls.getPolarAngle());
    const r = camera.position.distanceTo(controls.target);
    camRo.textContent = `AZ ${az >= 0 ? '+' : '−'}${String(Math.abs(Math.round(az))).padStart(3, '0')}° · EL ${el >= 0 ? '+' : '−'}${String(Math.abs(Math.round(el))).padStart(2, '0')}° · R ${fmt(r, 1)}`;
  }
  const main = cur && cur.id === 'ion' ? flow.beam : flow.hot;
  const noise = main > 0.02 && !REDUCED ? (Math.random() - 0.5) * 0.025 : 0;
  thrVal = clamp(main * (cur && cur.id === 'solid' ? 1 - 0.25 * sstep(0.2, 0.7, cur.burn.uBurnR.value) + 0.15 * Math.sin(Math.PI * clamp((cur.burn.uBurnR.value - 0.2) / 0.5, 0, 1)) : 1) + noise, 0, 1);
  if (++chartTick % 2 === 0) {
    if (REDUCED) hist.fill(thrVal); else { hist.copyWithin(0, 1); hist[hist.length - 1] = thrVal; }
    drawChart();
    thrPct.textContent = String(Math.round(thrVal * 100));
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) running = false;
  else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
});

/* ---------- Start ---------- */
resize();
setLevel(2, true);
log('Leitstand online · Freigabestufe 2 · FORTGESCHRITTEN', 'cy');
switchEngine('merlin');
requestAnimationFrame(frame);
</script>
