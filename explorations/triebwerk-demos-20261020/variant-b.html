<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Reise – Raketentriebwerke</title>
<meta name="description" content="Eine Reise durch das Raketentriebwerk: vom Tank bis in den Abgasstrahl – in drei Verständnisstufen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #d0780a; }
:root{
  --paper:#f3eee4; --paper-2:#ebe3d4; --paper-a:rgba(243,238,228,.88);
  --ink:#17140f; --ink-2:#45403a; --ink-3:#857d70;
  --rule:rgba(23,20,15,.13); --rule-2:rgba(23,20,15,.28);
  --accent:#d0780a;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.65,.05,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  transition: --accent .9s var(--ease);
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden;
  background:
    radial-gradient(1200px 800px at 78% 42%, rgba(255,250,240,.9), rgba(255,250,240,0) 70%),
    radial-gradient(900px 700px at 10% 110%, var(--paper-2), rgba(0,0,0,0) 70%),
    var(--paper);
  background-attachment:fixed;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.32;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .09  0 0 0 0 .05  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- Canvas & labels ---------- */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lab{position:absolute;left:0;top:0;display:flex;align-items:center;white-space:nowrap;opacity:0;
  transition:opacity .45s var(--ease-out);will-change:transform,opacity}
.lab.on{opacity:1}
.lab i{width:7px;height:7px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);flex:none}
.lab b{width:26px;height:1px;background:var(--ink);opacity:.7;flex:none}
.lab span{font:500 11.5px/1.2 var(--sans);letter-spacing:.02em;padding:4px 8px;background:var(--paper-a);
  border:1px solid var(--rule);border-radius:3px;color:var(--ink)}
.lab.lv3 span{font-family:var(--mono);font-size:10.5px;letter-spacing:0}

/* ---------- Top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:16px;padding:16px clamp(16px,3vw,40px);
  background:linear-gradient(var(--paper) 0%, rgba(243,238,228,.86) 62%, rgba(243,238,228,0) 100%)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:italic 400 24px/1 var(--serif);font-variation-settings:'opsz' 144;letter-spacing:-.01em}
.brand small{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.engines{position:relative;display:flex;gap:4px;justify-self:center}
.engines button{position:relative;padding:8px 12px 10px;font:500 13.5px/1 var(--sans);letter-spacing:.01em;color:var(--ink-3);
  transition:color .35s var(--ease-out);display:flex;align-items:center;gap:7px;white-space:nowrap}
.engines button .d{width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.55;transition:opacity .3s, transform .4s var(--ease-out)}
.engines button[aria-pressed="true"]{color:var(--ink)}
.engines button[aria-pressed="true"] .d{opacity:1;transform:scale(1.25)}
.engines button:hover{color:var(--ink)}
.engines .sep{align-self:center;color:var(--rule-2);font-size:12px;user-select:none}
.engines .ink{position:absolute;bottom:2px;height:2px;left:0;width:0;background:var(--accent);border-radius:2px;
  transition:left .6s var(--ease), width .6s var(--ease)}
.short{display:none}
.lvl{justify-self:end;position:relative;display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--rule-2);
  background:rgba(243,238,228,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lvl button{position:relative;z-index:1;padding:7px 14px;border-radius:999px;font:500 12.5px/1 var(--sans);letter-spacing:.01em;
  color:var(--ink-2);transition:color .4s var(--ease-out);white-space:nowrap}
.lvl button[aria-pressed="true"]{color:var(--paper)}
.lvl .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:999px;background:var(--ink);
  transition:left .55s var(--ease), width .55s var(--ease)}

/* ---------- Rail (journey progress) ---------- */
.rail{position:fixed;right:clamp(16px,2.6vw,36px);top:50%;transform:translateY(-50%);z-index:15;--p:0}
.rail ol{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column}
.rail li{height:34px;display:flex;align-items:center;justify-content:flex-end}
.rail button{display:flex;align-items:center;gap:12px;padding:4px 0}
.rail .rl{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);transition:color .35s, transform .5s var(--ease-out)}
.rail .rd{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--paper);position:relative;z-index:1;
  transition:border-color .35s, background .35s, transform .5s var(--ease-out)}
.rail li.done .rd{border-color:var(--ink);background:var(--ink)}
.rail li.cur .rd{border-color:var(--accent);background:var(--accent);transform:scale(1.45)}
.rail li.cur .rl{color:var(--ink);transform:translateX(-4px)}
.rail .track{position:absolute;right:4px;top:17px;bottom:17px;width:1px;background:var(--rule-2)}
.rail .fill{position:absolute;inset:0;background:var(--ink);transform-origin:top;transform:scaleY(var(--p))}
.rail .rtitle{font:italic 400 13px/1.2 var(--serif);color:var(--ink-3);text-align:right;margin:0 0 10px}

/* ---------- HUD ---------- */
.hud{position:fixed;right:clamp(16px,2.6vw,36px);bottom:22px;z-index:15;width:236px;padding:14px 16px 12px;
  background:var(--paper-a);border:1px solid var(--rule);border-radius:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .5s var(--ease-out), transform .5s var(--ease-out)}
.hud.hide{opacity:0;transform:translateY(10px);pointer-events:none}
.hud-top{display:flex;align-items:baseline;gap:10px}
.hud-num{font:500 11px/1 var(--mono);color:var(--ink-3);letter-spacing:.06em}
.hud-name{font:italic 400 19px/1.1 var(--serif);font-variation-settings:'opsz' 60}
.g{margin-top:10px}
.g-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-l{font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.g-v{font:500 12.5px/1.2 var(--mono);color:var(--ink);text-align:right}
.g-bar{position:relative;height:6px;border-radius:3px;margin:8px 0 4px;background:var(--grad)}
.g-mk{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);left:0;transform:translateX(-1px);transition:opacity .3s}
.g-ticks{display:flex;justify-content:space-between;font:400 9.5px/1 var(--mono);color:var(--ink-3)}

/* ---------- Story ---------- */
main{position:relative;z-index:3}
.intro{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:120px clamp(20px,7vw,110px) 80px}
.intro-in{max-width:min(640px,48vw);position:relative}
.kick{font:500 11.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:12px}
.kick::before{content:'';width:28px;height:1px;background:var(--accent)}
h1{font:300 clamp(46px,7.2vw,118px)/.94 var(--serif);font-variation-settings:'opsz' 144, 'SOFT' 30;letter-spacing:-.035em;margin:22px 0 26px}
h1 em{font-style:italic;font-weight:300;color:var(--accent)}
.deck{font:400 clamp(17px,1.45vw,21px)/1.55 var(--sans);color:var(--ink-2);max-width:38ch;margin:0}
.prin{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule);font-size:15.5px;color:var(--ink-2);max-width:44ch}
.prin strong{font-weight:600;color:var(--ink)}
.ex{margin-top:16px;font:400 12px/1.5 var(--mono);color:var(--ink-3)}
.cue{margin-top:44px;display:flex;align-items:center;gap:14px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.cue i{width:1px;height:46px;background:var(--rule-2);position:relative;overflow:hidden}
.cue i::after{content:'';position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:cue 2.2s var(--ease) infinite}
@keyframes cue{to{top:110%}}
.route{margin-top:18px;font:italic 400 15px/1.5 var(--serif);color:var(--ink-3)}
.route span{white-space:nowrap}

.chapter{min-height:128vh;display:flex;align-items:center;padding:0 clamp(20px,7vw,110px)}
.card{position:relative;width:min(470px,40vw);padding:30px 0 26px;transition:opacity .6s var(--ease-out), transform .8s var(--ease-out)}
.card::before{content:'';position:absolute;left:-34px;right:-34px;top:-10px;bottom:-14px;z-index:-1;border-radius:6px;
  background:radial-gradient(closest-side, rgba(243,238,228,.92), rgba(243,238,228,.75) 70%, rgba(243,238,228,0));filter:blur(6px)}
.bignum{position:absolute;right:-6px;top:-34px;font:300 150px/1 var(--serif);font-variation-settings:'opsz' 144;letter-spacing:-.05em;
  color:transparent;-webkit-text-stroke:1px var(--rule-2);pointer-events:none;user-select:none;z-index:-1}
.ck{font:500 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:10px;align-items:center}
.ck .n{color:var(--accent);font-weight:500}
.ck .r{flex:0 0 26px;height:1px;background:var(--rule-2)}
.ct{font:350 clamp(34px,3.7vw,58px)/1.0 var(--serif);font-variation-settings:'opsz' 144;letter-spacing:-.028em;margin:16px 0 18px;text-wrap:balance}
.ct em{font-style:italic;color:var(--accent)}
.cb{margin:0;color:var(--ink-2);font-size:17px;line-height:1.62;max-width:40ch;text-wrap:pretty}
.chapter:first-child .cb::first-letter{font:400 3.3em/.8 var(--serif);float:left;margin:.06em .1em 0 0;color:var(--ink)}
.note{position:absolute;left:calc(100% + 40px);top:62px;width:230px;padding:2px 0 2px 16px;border-left:1px solid var(--accent);
  opacity:0;transform:translateX(-10px);transition:opacity .6s var(--ease-out), transform .7s var(--ease-out);pointer-events:none}
.lv3 .note{opacity:1;transform:none}
.note .nl{font:500 9.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.note .nf{font:italic 400 20px/1.3 var(--serif);font-variation-settings:'opsz' 36;color:var(--ink);margin:0 0 4px}
.note .nc{font:400 12.5px/1.45 var(--sans);color:var(--ink-3);margin:0 0 12px}
.intro .note{top:auto;bottom:0}

[data-k]{transition:opacity .26s var(--ease-out), filter .26s var(--ease-out)}
.swapping [data-k]{opacity:0;filter:blur(4px)}
#story.switching .card, #story.switching .intro-in, #story.switching .out-in{opacity:0;transform:translateY(26px)}
.intro-in,.out-in{transition:opacity .5s var(--ease-out), transform .7s var(--ease-out)}

.outro{min-height:110vh;display:flex;align-items:center;padding:120px clamp(20px,7vw,110px) 140px}
.out-in{max-width:min(760px,62vw)}
.outro h2{font:300 clamp(40px,5.6vw,88px)/.98 var(--serif);font-variation-settings:'opsz' 144;letter-spacing:-.035em;margin:18px 0 14px}
.outro h2 em{font-style:italic;color:var(--accent)}
.sum{font-size:18px;color:var(--ink-2);max-width:46ch;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:40px 0 34px;border-top:1px solid var(--ink)}
.fact{padding:18px 18px 4px 0;border-right:1px solid var(--rule)}
.fact:last-child{border-right:0}
.fact + .fact{padding-left:18px}
.fv{font:300 clamp(28px,3.3vw,48px)/1.02 var(--serif);font-variation-settings:'opsz' 144;letter-spacing:-.025em}
.fv.sm{font-size:clamp(22px,2.2vw,32px)}
.fl{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.next{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;border:1px solid var(--ink);border-radius:999px;font:500 14px/1 var(--sans);
  transition:background .35s var(--ease-out), color .35s var(--ease-out)}
.next:hover{background:var(--ink);color:var(--paper)}
.next em{font:italic 400 17px/1 var(--serif)}
.foot{margin-top:56px;font:400 11px/1.6 var(--mono);color:var(--ink-3);max-width:60ch}

.badge{position:fixed;left:14px;bottom:12px;z-index:25;font:500 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink-2);
  padding:7px 10px;border:1px solid var(--rule-2);border-radius:999px;background:var(--paper-a);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nogl-msg{display:none}
.nogl .nogl-msg{display:block;position:fixed;right:20px;top:110px;z-index:5;font:400 12px/1.4 var(--mono);color:var(--ink-3);max-width:260px}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .note{left:auto;right:auto;position:relative;top:auto;width:auto;margin-top:22px;padding:12px 0 2px 16px;display:none}
  .lv3 .note{display:block}
  .intro .note{bottom:auto}
}
@media (max-width:1000px){
  .rail .rl{display:none}
  .rail .rtitle{display:none}
  .brand small{display:none}
}
@media (max-width:760px){
  body{font-size:16px}
  .bar{grid-template-columns:1fr;justify-items:center;gap:10px;padding:10px 12px 14px}
  .brand{display:none}
  .lvl{justify-self:center}
  .lvl button{padding:7px 12px;font-size:12px}
  .engines{gap:0}
  .engines button{padding:7px 8px 9px;font-size:12.5px;gap:5px}
  .engines .sep{display:none}
  .rail{top:104px;left:16px;right:16px;transform:none}
  .rail ol{flex-direction:row;justify-content:space-between}
  .rail li{height:14px;width:14px;justify-content:center}
  .rail button{padding:0}
  .rail .track{left:7px;right:7px;top:7px;bottom:auto;width:auto;height:1px}
  .rail .fill{transform-origin:left;transform:scaleX(var(--p))}
  .hud{left:16px;right:16px;top:126px;bottom:auto;width:auto;padding:6px 10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .hud .g{margin:0;flex:0 1 46%}
  .hud .g-bar,.hud .g-ticks{display:none}
  .hud .g-row{justify-content:flex-end}
  .hud .g-l{display:none}
  .hud-name{font-size:16px}
  .intro{align-items:flex-end;padding:180px 16px 90px}
  .intro-in{max-width:100%}
  .chapter{padding:0 16px;align-items:center}
  .card{width:100%;transform:translateY(17vh);padding:22px 18px 20px}
  .card::before{left:0;right:0;top:0;bottom:0;filter:none;background:var(--paper-a);border:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #story.switching .card{transform:translateY(calc(17vh + 26px))}
  .bignum{font-size:96px;top:-26px;right:8px}
  .ct{font-size:34px;margin:12px 0 12px}
  .cb{font-size:15.5px}
  .outro{padding:160px 16px 120px}
  .out-in{max-width:100%}
  .facts{grid-template-columns:1fr}
  .fact{border-right:0;border-bottom:1px solid var(--rule);padding:14px 0 12px}
  .fact + .fact{padding-left:0}
  .badge{font-size:9.5px;padding:5px 8px;left:10px;bottom:8px}
}
@media (max-width:440px){
  .long{display:none}.short{display:inline}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body class="lv2">
<canvas id="gl" aria-hidden="true"></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="bar">
  <div class="brand"><b>Die Reise</b><small>durch ein Raketentriebwerk</small></div>
  <nav class="engines" id="engines" aria-label="Triebwerkstyp"></nav>
  <div class="lvl" id="lvl" role="group" aria-label="Verständnisstufe">
    <span class="thumb"></span>
    <button data-l="1" aria-pressed="false">Einsteiger</button>
    <button data-l="2" aria-pressed="true">Fortgeschritten</button>
    <button data-l="3" aria-pressed="false">Experte</button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Stationen der Reise"></nav>

<div class="hud" id="hud" aria-live="polite">
  <div class="hud-top"><span class="hud-num" id="hudNum">00/00</span><span class="hud-name" id="hudName">Überblick</span></div>
  <div class="g" id="gauge">
    <div class="g-row"><span class="g-l" id="gL">Machzahl</span><span class="g-v" id="gV">—</span></div>
    <div class="g-bar" id="gBar"><i class="g-mk" id="gMk"></i></div>
    <div class="g-ticks" id="gT"><span>0</span><span>1</span><span>3</span></div>
  </div>
</div>

<main id="story">
  <section class="intro" id="intro"></section>
  <div id="chapters"></div>
  <section class="outro" id="outro"></section>
</main>

<div class="badge">Variante B · Die Reise</div>
<div class="nogl-msg">3D-Ansicht nicht verfügbar (WebGL fehlt). Die Texte funktionieren trotzdem.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================================
   Helpers
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const pad = n => String(n).padStart(2, '0');
const de = (v, d = 1) => v.toFixed(d).replace('.', ',');
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const mix3 = (a, b, t, o) => { o[0] = lerp(a[0], b[0], t); o[1] = lerp(a[1], b[1], t); o[2] = lerp(a[2], b[2], t); return o; };
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = () => window.innerWidth <= 760;

/* =========================================================================
   Content (Quelle: docs/inhalt-triebwerke.md)
   ========================================================================= */
const LEVEL_NAMES = ['Einsteiger', 'Fortgeschritten', 'Experte'];

const PRINCIPLE = [

const tweens = [];
function tween(obj, key, to, dur, o = {}) {

  if (REDUCED || dur <= 0) { obj[key] = to; if (o.done) o.done(); return; }

    if (!w.started) { w.from = w.obj[w.key]; w.started = true; }
    w.t = Math.min(1, w.t + dt / w.dur);

    else { const j = st.findIndex(s => s.k === key); target = j >= 0 ? j : Math.round(frac * (st.length - 1)); }

  const plumeU = {

  };
  const plumeMat = new THREE.ShaderMaterial({

  function part(e, obj, o = {}) {

  const pv = new THREE.Vector3();
  function updateLabels(ov, key) {
    const w = window.innerWidth, h = window.innerHeight, mob = isMobile();
    for (const l of LABELS) {
      let show = l.e === state.engine && !switching && state.level >= l.minLevel && labelText(l) !== '' && state.ovMorph.v < 0.3;
      if (show) show = ov > 0.55 ? (l.major && !mob) : (ov < 0.35 && l.keys.includes(key));
      if (show) {
        pv.copy(l.pos).project(camera);
        if (pv.z > 1 || pv.z < -1) show = false;
        else {
          const sx = (pv.x * 0.5 + 0.5) * w, sy = (-pv.y * 0.5 + 0.5) * h;
          if (sx < -20 || sx > w - 60 || sy < 70 || sy > h - 20) show = false;
          l.el.style.transform = `translate3d(${(sx - 3.5).toFixed(1)}px, ${(sy - 3.5).toFixed(1)}px, 0)`;
        }
      }
      if (show !== l.on) { l.on = show; l.el.classList.toggle('on', show); }
    }
  }

  /* ---------- Hero curves ---------- */
  const HC = {};
  for (const e of ORDER) HC[e] = ROUTES[e].curve;
  function heroT(e, s) {
    const st = ENG[e].st, n = st.length, N = ENG[e].cp.length - 1, T = i => st[i].ci / N;
    if (s <= 0) return T(0);
    if (s >= n - 1) return T(n - 1);
    const i = Math.floor(s), f = smooth(0.12, 0.88, s - i);
    return lerp(T(i), T(i + 1), f);
  }

  /* ---------- Morph / engine switch ---------- */
  let morphFrom = 'gg', morphTo = 'gg';
  const plumeFrom = { re: 1, len: 8, xe: 5 }, accFrom = new THREE.Color(), accTo = new THREE.Color();
  function beginMorph(from, to) {
    fromProf.set(curProf);
    morphFrom = from; morphTo = to;
    plumeFrom.re = plumeGroup.scale.x; plumeFrom.len = plumeGroup.scale.y; plumeFrom.xe = plumeGroup.position.x;
    state.morph.m = 0;
    tween(state.morph, 'm', 1, 1.6, { ease: easeIO });
    state.ovMorph.v = 0;
    tween(state.ovMorph, 'v', 1, 0.6, { ease: easeIO, done: () => tween(state.ovMorph, 'v', 0, 1.1, { delay: 0.35, ease: easeIO }) });
    tween(state.VIS[from], 'v', 0, 0.7, { ease: easeIO });
    tween(state.VIS[to], 'v', 1, 1.3, { delay: 0.45, ease: easeIO });
    setHeroAccent(ENG[to].accent);
    ROUTES[to].done.material.color.set(ENG[to].accent);
  }
  // initial assembly
  fromProf.set(curProf);
  state.morph.m = 0;
  tween(state.morph, 'm', 1, 1.8, { ease: easeIO, delay: 0.2 });
  tween(state.VIS.gg, 'v', 1, 1.6, { delay: 0.35, ease: easeIO });
  let lastM = -1;

  /* ---------- Camera ---------- */
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), heroP = new THREE.Vector3();
  const jPos = new THREE.Vector3(), jLook = new THREE.Vector3(), oPos = new THREE.Vector3(), oLook = new THREE.Vector3();
  const offA = new THREE.Vector3(), offB = new THREE.Vector3(), fA = new THREE.Vector3(), fB = new THREE.Vector3();
  let camInit = false;
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    if (w > 760) camera.setViewOffset(w, h, -w * (w > 1180 ? 0.17 : 0.13), 0, w, h);
    else camera.setViewOffset(w, h, 0, h * 0.2, w, h);
    camera.updateProjectionMatrix();
    pU.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  }
  resize();
  function stationLook(e, i, out, hp) {
    const s = ENG[e].st[i];
    if (s.focus) { out.set(...s.focus); out.lerp(hp, 1 - s.fm); }
    else if (s.k === 'exhaust') { out.set(GEO[e].xe + 2.2, 0, 0); out.lerp(hp, 0.5); }
    else if (s.k === 'tank' && e !== 'ion') { out.set(-8.6, 0, 0); out.lerp(hp, 0.5); }
    else out.copy(hp);
    return out;
  }
  function updateCamera(dt) {
    const e = state.engine, E = ENG[e], n = E.st.length, s = state.s, w = window.innerWidth, h = window.innerHeight, asp = w / h;
    const t = heroT(e, clamp(s, 0, n - 1));
    HC[e].getPoint(t, heroP);
    // hero wobble
    if (!REDUCED) heroP.y += Math.sin(state.time * 2.1) * 0.02;
    const k = asp < 1 ? Math.pow(1 / asp, 0.62) : 1;
    const sc = clamp(s, 0, n - 1), i = Math.min(n - 2, Math.floor(sc)), f = smooth(0.12, 0.88, sc - i);
    offA.set(...CAM[E.st[i].k]); offB.set(...CAM[E.st[Math.min(n - 1, i + 1)].k]);
    stationLook(e, i, fA, heroP); stationLook(e, Math.min(n - 1, i + 1), fB, heroP);
    jLook.copy(fA).lerp(fB, f);
    jPos.copy(offA).lerp(offB, f).multiplyScalar(k).add(jLook);
    // overview
    const g = GEO[e], cx = g.ov[0], W = g.ov[1];
    const use = w > 760 ? 0.72 : 1.25;
    const d = W / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * Math.max(asp, 0.4) * use);
    const orbit = REDUCED ? 0 : Math.sin(state.time * 0.15) * 0.08;
    oLook.set(cx, w > 760 ? 0.2 : -0.2, 0);
    oPos.set(cx + d * (0.16 + orbit), d * 0.3, d).add(new THREE.Vector3(0, 0, 0));
    const ovScroll = s < 0 ? smooth(0, -0.85, s) : (s > n - 1 ? smooth(n - 1, n - 0.2, s) : 0);
    const ov = Math.max(ovScroll, easeIO(state.ovMorph.v) * 0.92);
    const tp = jPos.clone().lerp(oPos, ov), tl = jLook.clone().lerp(oLook, ov);
    if (!camInit || REDUCED) { camPos.copy(tp); camLook.copy(tl); camInit = true; }
    else { const a = 1 - Math.exp(-dt * 6); camPos.lerp(tp, a); camLook.lerp(tl, a); }
    camera.position.copy(camPos); camera.lookAt(camLook);
    hero.position.copy(heroP); halo.position.copy(heroP);
    const pulse = REDUCED ? 0 : (Math.sin(state.time * 3) * 0.5 + 0.5);
    const hs = lerp(0.42, 0.75, ov) * (asp < 1 ? 1.2 : 1);
    hero.scale.setScalar(hs); halo.scale.setScalar(hs * (1.6 + pulse * 0.9)); haloMat.opacity = 0.32 * (1 - pulse);
    const vis = state.VIS[e].v; heroMat.opacity = vis; haloMat.opacity *= vis;
    // route progress
    for (const en of ORDER) {
      const r = ROUTES[en];
      r.done.geometry.setDrawRange(0, en === e ? Math.max(2, Math.floor(t * 300) + 1) : 0);
    }
    return { ov, t };
  }

  /* ---------- Parts update ---------- */
  function levelFactor(p) {
    let f = 1;
    if (p.minLevel > 1) f *= state.LA[p.minLevel];
    if (p.maxLevel < 3) f *= 1 - state.LA[p.maxLevel + 1];
    return f;
  }
  function updateParts(dt, ov) {
    const s = state.s;
    for (const p of PARTS) {
      const ev = state.VIS[p.e].v;
      let v = clamp(ev * 1.6 - p.stagger * 0.6, 0, 1) * levelFactor(p);
      if (v <= 0.002) { p.obj.visible = false; continue; }
      p.obj.visible = true;
      if (p.kind === 'scale') { const k = Math.max(0.0001, easeOutBack(v)); p.obj.scale.set(p.base.x * k, p.base.y * k, p.base.z * k); }
      else if (p.kind === 'draw') { p.obj.geometry.setDrawRange(0, Math.floor(p.count * easeOut(v) / 3) * 3); }
      let op = p.kind === 'scale' ? 1 : v;
      let ghost = 0;
      if (p.st && p.e === state.engine) {
        const idx = ENG[p.e].st.findIndex(q => q.k === p.st);
        if (idx >= 0) ghost = smooth(idx + 0.55, idx + 1.25, s) * (1 - ov);
      }
      for (let j = 0; j < p.mats.length; j++) p.mats[j].opacity = p.baseOp[j] * op * (1 - 0.8 * ghost);
      if (p.spin) p.obj.rotation.x += dt * p.spin * (REDUCED ? 0.15 : 1);
    }
  }

  /* ---------- Frame ---------- */
  const uiHeatCol = new THREE.Color();
  function frame(dt) {
    const e = state.engine;
    // morph profile + plume
    const m = easeIO(state.morph.m);
    if (m !== lastM) {
      const to = PROF[morphTo === e ? e : e];
      for (let i = 0; i < NPROF * 2; i++) curProf[i] = lerp(fromProf[i], to[i], m);
      applyProfile(); lastM = m;
      const a = PLUME[morphFrom], b = PLUME[e], gA = GEO[morphFrom], gB = GEO[e];
      plumeGroup.position.x = lerp(plumeFrom.xe, gB.xe, m);
      plumeGroup.scale.set(lerp(plumeFrom.re, gB.re * 0.95, m), lerp(plumeFrom.len, gB.plume, m), lerp(plumeFrom.re, gB.re * 0.95, m));
      const v3 = (h1, h2) => { const x1 = hex3(h1), x2 = hex3(h2); return [lerp(x1[0], x2[0], m), lerp(x1[1], x2[1], m), lerp(x1[2], x2[2], m)]; };
      plumeU.uA.value.set(...v3(a.a, b.a)); plumeU.uB.value.set(...v3(a.b, b.b)); plumeU.uC.value.set(...v3(a.c, b.c));
      plumeU.uAlpha.value = lerp(a.al, b.al, m); plumeU.uFlick.value = REDUCED ? 0 : lerp(a.fl, b.fl, m);
      plumeU.uLen.value = gB.plume;
      U.heatRange.value.set(gB.x0 + (gB.dome || 0), gB.xe);
      uiHeatCol.set(e === 'ion' ? '#7b4fe0' : '#ff6a10').multiplyScalar(e === 'ion' ? 0.18 : 0.42);
      U.heat.value.copy(uiHeatCol).multiplyScalar(m);
      U.inner.value.set(e === 'ion' ? '#e7def5' : '#f1e3cd');
    }
    plumeU.uTime.value = state.time;
    plumeU.uDia.value = e === 'ion' ? 0 : state.LA[3];
    const { ov, t } = updateCamera(dt);
    updateParts(dt, ov);
    updateParticles(dt);
    colorOutline(state.machMix.v, e);
    renderer.render(scene, camera);
    return { ov, t };
  }

  function updateLabelTextsGL() { setLabelTexts(); }

  return { frame, resize, beginMorph, updateLabels, updateLabelTextsGL, heroP, renderer };
}

function updateLabelTexts() { if (gl) gl.updateLabelTextsGL(); }

/* =========================================================================
   HUD + Rail
   ========================================================================= */
const hudNum = $('#hudNum'), hudName = $('#hudName'), gL = $('#gL'), gV = $('#gV'), gMk = $('#gMk'), gBar = $('#gBar'), gT = $('#gT'), gauge = $('#gauge');
const GRAD_MACH = 'linear-gradient(90deg,#2b4aa6 0%,#f4c22b 28.6%,#d42a6a 100%)';
const GRAD_ION = 'linear-gradient(90deg,#a59cbf 0%,#7a3fe4 45%,#2a66e6 100%)';
let lastHudKey = '';
function updateHUD(idx, heroX) {
  const e = state.engine, E = ENG[e], n = E.st.length, lv = state.level;
  const st = idx >= 0 && idx < n ? E.st[idx] : null;
  const headKey = e + idx + lv;
  if (headKey !== lastHudKey) {
    lastHudKey = headKey;
    hudNum.textContent = st ? `${pad(idx + 1)}/${pad(n)}` : (idx < 0 ? 'Start' : 'Ziel');
    hudName.textContent = st ? st.n : (idx < 0 ? 'Überblick' : 'Bilanz');
    if (e === 'ion') {
      gBar.style.setProperty('--grad', GRAD_ION);
      gL.textContent = lv === 1 ? 'Tempo' : 'Zustand';
      gT.innerHTML = '<span>Xe</span><span>Xe⁺</span><span>Strahl</span>';
    } else {
      gBar.style.setProperty('--grad', GRAD_MACH);
      gL.textContent = lv === 1 ? 'Tempo' : 'Machzahl (Modell)';
      gT.innerHTML = lv === 1 ? '<span>langsam</span><span>Schall</span><span>schneller</span>' : '<span>0</span><span>1</span><span>3,5</span>';
    }
  }
  let val = '—', mk = -1;
  if (e === 'ion') {
    if (heroX < 0.1) { val = lv === 1 ? 'gemütlich' : 'neutrales Xenon'; mk = 0.04; }
    else if (heroX < 3.0) { const k = clamp((heroX - 0.1) / 2.9, 0, 1); val = lv === 1 ? (k > .5 ? 'aufgeladen' : 'wird aufgeladen') : (k > .5 ? 'Xe⁺ (Ion)' : 'Ionisation'); mk = 0.1 + k * 0.4; }
    else { val = lv === 1 ? 'superschnell' : (lv === 2 ? 'ca. 30–40 km/s' : 'ca. 30–40 km/s · Isp ca. 3000 s'); mk = Math.min(0.97, 0.55 + (heroX - 3) * 0.08); }
  } else {
    const g = GEO[e];
    const inside = e === 'solid' ? true : heroX >= g.x0 - 0.05;
    if (inside) {
      const M = machAt(e, heroX);
      if (lv === 1) val = M < 0.8 ? 'gemütlich' : M < 1.15 ? 'so schnell wie Schall' : 'schneller als Schall';
      else if (lv === 2) val = 'Ma ≈ ' + de(M, 1);
      else { const r = rWall(g, Math.min(heroX, g.xe)); val = `Ma ≈ ${de(M, 2)} · A/A* ≈ ${de((r / g.rt) ** 2, 1)}`; }
      mk = clamp(M / 3.5, 0, 1);
    } else { val = lv === 1 ? 'flüssig' : 'flüssig · noch keine Strömung in der Düse'; if (lv === 3) val = 'flüssig, kryogen'; }
  }
  gV.textContent = val;
  gMk.style.opacity = mk < 0 ? 0 : 1;
  if (mk >= 0) gMk.style.left = (mk * 100).toFixed(1) + '%';
}
function updateRail(idx, s) {
  const n = ENG[state.engine].st.length;
  railEl.style.setProperty('--p', clamp(s / (n - 1), 0, 1).toFixed(4));
  if (idx !== state.curIdx) {
    state.curIdx = idx;
    railEl.querySelectorAll('li').forEach((li, i) => { li.classList.toggle('cur', i === idx); li.classList.toggle('done', i < idx); });
  }
}

/* =========================================================================
   Loop
   ========================================================================= */
let running = true, last = performance.now();
function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  state.time += dt;
  stepTweens(dt);
  state.sT = scrollS();
  state.s = REDUCED ? state.sT : lerp(state.s, state.sT, 1 - Math.exp(-dt * 5));
  const E = ENG[state.engine], n = E.st.length;
  const idx = state.s < -0.5 ? -1 : state.s > n - 0.5 ? n : Math.round(clamp(state.s, 0, n - 1));
  const key = idx >= 0 && idx < n ? E.st[idx].k : null;
  const mt = (key === 'throat' || key === 'bell') ? 1 : key === 'exhaust' ? 0.55 : 0;
  if (Math.abs((state._mt ?? -1) - mt) > 1e-3) { state._mt = mt; tween(state.machMix, 'v', mt, 0.9, { ease: easeIO }); }
  let heroX = 0;
  if (gl) {
    const r = gl.frame(dt);
    heroX = gl.heroP.x;
    gl.updateLabels(r.ov, key);
  }
  updateHUD(idx, heroX);
  updateRail(idx, state.s);
  hudEl.classList.toggle('hide', idx < 0 || idx >= n);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) running = false;
  else if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
});

/* =========================================================================
   Boot
   ========================================================================= */
document.documentElement.style.setProperty('--accent', ENG[state.engine].accent);
renderStory();
layout();
state.sT = scrollS(); state.s = state.sT;
let rT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rT);
  rT = setTimeout(() => { if (gl) gl.resize(); layout(); }, 80);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
window.addEventListener('load', layout);
requestAnimationFrame(loop);
</script>
</body>
