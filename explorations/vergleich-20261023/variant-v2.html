<!doctype html>
<html lang="de" class="noanim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triebwerks-Duell</title>
<meta name="description" content="Variante V2 · Duell: zwei Triebwerke Seite an Seite, gespiegelte Kennzahl-Balken und ein Δv-Rennen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens 1:1 aus triebwerk-final-20261021-r5/variant-e2.html, ergänzt um zwei Ecken-Farben (validiert, dataviz) */
:root{
  --bg:#eef0f3; --ink:#0c0e13; --ink2:#3a3f4a; --mute:#737a87; --line:rgba(12,14,19,.09); --line2:rgba(12,14,19,.14);
  --card:#ffffff; --accent:#0a66ff; --fuel:#ff7a1a; --lox:#12b5e5; --ion:#7c5cff;
  --shadow:0 24px 48px -30px rgba(20,24,40,.34), 0 2px 8px rgba(20,24,40,.05);
  --shadow-s:0 8px 20px -12px rgba(20,24,40,.30), 0 1px 3px rgba(20,24,40,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.65,.05,.36,1); --ease-spr:cubic-bezier(.3,.05,.12,1);
  --d-s:.25s; --d-m:.5s; --d-l:.9s;
  --r-xl:28px; --r-md:16px; --r-sm:12px;
  --cL:#2a78d6; --cR:#eb6834;            /* blaue Ecke / orange Ecke */
  --cLs:rgba(42,120,214,.14); --cRs:rgba(235,104,52,.14);
  --track:#f1f3f6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.vbadge{position:fixed;right:16px;top:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;
  font:600 11px/1 Sora,sans-serif;letter-spacing:.04em;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow-s)}
.vbadge i{width:9px;height:9px;border-radius:50%;background:linear-gradient(90deg,var(--cL) 50%,var(--cR) 50%)}

.wrap{max-width:1160px;margin:0 auto;padding:72px 24px 96px}
.eyebrow{font:600 11px/1.3 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
h1{font:600 clamp(36px,4.6vw,60px)/.98 Sora,sans-serif;letter-spacing:-.045em;margin:0 0 18px}
h2{font:600 clamp(24px,2.6vw,32px)/1.08 Sora,sans-serif;letter-spacing:-.035em;margin:0}
.lead{font:400 17px/1.62 Manrope,sans-serif;color:var(--ink2);margin:0 0 28px;max-width:62ch;transition:opacity .3s var(--ease)}
.fine{font:500 12.5px/1.55 Manrope,sans-serif;color:var(--mute);margin:16px 0 0}
.fade-out{opacity:0}

/* ---------- Steuerung ---------- */
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:24px}
.lv{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.lv button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;border:0;background:none;cursor:pointer;height:34px;padding:0 14px;border-radius:999px;
  display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 Manrope,sans-serif;color:var(--ink2);transition:color .3s var(--ease) .08s;white-space:nowrap}
.lv .st{display:inline-flex;gap:2px}
.lv .st b{width:3px;height:9px;border-radius:2px;background:currentColor;opacity:.25}
.lv .st b.f{opacity:1}
.lv button[aria-checked="true"]{color:#fff}
.lv .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--ink);transition:transform .45s var(--ease),width .45s var(--ease)}
.acts{display:flex;gap:8px;margin-left:auto}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-s);cursor:pointer;height:42px;padding:0 16px;border-radius:999px;
  display:inline-flex;align-items:center;gap:8px;font:600 13px/1 Sora,sans-serif;letter-spacing:-.01em;transition:transform .3s var(--ease),background .3s}
.btn:hover{background:#f7f8fa}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.dark{background:var(--ink);color:#fff;border-color:transparent}
.btn.dark:hover{background:#22262f}

/* ---------- Karten ---------- */
.card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow);border:1px solid var(--line)}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.sec-h p{margin:6px 0 0;font:400 15px/1.55 Manrope,sans-serif;color:var(--ink2);max-width:60ch}

/* ---------- Arena ---------- */
.arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:0;padding:12px;overflow:hidden}
.fighter{--c:var(--cL);--cs:var(--cLs);position:relative;border-radius:20px;padding:16px 16px 18px;min-width:0;
  background:radial-gradient(110% 80% at 50% 30%,#ffffff 0%,#f6f7f9 50%,#eceef2 100%);will-change:transform}
.fighter[data-side="R"]{--c:var(--cR);--cs:var(--cRs)}
.fighter.slide{transition:transform .7s var(--ease-spr)}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.corner{display:inline-flex;align-items:center;gap:8px;font:600 10.5px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.corner i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--cs);transition:background .5s,box-shadow .5s}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--line);
  font:600 11px/1 Manrope,sans-serif;color:var(--ink2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%}
.art{position:relative;height:300px;margin:6px 0 8px;touch-action:pan-y;cursor:grab;transition:opacity .2s var(--ease),transform .35s var(--ease)}
.art:active{cursor:grabbing}
.art.out{opacity:0;transform:translateY(8px)}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plume{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.02);opacity:0;transition:transform 1.1s var(--ease-spr),opacity .5s var(--ease)}
.lit .plume{transform:none;opacity:1}
.flick{transform-box:fill-box;transform-origin:50% 0;animation:flick .13s ease-in-out infinite alternate}
.flick2{transform-box:fill-box;transform-origin:50% 0;animation:flick2 .21s ease-in-out infinite alternate}
.glow{transform-box:fill-box;transform-origin:50% 0;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.035,.955)}}
@keyframes flick2{from{transform:scale(.97,1.02)}to{transform:scale(1.02,.97)}}
@keyframes glow{from{opacity:.75}to{opacity:1}}
.ionp{animation:ionp 1.4s linear infinite}
@keyframes ionp{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(var(--l,160px));opacity:0}}
.f-nav{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:8px}
.ibtn{appearance:none;-webkit-appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.9);cursor:pointer;display:grid;place-items:center;
  transition:background .25s,transform .25s var(--ease)}
.ibtn:hover{background:#fff}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:14px;height:14px}
.f-name{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 34px 10px 14px;cursor:pointer;text-align:left;min-width:0;position:relative;
  box-shadow:var(--shadow-s);transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.f-name:hover{box-shadow:0 0 0 3px var(--cs),var(--shadow-s)}
.f-name b{display:block;font:600 17px/1.15 Sora,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-name span{display:block;margin-top:4px;font:500 12px/1.3 Manrope,sans-serif;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-name svg{position:absolute;right:12px;top:50%;width:12px;height:12px;margin-top:-6px;color:var(--mute)}
.f-desc{margin:12px 4px 0;font:500 13px/1.5 Manrope,sans-serif;color:var(--ink2);min-height:3em;transition:opacity .25s var(--ease)}
.vs{align-self:center;justify-self:center;z-index:2;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:var(--ink);color:#fff;
  display:grid;place-items:center;box-shadow:0 12px 28px -12px rgba(12,14,19,.6);transition:transform .5s var(--ease-spr)}
.vs:hover{transform:rotate(180deg)}
.vs span{font:700 14px/1 Sora,sans-serif;letter-spacing:.02em}
.vs svg{display:none;width:18px;height:18px}
.vs:hover span{display:none}
.vs:hover svg{display:block;transform:rotate(180deg)}
.scale-note{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:500 11px/1 Manrope,sans-serif;color:var(--mute);white-space:nowrap;pointer-events:none}

.verdict{margin:28px auto 28px;max-width:52ch;text-align:center;font:600 clamp(20px,2.3vw,28px)/1.25 Sora,sans-serif;letter-spacing:-.025em;color:var(--ink);transition:opacity .3s var(--ease);min-height:2.5em}
.verdict .k{white-space:nowrap}
.verdict .k i{display:inline-block;width:.42em;height:.42em;border-radius:50%;margin:0 .22em .1em 0;vertical-align:middle}

/* ---------- Kennzahl-Duelle ---------- */
.metrics{padding:28px 28px 24px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font:600 13px/1.2 Manrope,sans-serif;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px}
.rw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s var(--ease-io),opacity .45s var(--ease)}
.rw.off{grid-template-rows:0fr;opacity:0}
.rw>div{overflow:hidden;min-height:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 168px minmax(0,1fr);grid-template-areas:"L n R" "c c c";align-items:center;padding:14px 0 12px;border-top:1px solid var(--line)}
.rw:first-child .mrow{border-top:0}
.mname{grid-area:n;text-align:center;padding:0 10px}
.mname b{display:block;font:600 14px/1.2 Sora,sans-serif;letter-spacing:-.01em}
.mname small{display:block;margin-top:3px;font:500 11px/1.25 Manrope,sans-serif;color:var(--mute)}
.side{display:flex;align-items:center;gap:12px;min-width:0;position:relative}
.side.L{grid-area:L;flex-direction:row}
.side.R{grid-area:R;flex-direction:row-reverse}
.val{flex:none;width:112px;font:600 15px/1.2 Sora,sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.side.L .val{text-align:left}
.side.R .val{text-align:right}
.val small{display:block;font:500 11px/1.2 Manrope,sans-serif;color:var(--mute);letter-spacing:0;margin-top:2px}
.val.na{color:var(--mute);font:500 13px/1.2 Manrope,sans-serif}
.trk{position:relative;flex:1;height:24px;min-width:0}
.trk::before{content:"";position:absolute;left:0;right:0;top:50%;height:14px;margin-top:-7px;background:var(--track);border-radius:4px}
.side.L .trk::before{border-radius:4px 0 0 4px}
.side.R .trk::before{border-radius:0 4px 4px 0}
.tick{position:absolute;top:50%;width:1px;height:14px;margin-top:-7px;background:rgba(12,14,19,.07)}
.bar{position:absolute;top:50%;height:14px;margin-top:-7px;width:0;background:var(--c);opacity:.32;transition:opacity .45s var(--ease),box-shadow .45s var(--ease)}
.side.L .bar{right:0;border-radius:4px 0 0 4px}
.side.R .bar{left:0;border-radius:0 4px 4px 0}
.side.L{--c:var(--cL);--cs:var(--cLs)} .side.R{--c:var(--cR);--cs:var(--cRs)}
.rng{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.55)}
.side.L .rng{left:0} .side.R .rng{right:0}
.side.win .bar,.side.tie .bar{opacity:1}
.side.win .bar{box-shadow:0 0 0 3px var(--cs),0 0 18px var(--c)}
.wtag{position:absolute;top:-9px;font:700 9.5px/1 Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:0;transform:translateY(3px);transition:opacity .35s var(--ease),transform .35s var(--ease);white-space:nowrap;pointer-events:none}
.side.L .wtag{right:2px} .side.R .wtag{left:2px}
.side.win .wtag{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--track);font:600 13px/1 Manrope,sans-serif;color:var(--ink2);white-space:nowrap;
  transition:background .4s var(--ease),box-shadow .4s var(--ease),color .4s}
.pill svg{width:13px;height:13px;flex:none}
.pcell{flex:1;display:flex;min-width:0}
.side.L .pcell{justify-content:flex-end} .side.R .pcell{justify-content:flex-start}
.side.win .pill{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--c),0 0 18px var(--cs)}
.pill .dots{display:inline-flex;gap:3px}
.pill .dots b{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.22}
.pill .dots b.f{opacity:1;background:var(--c)}
.mcap{grid-area:c;margin:10px auto 0;text-align:center;max-width:70ch;font:500 13px/1.5 Manrope,sans-serif;color:var(--ink2);transition:opacity .25s var(--ease)}
.mcap:empty{display:none}
.mcap code,.fx code{font:500 12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f4f7;border-radius:6px;padding:1px 6px;color:var(--ink)}

/* ---------- Δv-Rennen ---------- */
.race{padding:28px;margin-top:28px}
.rctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:14px 24px;align-items:end;margin-bottom:18px}
.sl label{display:flex;justify-content:space-between;gap:8px;font:600 12.5px/1.2 Manrope,sans-serif;color:var(--ink2);margin-bottom:8px}
.sl label output{font:600 13px/1.2 Sora,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ink) var(--p,50%),#dfe2e7 var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#dfe2e7}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin-top:-8px;box-shadow:var(--shadow-s)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.stage-r{position:relative;border-radius:20px;background:linear-gradient(180deg,#f8f9fb,#eef0f4);border:1px solid var(--line);overflow:hidden}
.clock{position:absolute;right:14px;top:12px;text-align:right;pointer-events:none}
.clock b{display:block;font:600 22px/1 Sora,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock span{display:block;margin-top:4px;font:500 11px/1.2 Manrope,sans-serif;color:var(--mute)}
#trk{display:block;width:100%}
#trk text{font-family:Manrope,sans-serif}
.rr-plume{transition:opacity .4s var(--ease)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{--c:var(--cL);position:relative;border-radius:18px;background:#f7f8fa;border:1px solid var(--line);padding:14px 16px 14px 20px;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.tile.R{--c:var(--cR)}
.tile h3{margin:0 0 10px;font:600 14px/1.2 Sora,sans-serif;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--ink);color:#fff;font:700 9.5px/1 Sora,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  opacity:0;transform:scale(.9);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.badge.on{opacity:1;transform:none}
.badge:not(.on){display:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{min-width:0}
.kv span{display:block;font:500 11px/1.25 Manrope,sans-serif;color:var(--mute)}
.kv b{display:block;margin-top:3px;font:600 16px/1.2 Sora,sans-serif;letter-spacing:-.01em;overflow-wrap:anywhere}
.rtext{margin:18px 0 0;font:500 15px/1.6 Manrope,sans-serif;color:var(--ink2);max-width:75ch;transition:opacity .25s var(--ease)}
.rtext b{color:var(--ink)}
.fx{margin-top:14px;padding:14px 16px;border-radius:16px;background:#f7f8fa;border:1px solid var(--line);font:500 13px/1.75 Manrope,sans-serif;color:var(--ink2);overflow-x:auto}
.fx:empty{display:none}
.fx div{white-space:nowrap}

/* ---------- Tabelle ---------- */
details.tbl{margin-top:28px;padding:0}
details.tbl summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 28px;font:600 16px/1.2 Sora,sans-serif;letter-spacing:-.01em}
details.tbl summary::-webkit-details-marker{display:none}
details.tbl summary span{font:500 12.5px/1.2 Manrope,sans-serif;color:var(--mute)}
details.tbl summary svg{width:14px;height:14px;transition:transform .35s var(--ease);flex:none}
details[open].tbl summary svg{transform:rotate(180deg)}
.tw{overflow-x:auto;padding:0 16px 20px}
table{border-collapse:collapse;width:100%;font:500 12.5px/1.35 Manrope,sans-serif;font-variant-numeric:tabular-nums;min-width:980px}
th{font:600 11px/1.25 Sora,sans-serif;letter-spacing:.02em;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
td:first-child{color:var(--ink);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
td .na{color:#a3a9b3}
tr.isL td:first-child{box-shadow:inset 4px 0 0 var(--cL)}
tr.isR td:first-child{box-shadow:inset 4px 0 0 var(--cR)}
.tset{display:inline-flex;gap:4px}
.tset button{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:#fff;border-radius:999px;height:26px;padding:0 9px;cursor:pointer;font:600 11px/1 Manrope,sans-serif;white-space:nowrap}
.tset button:hover{background:#f3f4f7}
.tset button i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}

/* ---------- Picker ---------- */
.picker{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(12,14,19,.28);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.picker.on{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.sheet{width:min(1040px,100%);max-height:86vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 22px 28px;box-shadow:0 -20px 60px -20px rgba(12,14,19,.4);
  transform:translateY(40px);transition:transform .55s var(--ease-spr)}
.picker.on .sheet{transform:none}
@media (min-width:760px){.picker{align-items:center}.sheet{border-radius:28px;max-height:84vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.sh-h h2{font-size:22px;display:flex;align-items:center;gap:10px}
.sh-h h2 i{width:12px;height:12px;border-radius:50%}
.grp{margin-top:16px}
.grp h3{margin:0 0 10px;font:600 11px/1.2 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.grp h3 i{width:7px;height:7px;border-radius:50%}

.pc{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 12px 12px;cursor:pointer;text-align:left;position:relative;
  box-shadow:var(--shadow-s);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.pc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pc .mini{height:112px;position:relative}
.pc .mini svg{position:absolute;inset:0;width:100%;height:100%}
.pc b{display:block;font:600 13.5px/1.2 Sora,sans-serif;letter-spacing:-.01em}
.pc span{display:block;margin-top:3px;font:500 11.5px/1.3 Manrope,sans-serif;color:var(--mute)}
.pc.cur{box-shadow:0 0 0 2px var(--pc,var(--cL)),var(--shadow-s)}
.pc em{position:absolute;right:8px;top:8px;font:700 9px/1 Sora,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-style:normal;padding:4px 7px;border-radius:999px;background:#f1f3f6;color:var(--ink2)}

/* Tooltip */
.tip{position:fixed;left:0;top:0;z-index:60;max-width:280px;padding:9px 12px;border-radius:12px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);
  font:500 12.5px/1.45 Manrope,sans-serif;pointer-events:none;opacity:0;transition:opacity .18s var(--ease)}
.tip.on{opacity:1}
.tip b{font:600 12.5px/1.3 Sora,sans-serif}

/* ---------- Responsiv ---------- */
@media (max-width:860px){
  .wrap{padding:64px 16px 72px}
  .acts{margin-left:0}
  .rctl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rctl .btn{grid-column:1 / -1;justify-self:start}
}
@media (max-width:640px){
  .arena{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px}
  .vs{position:absolute;left:50%;top:150px;margin-left:-22px;width:44px;height:44px}
  .vs span{font-size:12px}
  .fighter{padding:12px 10px 14px}
  .art{height:220px}
  .f-nav{grid-template-columns:minmax(0,1fr)}

  .f-name{padding:9px 26px 9px 10px}

  .f-name svg{right:9px}
  .chip{display:none}
  .f-desc{font-size:12px;margin:10px 2px 0}
  .metrics,.race{padding:20px 14px 18px}
  .mrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n n" "L R" "c c";row-gap:8px}
  .mname{padding:0}
  .mname b,.mname small{display:inline}

  .side{flex-direction:column !important;align-items:stretch;gap:6px}

  .vbadge{top:auto;bottom:12px;right:12px}
}

const NB = ' ';

function num(x,n){ n=n||3; if(x==null||!isFinite(x)) return '–'; const v=sig(x,n); const d=Math.max(0,n-1-Math.floor(Math.log10(Math.abs(v)||1)));

const springs = new Set(); let raf=0, last=0;

  });

function drawRace(p){

    const txt = r.tb==null && p<1 ? 'Zeitverlauf: kein Schub belegt' : fmtV(v)+(r.tb!=null&&t>=r.tb?(RC.narrow?' · aus':' · Brennschluss'):'');

    return `<div class="grp"><h3><i style="background:${FAM[f].c}"></i>${FAM[f].l}</h3><div class="pgrid">`+list.map(e=>
      `<button class="pc ${e.id===cur?'cur':''}" type="button" data-id="${e.id}" style="--pc:var(--c${side})">${e.id===cur?'<em>gewählt</em>':e.id===opp?'<em>Gegner</em>':''}<div class="mini">${artSVG(e,S.pt,true)}</div><b>${short(e)}</b><span>${e.typ}</span></button>`).join('')+`</div></div>`; }).join('');
  $('#pkb').querySelectorAll('.pc').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; if(id===S[other(side)]) S[other(side)]=S[side]; S[side]=id; closePicker(); update(); });
  const pk=$('#picker'); pk.classList.add('on'); pk.setAttribute('aria-hidden','false');
  setTimeout(()=>{ (pk.querySelector('.pc.cur')||pk.querySelector('.pc')).focus({preventScroll:true}); },60);
}
function closePicker(){ const pk=$('#picker'); pk.classList.remove('on'); pk.setAttribute('aria-hidden','true'); if(lastFocus) lastFocus.focus({preventScroll:true}); }
$('#pkx').onclick=closePicker;
$('#picker').addEventListener('click',ev=>{ if(ev.target.id==='picker') closePicker(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&$('#picker').classList.contains('on')) closePicker(); });

/* ===== Tauschen / Zufall ===== */
let swapping=false;
function swap(){
  if(swapping) return; swapping=true;
  const a=$('#fL'), b=$('#fR'); const dx=b.getBoundingClientRect().left-a.getBoundingClientRect().left;
  const done=()=>{ [S.L,S.R]=[S.R,S.L]; [shown.L,shown.R]=[shown.R,shown.L]; [shown.ptL,shown.ptR]=[shown.ptR,shown.ptL];
    // Illustrationen mitnehmen statt neu aufbauen
    const aa=a.querySelector('.art'), bb=b.querySelector('.art'); const tmp=aa.innerHTML; aa.innerHTML=bb.innerHTML; bb.innerHTML=tmp;
    a.classList.remove('slide'); b.classList.remove('slide'); a.style.transform=''; b.style.transform=''; update(); swapping=false; };
  if(RM.matches){ done(); return; }
  a.classList.add('slide'); b.classList.add('slide');
  a.style.transform=`translateX(${dx}px)`; b.style.transform=`translateX(${-dx}px)`;
  setTimeout(done,720);
}
$('#swap').onclick=swap; $('#vs').onclick=swap;
$('#rand').onclick=()=>{ const ids=ENG.map(e=>e.id); let a,b,n=0; do{ a=ids[Math.floor(Math.random()*ids.length)]; b=ids[Math.floor(Math.random()*ids.length)]; n++; }
  while((a===b || BY[a].fam===BY[b].fam && n<20 || (a===S.L&&b===S.R)) && n<60); S.L=a; S.R=b; update(); };

/* ===== Segment-Schalter ===== */
function seg(id,key,cast){
  const root=$(id), ind=root.querySelector('.ind'), btns=[...root.querySelectorAll('button')];
  const place=()=>{ const b=btns.find(x=>x.getAttribute('aria-checked')==='true'); ind.style.width=b.offsetWidth+'px'; ind.style.transform=`translateX(${b.offsetLeft}px)`; };
  btns.forEach(b=>b.addEventListener('click',()=>{ btns.forEach(x=>x.setAttribute('aria-checked',x===b?'true':'false')); S[key]=cast(b.dataset.v); place(); update(); }));
  root.addEventListener('keydown',ev=>{ if(ev.key!=='ArrowRight'&&ev.key!=='ArrowLeft') return; const i=btns.findIndex(x=>x.getAttribute('aria-checked')==='true'); const j=(i+(ev.key==='ArrowRight'?1:-1)+btns.length)%btns.length; btns[j].click(); btns[j].focus(); });
  addEventListener('resize',place); document.fonts&&document.fonts.ready.then(place); place();
}

/* ===== Texte je Stufe ===== */
const LEAD=[
 'Zwei Triebwerke treten gegeneinander an: Wer drückt stärker, wer ist sparsamer – und wer bringt dieselbe Rakete am weitesten? Wähle die Gegner oben, wische über ein Bild oder lass würfeln.',
 'Zwei Antriebe im direkten Vergleich: Schub, spezifischer Impuls, Kammerdruck, Masse und Betriebseigenschaften als gespiegelte Balken – danach die Raketengleichung als Rennen.',
 'Kennzahlen gespiegelt auf festen Skalen für alle 13 Triebwerke (Schub, Masse, ṁ logarithmisch). Das Rennen rechnet Ziolkowski mit konstantem Schub, ohne Schwerkraft- und Luftverluste.'];
const MLEAD=['Der längere Balken gewinnt die Runde und leuchtet auf.','Gleiche Skala für alle Triebwerke – der Wechsel zeigt echte Größenordnungen.','Feste Skalen, Werte als gerundete Richtwerte aus der Datenbasis.'];
const RLEAD=['Gleiche Rakete, anderer Antrieb: Wer ist schneller weg, wer kommt weiter?','Gleiche Startmasse und gleicher Treibstoffanteil, nur der Antrieb ist anders. Die Bahn zeigt das erreichte Δv, unten läuft die Brenndauer.','Δv = Isp·g₀·ln(m₀/m_f) und v(t) bei konstantem Schub. Bahn linear in Δv, Uhr logarithmisch in der Zeit.'];

function legend(){ $('#legend').innerHTML=['L','R'].map(s=>`<span><i style="background:var(--c${s})"></i>${short(E(s))}</span>`).join(''); }
function update(){
  setText($('#lead'),LEAD[S.lvl-1]); setText($('#mlead'),MLEAD[S.lvl-1]); setText($('#rlead'),RLEAD[S.lvl-1]);
  $('#mfine').textContent=`Betriebspunkt: ${ptName()} (Schub, Isp und daraus abgeleitete Größen). Alle Werte sind gerundete Richtwerte (ca.) aus der Datenbasis; „keine Angabe“ = dort nicht belegt. Bereiche: Balken bis zum Höchstwert, heller Teil = Spanne.`;
  $('#rfine').textContent='Gedankenexperiment wie im Formelteil: gleiche Rakete für beide, Triebwerksmasse, Schwerkraft und Luftwiderstand werden ignoriert, Schub konstant. Das Rennen nutzt Vakuumwerte (sonst Meereshöhe, falls nur diese belegt).';
  renderFighter('L'); renderFighter('R'); legend(); updateRows(); verdict(); renderTable();
  if(raceSeen) raceChanged(); else raceDirty=true;
}

/* ===== Tabelle (Fallback) ===== */
function renderTable(){
  const na='<span class="na" title="keine Angabe">k. A.</span>';
  const n=(v,f)=> v==null? na : f(v);
  const fk=v=>Array.isArray(v)? num(v[0],3)+'–'+num(v[1],3) : num(v,3);
  let h=`<thead><tr><th>Triebwerk</th><th>Typ</th><th>Treibstoffe</th><th class="n">Schub MH [kN]</th><th class="n">Schub Vak. [kN]</th><th class="n">Isp MH [s]</th><th class="n">Isp Vak. [s]</th><th class="n">pᶜ [bar]</th><th class="n">Masse [kg]</th><th>Wiederzündb.</th><th>Regelbar</th><th>Reifegrad</th><th>Ins Duell</th></tr></thead><tbody>`;
  ENG.forEach(e=>{ h+=`<tr class="${e.id===S.L?'isL':e.id===S.R?'isR':''}"><td>${e.name}</td><td>${e.typ}</td><td>${e.prop}</td><td class="n">${n(e.fSL,fk)}</td><td class="n">${n(e.fV,fk)}</td><td class="n">${n(e.iSL,fk)}</td><td class="n">${n(e.iV,fk)}</td><td class="n">${n(e.pc,fk)}</td><td class="n">${n(e.m,fk)}</td><td>${e.re||na}</td><td>${e.th||na}</td><td>${e.mat}</td>`+
    `<td><span class="tset"><button type="button" data-s="L" data-id="${e.id}"><i style="background:var(--cL)"></i>blau</button><button type="button" data-s="R" data-id="${e.id}"><i style="background:var(--cR)"></i>orange</button></span></td></tr>`; });
  h+='</tbody><caption class="sr">Vergleichsdaten aller 13 Triebwerke; k. A. = keine Angabe</caption>';
  const t=$('#table'); t.innerHTML=h;
  t.querySelectorAll('.tset button').forEach(b=>b.onclick=()=>{ const s=b.dataset.s, id=b.dataset.id; if(id===S[other(s)]) S[other(s)]=S[s]; S[s]=id; update(); $('.arena').scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'center'}); });
}

/* ===== Start ===== */
buildFighter('L'); buildFighter('R'); buildRows();
m0In.value=m0To(S.m0); frIn.value=Math.round(S.fr*100); sliderUI();
seg('#lvl','lvl',v=>+v); seg('#pt','pt',v=>v);
update();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('noanim')));
})();
</script>
