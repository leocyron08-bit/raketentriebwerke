<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triebwerke – Kapitel</title>
<meta name="description" content="Raketentriebwerke im Split-Screen mit Kapitel-Reitern: Überblick, Bauteile zum Aufklappen, Funktion als Zeitleiste auf der Bühne und Entwicklung als Zeitachse – mit Glossar für Fachbegriffe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f3; --ink:#0c0e13; --ink2:#3a3f4a; --mute:#737a87; --line:rgba(12,14,19,.09); --line2:rgba(12,14,19,.14);
  --card:#ffffff; --accent:#0a66ff; --fuel:#ff7a1a; --lox:#12b5e5; --ion:#7c5cff;
  --hot1:#ffb054; --hot2:#ff5a1f; --hotGlow:rgba(255,90,31,.45);
  --shadow:0 24px 48px -30px rgba(20,24,40,.34), 0 2px 8px rgba(20,24,40,.05);
  --shadow-s:0 8px 20px -12px rgba(20,24,40,.30), 0 1px 3px rgba(20,24,40,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-xl:28px; --r-md:16px; --r-sm:12px;
  --stage-h:calc(100vh - 32px); --ts:26px;
}
@supports (height:100svh){ :root{ --stage-h:calc(100svh - 32px) } }
body.ion{ --hot1:#a58bff; --hot2:#4b5bff; --hotGlow:rgba(91,80,255,.45) }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Raster ---------- */
.page{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);align-items:start}
.stage-col{position:sticky;top:0;height:calc(var(--stage-h) + 32px);padding:16px 0 16px 16px}

/* ---------- Bühne ---------- */
.stage{position:relative;height:100%;border-radius:var(--r-xl);overflow:hidden;isolation:isolate;background:#e4e7eb;
  box-shadow:inset 0 0 0 1px rgba(12,14,19,.06), var(--shadow)}
.sbg{position:absolute;inset:0;z-index:-1;transition:opacity 1.2s var(--ease)}
.sbg-l{background:radial-gradient(110% 85% at 50% 42%,#ffffff 0%,#f5f6f8 38%,#e4e7eb 74%,#d7dbe1 100%)}
.sbg-d{background:radial-gradient(105% 85% at 50% 44%,#1d222d 0%,#0e1016 54%,#05060a 100%);opacity:0}
.stage.func .sbg-d{opacity:1}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:pan-y}
#gl:active{cursor:grabbing}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;transition:opacity .45s var(--ease)}
#lines path{fill:none;stroke:var(--ink);stroke-opacity:.34;stroke-width:1}
#lines circle{fill:var(--ink)}
#tags{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s var(--ease)}
.stage.tags-on #tags,.stage.tags-on #lines{opacity:1}
.stage.tags-on .tag{pointer-events:auto}
.tag{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);border-radius:50%;display:grid;place-items:center;padding:0;
  font:700 11px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);background:rgba(255,255,255,.92);
  border:1px solid var(--line2);box-shadow:var(--shadow-s);cursor:pointer;pointer-events:none;appearance:none;-webkit-appearance:none;
  transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
.tag.hl{background:var(--ink);color:#fff;border-color:transparent}
.tag.sel{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(10,102,255,.7)}

.chip-s{position:absolute;top:16px;z-index:2;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;
  font:600 11px/1 Sora,sans-serif;letter-spacing:.04em;color:var(--mute);background:rgba(255,255,255,.66);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap;transition:background .8s,color .8s,border-color .8s}
.brand{left:16px;color:var(--ink);letter-spacing:.01em;font-size:12px}
.brand i{width:9px;height:9px;border-radius:50%;background:conic-gradient(var(--fuel),#ff9a3c,var(--lox),var(--ion),var(--fuel))}
.brand span{color:var(--mute);font-weight:400}
.badge{right:16px}
.stage.func .chip-s{background:rgba(24,27,36,.6);border-color:rgba(255,255,255,.08);color:#8b93a3}
.stage.func .brand{color:#eef1f6}

/* Steuerleiste auf der Bühne */
.bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:var(--shadow);transition:background .8s,border-color .8s;white-space:nowrap}
.stage.func .bar{background:rgba(22,25,33,.72);border-color:rgba(255,255,255,.09);color:#f2f4f8}
.bar button{appearance:none;-webkit-appearance:none;border:0;background:none;cursor:pointer;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  font:600 14px/1 Sora,sans-serif;letter-spacing:-.01em;transition:background .3s,color .3s,opacity .3s,transform .3s var(--ease)}
.bar button:active{transform:scale(.97)}
.bar button:disabled{opacity:.3;cursor:default;transform:none}
#btnExplode{gap:10px;padding:0 20px 0 16px;background:var(--ink);color:#fff;min-width:178px}
.stage.func #btnExplode{background:rgba(255,255,255,.1);color:#f2f4f8}
#btnExplode .xi{width:16px;height:16px;position:relative;flex:none}
#btnExplode .xi i{position:absolute;left:2px;right:2px;height:3.5px;border-radius:1.5px;background:currentColor;transition:transform .55s var(--ease)}
#btnExplode .xi i:nth-child(1){top:2px}
#btnExplode .xi i:nth-child(2){top:6.5px}
#btnExplode .xi i:nth-child(3){top:11px}
#btnExplode[aria-pressed="true"] .xi i:nth-child(1){transform:translate(-2px,-2px)}
#btnExplode[aria-pressed="true"] .xi i:nth-child(3){transform:translate(2px,2px)}
.bar .sep{width:1px;height:24px;background:var(--line2);margin:0 4px}
.stage.func .bar .sep{background:rgba(255,255,255,.14)}
.ib{width:44px}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:not(:disabled):hover{background:rgba(12,14,19,.06)}
.stage.func .ib:not(:disabled):hover{background:rgba(255,255,255,.08)}
#phLbl{min-width:128px;padding:0 12px;font-variant-numeric:tabular-nums}
#phLbl:hover{background:rgba(12,14,19,.05)}
.stage.func #phLbl{background:linear-gradient(135deg,var(--hot1),var(--hot2));color:#fff;box-shadow:0 10px 26px -12px var(--hotGlow)}
#phPlay{position:relative;overflow:hidden}
#phPlay .pa{display:none}
#phPlay[aria-pressed="true"] .pl{display:none}
#phPlay[aria-pressed="true"] .pa{display:block}
#phPlay svg.pl,#phPlay svg.pa{fill:currentColor;stroke:none}
#phPlay .prog{position:absolute;left:12px;right:12px;bottom:7px;height:2px;border-radius:2px;background:currentColor;opacity:0;transform:scaleX(0);transform-origin:left}
#phPlay[aria-pressed="true"] .prog{opacity:.6}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- Erklärspalte ---------- */
.col{min-width:0;padding:0 clamp(24px,3.6vw,64px) 0 clamp(28px,3.4vw,56px)}
.col-in{max-width:560px}
.toolbar{position:sticky;top:0;z-index:5;padding:16px 0 14px;background:var(--bg)}
.toolbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:24px;background:linear-gradient(var(--bg),rgba(238,240,243,0));pointer-events:none}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow-s);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;border:0;background:none;cursor:pointer;border-radius:12px;min-width:0;
  padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2);transition:color .3s var(--ease) .08s}
.seg .t{font:600 13px/1.1 Sora,sans-serif;letter-spacing:-.01em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.seg .s{font:500 11px/1.1 Manrope,sans-serif;color:var(--mute);white-space:nowrap;transition:color .3s var(--ease) .08s}
.seg button[aria-checked="true"]{color:#fff}
.seg button[aria-checked="true"] .s{color:rgba(255,255,255,.66)}
.seg .ind,.lv .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--ink);transition:transform .45s var(--ease),width .45s var(--ease)}
.seg .ind{border-radius:12px}
.lvrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.lvk{font:600 11px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lv{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.lv button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;border:0;background:none;cursor:pointer;height:32px;padding:0 14px;border-radius:999px;
  display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 Manrope,sans-serif;color:var(--ink2);transition:color .3s var(--ease) .08s}
.lv .st{display:inline-flex;gap:2px}
.lv .st b{width:3px;height:9px;border-radius:2px;background:currentColor;opacity:.25}
.lv .st b.f{opacity:1}
.lv button[aria-checked="true"]{color:#fff}
.lv .ind{border-radius:999px}

.eyebrow{font:600 11px/1.3 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.eyebrow b{color:var(--ink);font-weight:700}
h1{font:600 clamp(40px,4.4vw,64px)/.98 Sora,sans-serif;letter-spacing:-.045em;margin:0 0 24px}
h2{font:600 32px/1.08 Sora,sans-serif;letter-spacing:-.035em;margin:0 0 8px}
.meta{font:500 13px/1.5 Manrope,sans-serif;color:var(--mute);margin:0 0 24px}
.lead{font:400 17px/1.62 Manrope,sans-serif;color:var(--ink2);margin:0 0 16px;max-width:48ch}
.ex{font:500 13px/1.5 Manrope,sans-serif;color:var(--mute);margin:0 0 24px}
.specs:empty{display:none}
.specs{margin:0 0 24px}
.spec{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.spec:last-of-type{border-bottom:1px solid var(--line)}
.spec span{color:var(--mute)}
.spec b{font:600 13.5px/1.35 Sora,sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.formula{font:500 13.5px/1.5 Sora,sans-serif;color:var(--ink2);margin-top:12px}
.tip{font:500 12.5px/1.5 Manrope,sans-serif;color:var(--mute);margin:16px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{display:inline-flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,24,40,.04)}
.chip span{font:500 11.5px/1.2 Manrope,sans-serif;color:var(--mute)}
.chip b{font:600 14px/1.25 Sora,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.inv{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:20px 0 0;font:500 12.5px/1.4 Manrope,sans-serif;color:var(--mute)}
.inv .ivp{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.inv .ivp i{font:700 9.5px/1 Sora,sans-serif;font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2)}
.foot{padding:40px 0 calc(42vh);border-top:1px solid var(--line);font:500 12.5px/1.6 Manrope,sans-serif;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{position:fixed;inset:0;display:grid;place-items:center;font:500 16px Manrope,sans-serif;background:var(--bg)}

/* ---------- R3: Kapitel-Reiter ---------- */
.tabs{position:relative;display:flex;margin-top:12px;border-bottom:1px solid var(--line2)}
.tabs button{appearance:none;-webkit-appearance:none;border:0;background:none;cursor:pointer;flex:1 1 0;min-width:0;height:44px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:600 13.5px/1 Sora,sans-serif;letter-spacing:-.01em;color:var(--mute);white-space:nowrap;border-radius:10px 10px 0 0;transition:color .3s var(--ease)}
.tabs button:hover{color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .cnt{min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;font:700 10.5px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;
  background:rgba(12,14,19,.06);color:var(--mute);transition:background .3s,color .3s}
.tabs button[aria-selected="true"] .cnt{background:var(--ink);color:#fff}
.tabs .ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;border-radius:2px;background:var(--ink);transition:transform .45s var(--ease),width .45s var(--ease)}
.panel{padding:36px 0 56px;outline:none}
.panel[hidden]{display:none}
.eb-sp{margin-top:36px}
.note-card{margin:8px 0 0;padding:18px 20px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.note-card .k{margin:0 0 8px;font:600 10.5px/1.2 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.note-card .nt{margin:0 0 6px;font:600 15px/1.3 Sora,sans-serif;color:var(--ink)}
.note-card p{margin:0;font:400 15px/1.62 Manrope,sans-serif;color:var(--ink2)}
.specs + .note-card{margin-top:0}
.chaps{display:grid;gap:6px}
.chap{appearance:none;-webkit-appearance:none;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:transparent;
  cursor:pointer;text-align:left;transition:background .25s,box-shadow .25s,border-color .25s}
.chap:hover{background:var(--card);border-color:transparent;box-shadow:var(--shadow-s)}
.chap .ci{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line2)}
.chap .ci svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chap .ct{min-width:0}
.chap b{display:block;font:600 15px/1.3 Sora,sans-serif;letter-spacing:-.01em}
.chap .ct span{display:block;margin-top:3px;font:500 13px/1.45 Manrope,sans-serif;color:var(--mute)}
.chap .arr{margin-left:auto;color:var(--mute);font:600 15px/1 Sora,sans-serif;transition:transform .3s var(--ease)}
.chap:hover .arr{transform:translateX(3px);color:var(--ink)}
.gl-demo{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1.5px}

/* Bauteile: Gruppen + Aufklapp-Einträge */
.grp{margin-top:28px}
.grp-h{display:flex;align-items:center;gap:10px;margin:0 0 8px 2px;font:600 11px/1.3 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.grp-h b{color:var(--ink);font-weight:700}
.grp-h span{font-variant-numeric:tabular-nums}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.pl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pt{border-radius:var(--r-md);border:1px solid transparent;transition:background .25s,border-color .25s,box-shadow .25s}
.pt:hover,.pt.hl{background:var(--card);box-shadow:var(--shadow-s)}
.pt.open{background:var(--card);border-color:rgba(10,102,255,.32);box-shadow:var(--shadow-s)}
.pt-h{appearance:none;-webkit-appearance:none;border:0;background:none;width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px 14px 14px 16px;cursor:pointer;border-radius:var(--r-md)}
.pt-n{display:flex;gap:3px;flex:none;min-width:26px}
.pt-n i{min-width:26px;height:26px;padding:0 6px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--card);
  font:700 11px/1 Sora,sans-serif;font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.pt-n i.more{font-size:10px;color:var(--mute);background:transparent}
.pt-n i.x{border-style:dashed;color:var(--mute);background:transparent}
.pt.hl .pt-n i:not(.more):not(.x){background:var(--ink);color:#fff;border-color:transparent}
.pt.open .pt-n i:not(.more):not(.x){background:var(--accent);color:#fff;border-color:transparent}
.pt-t{flex:1;min-width:0;padding-top:3px}
.pt-t b{display:block;font:600 15px/1.3 Sora,sans-serif;letter-spacing:-.01em}
.pt-t>span{display:block;margin-top:4px;font:400 14px/1.55 Manrope,sans-serif;color:var(--ink2)}
.chev{flex:none;width:28px;height:28px;margin-top:-1px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:transform .4s var(--ease),background .25s,color .25s}
.chev svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pt-h:hover .chev{background:rgba(12,14,19,.05);color:var(--ink)}
.pt.open .chev{transform:rotate(180deg);color:var(--accent)}
.pt-b{padding:0 18px 20px 56px}
.pt-b[hidden]{display:none}
.sub{margin-top:18px}
.sub:first-child{margin-top:2px}
.sub h4{margin:0 0 6px;font:600 10.5px/1.2 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sub p{margin:0;font:400 14.5px/1.62 Manrope,sans-serif;color:var(--ink2);max-width:54ch}
.sub .chips{margin-top:0}
.phl{display:flex;flex-wrap:wrap;gap:6px}
.phl button,.inv .ivp{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:transparent;border-radius:999px;height:30px;padding:0 12px 0 4px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1 Manrope,sans-serif;color:var(--ink2);transition:background .25s,border-color .25s,color .25s}
.phl button:hover,.inv .ivp:hover{background:var(--bg);color:var(--ink);border-color:var(--ink)}
.phl button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--hot1),var(--hot2));color:#fff;font:700 10px/1 Sora,sans-serif;font-style:normal}
.note{margin:16px 0 0;font:500 12.5px/1.5 Manrope,sans-serif;color:var(--mute)}

/* Fachbegriffe + Popover */
.gl{cursor:help;color:inherit;text-decoration:underline dotted;text-decoration-color:rgba(12,14,19,.5);text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;
  transition:background .2s,text-decoration-color .2s,color .2s}
.gl:hover,.gl[aria-expanded="true"]{color:var(--ink);text-decoration-color:var(--accent);background:rgba(10,102,255,.07)}
.gl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#pop{position:fixed;left:0;top:0;z-index:50;width:min(300px,calc(100vw - 24px));padding:14px 16px 15px;border-radius:14px;background:#12151c;color:#f2f4f8;
  box-shadow:0 24px 44px -20px rgba(10,14,24,.6),0 2px 8px rgba(10,14,24,.18);opacity:0;visibility:hidden;transform:translateY(4px);pointer-events:none;
  transition:opacity .18s,transform .22s var(--ease),visibility 0s .22s}
#pop.up{transform:translateY(-4px)}
#pop.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .18s,transform .22s var(--ease)}
#pop .k{display:block;margin-bottom:6px;font:600 9.5px/1 Sora,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8b93a3}
#pop b{display:block;margin-bottom:6px;font:600 14px/1.3 Sora,sans-serif;letter-spacing:-.01em}
#pop p{margin:0;font:400 13.5px/1.55 Manrope,sans-serif;color:#c7cdd8}

/* Funktion: Bildunterschrift + Phasenliste in der Spalte */
.lead.sm{font-size:15.5px;margin-bottom:0}
.cap{position:relative;margin-top:24px;padding:20px 22px 22px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}

  let N = 0; E.flows.forEach(f => { N += f.n; });
  const g = new THREE.BufferGeometry();
  const mk = (n, s) => { const a = new THREE.BufferAttribute(new Float32Array(n * s), s); a.setUsage(THREE.DynamicDrawUsage); return a; };
  g.setAttribute('position', mk(N, 3)); g.setAttribute('aColor', mk(N, 3)); g.setAttribute('aSize', mk(N, 1)); g.setAttribute('aAlpha', mk(N, 1));
  E.pPath = new Uint16Array(N); E.pU = new Float32Array(N); E.pJ = new Float32Array(N * 3);
  let k = 0;
  E.flows.forEach((f, fi) => { for (let i = 0; i < f.n; i++, k++) { E.pPath[k] = fi; E.pU[k] = (i + Math.random()) / f.n; E.pJ[k * 3] = Math.random() * 2 - 1; E.pJ[k * 3 + 1] = Math.random() * 2 - 1; E.pJ[k * 3 + 2] = Math.random() * 2 - 1; } });
  const mat = addBlend(new THREE.ShaderMaterial({ uniforms: { uScale: ptScale, uFade: { value: 0 } }, vertexShader: PV, fragmentShader: PF }));
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; pts.visible = false; pts.renderOrder = 10;
  E.center.add(pts); E.pts = pts; E.pN = N;
}
function finalize(E, def) {
  E.units = def.units; E.readouts = def.readouts;
  E.root.updateMatrixWorld(true);
  const all = new THREE.Box3();
  for (const p of E.partList) { p.box = new THREE.Box3().setFromObject(p.obj); p.restCenter = p.box.getCenter(new THREE.Vector3()); all.union(p.box); }
  E.box = all;
  E.center.position.y = -(all.min.y + all.max.y) / 2;
  E.unitOf = { 1: {}, 2: {}, 3: {} };
  for (const l of [1, 2, 3]) E.units[l].forEach((u, i) => { u.i = i; u.parts.forEach(pid => { if (!E.parts[pid]) console.warn('Teil fehlt:', E.id, pid); E.unitOf[l][pid] = u; }); });
  for (const p of E.partList) for (const l of [1, 2, 3]) if (!E.unitOf[l][p.id]) console.warn('Teil ohne Einheit:', E.id, l, p.id);
  for (const p of E.partList) { p.rimMat = rimMat.clone(); p.glow = 0; }
  for (const p of E.partList) for (const m of p.meshes) {
    if (m.isInstancedMesh) continue;
    const o = new THREE.Mesh(m.geometry, p.rimMat); o.raycast = () => {}; o.visible = false; o.renderOrder = 5; m.add(o); p.rims.push(o);
  }
  buildParticles(E);
  E.tags = [...new Set(E.flows.map(f => f.tag))];
  E.fs = {}; E.tags.forEach(t => { E.fs[t] = { R: 0, A: 0, B: 0, on: 0 }; });
  E.root.visible = false;
}

const shadowGeo = new THREE.PlaneGeometry(1, 1); shadowGeo.rotateX(-Math.PI / 2);

function staggerE(Ev, i, n) {
  const s = n > 1 ? Math.min(0.07, 0.45 / (n - 1)) : 0;
  return clamp01((Ev - s * i) / (1 - s * (n - 1)));
}
function partTarget(E, p, lvl, Ev, out) {
  const u = E.unitOf[lvl][p.id];
  if (!u) return out.set(0, 0, 0);
  const le = staggerE(Ev, u.i, E.units[lvl].length);
  const off = u.off || [0, 0, 0];
  out.set(off[0], off[1], off[2]);
  if (u.radial) {
    const c = p.restCenter, L = Math.hypot(c.x, c.z);
    let dx = 1, dz = 0; if (L > 0.05) { dx = c.x / L; dz = c.z / L; }
    out.x += dx * u.radial; out.z += dz * u.radial;
  }
  return out.multiplyScalar(le);
}
const seedV = new THREE.Vector3();
function seedEntry(E, amount) {
  for (const p of E.partList) {
    partTarget(E, p, S.lvl, 1, seedV);
    p.disp.copy(seedV).multiplyScalar(amount); p.disp.y += amount * 0.25;
    p.vel.set(0, 0, 0);
    const u = E.unitOf[S.lvl][p.id];
    p.hold = reduced ? 0 : 0.1 + (u ? u.i : 0) * 0.03;
  }
}
function applyDetail() {
  for (const id of ORDER) {
    const E = ENG[id];
    E.center.traverse(o => { if (o.userData.minLvl) o.visible = o.userData.minLvl <= S.lvl; });
    E.fx.plume.material.uniforms.uDiam.value = (E.fx.diam && S.lvl === 3) ? 1 : 0;
  }
}

    E.root.position.y = lerp(-1.3, 0, e) + floatY;
    E.root.scale.setScalar(lerp(0.86, 1, e));
    E.spinExtra = reduced ? 0 : lerp(-1.1, 0, e);
    E.fade = clamp01(E.pres * 1.8);
  } else {
    const e = ease.inOut(1 - E.pres);
    E.root.position.y = lerp(0, 0.45, e) + floatY;
    E.root.scale.setScalar(lerp(1, 0.7, e));
    E.spinExtra = reduced ? 0 : lerp(0, 1.5, e);
    E.fade = 1 - clamp01(e * 1.3);
    if (E.pres <= 0) { E.root.visible = false; return; }
  }
  // Drehteller: in Bauteile- und Funktionsansicht fest ausgerichtet, im Überblick/Entwicklung ruhig drehend
  if (isCur) {
    if (S.turnMode) {
      if (E.turnTarget === undefined) E.turnTarget = alignAngle(E, S.turnMode === 'parts' ? 0.32 : 0);
      E.turn = reduced ? E.turnTarget : damp(E.turn, E.turnTarget, 2.4, dt);
    } else {
      const idle = !S.dragging && (performance.now() - S.userT > 2500) && !S.hov;
      if (idle && !reduced) E.turn += dt * (S.tab === 'history' ? 0.07 : 0.16);
    }
  }
  E.spin.rotation.y = E.turn + E.spinExtra;

  const lvl = S.lvl;
  const phSet = isCur && func ? PHSET[E.id][S.ph] : null;
  let selSet = null, hlSet = null;
  if (isCur && !func) { selSet = S.tab === 'parts' ? visSet(entrySet(S.sel)) : null; hlSet = visSet(entrySet(S.hov)); }
  const rimCol = func ? (E.id === 'ion' ? COL_ION : COL_HOT) : COL_ACCENT;
  const steps = Math.max(1, Math.ceil(dt / 0.008)), sdt = dt / steps;
  for (const p of E.partList) {
    partTarget(E, p, lvl, S.E, p.target);
    if (p.hold > 0) p.hold -= dt;
    else if (reduced) { p.disp.copy(p.target); p.vel.set(0, 0, 0); }
    else {
      for (let s = 0; s < steps; s++) {
        p.vel.x += ((p.target.x - p.disp.x) * K - p.vel.x * CD) * sdt;
        p.vel.y += ((p.target.y - p.disp.y) * K - p.vel.y * CD) * sdt;
        p.vel.z += ((p.target.z - p.disp.z) * K - p.vel.z * CD) * sdt;
        p.disp.addScaledVector(p.vel, sdt);
      }
    }
    const vt = p.minLvl <= lvl ? 1 : 0;
    p.vis = reduced ? vt : damp(p.vis, vt, 9, dt);
    const sc = Math.max(0.001, ease.out(p.vis));
    p.obj.visible = p.vis > 0.01;
    p.obj.scale.setScalar(sc);
    p.obj.position.copy(p.restCenter).multiplyScalar(1 - sc).add(p.disp);
    let dimT = 1, glowT = 0;
    if (phSet) { const inv = phSet.has(p.id); dimT = inv ? 1 : 0.2; glowT = inv ? 0.9 : 0; }
    else if (selSet) { const on = selSet.has(p.id), hv = !on && !!hlSet && hlSet.has(p.id); dimT = on ? 1 : hv ? 0.55 : 0.13; glowT = on ? 0.7 : hv ? 0.45 : 0; }
    else if (hlSet) { const on = hlSet.has(p.id); dimT = on ? 1 : 0.5; glowT = on ? 0.55 : 0; }
    p.dim = reduced ? dimT : damp(p.dim, dimT, 8, dt);
    p.glow = reduced ? glowT : damp(p.glow, glowT, 7, dt);
    const op = p.dim * E.fade;
    for (const m of p.mats) { m.opacity = op; m.depthWrite = op > 0.97; }
    const gi = p.glow * E.fade * p.vis;
    p.rimMat.uniforms.uI.value = gi; p.rimMat.uniforms.uColor.value.copy(rimCol);
    for (const r of p.rims) r.visible = gi > 0.01;
  }
}

const _off = new THREE.Vector3();
function updateCamera(dt) {
  const E = cur(); const W = S.W, H = S.H;
  let minY = 1e9, maxY = -1e9, rmax = 0.3;
  for (const p of E.partList) {
    if (p.vis < 0.5) continue;
    const b = p.box, dy = p.disp.y;
    minY = Math.min(minY, b.min.y + dy); maxY = Math.max(maxY, b.max.y + dy);
    const cxp = p.restCenter.x + p.disp.x, czp = p.restCenter.z + p.disp.z;
    const hx = (b.max.x - b.min.x) / 2, hz = (b.max.z - b.min.z) / 2;
    rmax = Math.max(rmax, Math.hypot(cxp, czp) + Math.max(hx, hz));
  }
  if (S.mode === 'func') minY -= E.fx.plumeLen * 0.62 * S.cutE;
  const cy = E.center.position.y;
  const h = maxY - minY, w = rmax * 2;
  const tgtY = (maxY + minY) / 2 + cy;
  const A = S.avail;
  const vf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dH = (h / 2) / vf * (H / A.h);
  const dW = (w / 2) / (vf * W / H) * (W / A.w);
  const dist = Math.max(dH, dW) * 1.12 + rmax * 0.45;
  const k = rig.init ? 1 : 0;
  rig.tdist = dist;
  rig.dist = k ? damp(rig.dist, dist, 3.2, dt) : dist;
  rig.ty = k ? damp(rig.ty, tgtY, 3.2, dt) : tgtY;
  rig.ox = k ? damp(rig.ox, A.cx - W / 2, 3.5, dt) : A.cx - W / 2;
  rig.oy = k ? damp(rig.oy, A.cy - H / 2, 3.5, dt) : A.cy - H / 2;
  rig.init = true;
  _off.copy(camera.position).sub(controls.target).setLength(rig.dist);
  controls.target.set(0, rig.ty, 0);
  camera.position.copy(controls.target).add(_off);
  camera.aspect = W / H;
  camera.setViewOffset(W, H, -rig.ox, -rig.oy, W, H);
  controls.update();
  return { minY: minY + cy, rmax };
}

const _n = new THREE.Vector3();
function updateClip() {
  _n.set(-camera.position.x, 0, -camera.position.z);
  if (_n.lengthSq() < 1e-6) _n.set(0, 0, -1);
  _n.normalize();
  clipPlane.normal.copy(_n);
  clipPlane.constant = S.cutE > 0.001 ? lerp(2.4, -0.002, S.cutE) : 60;
  capU.value = S.cutE > 0.01 ? 1 : 0;
}

/* Strömungs-Zustand je Phase: R = bis wohin der Pfad gefüllt ist, [A,B] = hervorgehobene Strecke */
function updateFlowState(E, dt) {
  const P = PH[E.id], ph = S.ph, cp = P[ph];
  for (const tag of E.tags) {
    const st = E.fs[tag];
    let R = 0; for (let i = 0; i <= ph; i++) { const r = P[i].fl[tag]; if (r) R = Math.max(R, r[1]); }
    const r = cp.fl[tag];
    if (R > st.R) st.R = Math.min(R, st.R + dt * (reduced ? 6 : 0.38)); else st.R = damp(st.R, R, 6, dt);
    st.A = damp(st.A, r ? r[0] : st.A, 5, dt); st.B = damp(st.B, r ? r[1] : st.B, 5, dt);
    st.on = damp(st.on, r ? 1 : 0, 4, dt);
  }
}
function updateParticles(E, dt) {
  const g = E.pts.geometry;
  const P = g.attributes.position.array, Cc = g.attributes.aColor.array, Sz = g.attributes.aSize.array, Al = g.attributes.aAlpha.array;
  const lvl = S.lvl, endF = S.endFade;
  for (let k = 0; k < E.pN; k++) {
    const f = E.flows[E.pPath[k]];
    if (f.min > lvl) { Al[k] = 0; continue; }
    let u = E.pU[k];
    const i0 = Math.min(f.N - 1, (u * (f.N - 1)) | 0);
    u += dt * f.speed * f.spd[i0] / f.len;
    if (u >= 1) u -= 1;
    E.pU[k] = u;
    const x = u * (f.N - 1), i = x | 0, j = Math.min(f.N - 1, i + 1), t = x - i;
    const jt = f.jit;
    P[k * 3] = f.pos[i * 3] + (f.pos[j * 3] - f.pos[i * 3]) * t + E.pJ[k * 3] * jt;
    P[k * 3 + 1] = f.pos[i * 3 + 1] + (f.pos[j * 3 + 1] - f.pos[i * 3 + 1]) * t + E.pJ[k * 3 + 1] * jt;
    P[k * 3 + 2] = f.pos[i * 3 + 2] + (f.pos[j * 3 + 2] - f.pos[i * 3 + 2]) * t + E.pJ[k * 3 + 2] * jt;
    Cc[k * 3] = f.col[i * 3]; Cc[k * 3 + 1] = f.col[i * 3 + 1]; Cc[k * 3 + 2] = f.col[i * 3 + 2];
    Sz[k] = f.siz[i];
    const st = E.fs[f.tag], s = f.s[i];
    const rv = clamp01((st.R - s) / 0.02 + 1);
    const em = st.on * clamp01((s - st.A) / 0.03 + 1) * clamp01((st.B - s) / 0.03 + 1);
    Al[k] = rv * (0.16 + 0.84 * em) * endF * Math.min(1, u / 0.03) * Math.min(1, (1 - u) / 0.12);
  }
  g.attributes.position.needsUpdate = true; g.attributes.aColor.needsUpdate = true; g.attributes.aSize.needsUpdate = true; g.attributes.aAlpha.needsUpdate = true;
}


const _fl = new THREE.Vector3();
function tick(dt, t) {
  uTime.value = t;
  if (eTween) {
    eTween.t += dt; const k = clamp01(eTween.t / eTween.dur);
    S.E = lerp(eTween.from, eTween.to, ease.inOut(k));
    if (k >= 1) eTween = null;
  }
  const func = S.mode === 'func';
  S.dark = reduced ? (func ? 1 : 0) : damp(S.dark, func ? 1 : 0, 2.6, dt);
  S.floatA = damp(S.floatA, (!func && eTarget() < 0.5) ? 1 : 0, 3, dt);
  if (func) { if (S.E < 0.04) S.cutT = Math.min(1, S.cutT + dt / (reduced ? 0.2 : 1.2)); }
  else S.cutT = Math.max(0, S.cutT - dt / (reduced ? 0.2 : 0.8));
  S.cutE = ease.inOut(S.cutT);

  // Zeitleiste (D3): Phasendauer nach Textlänge, läuft erst, wenn der Schnitt steht
  if (func) {
    const n = phases().length, dur = phaseDur(S.ph);
    if (S.playing && S.cutE > 0.6) {
      S.phT += dt;
      if (S.phT >= dur) { if (S.ph < n - 1) goPhase(S.ph + 1, false); else { S.phT = dur; S.playing = false; syncPlay(); } }
    }
    const ph = phases()[S.ph];
    S.endFade = ph.end ? 1 - ease.inOut(clamp01((S.phT / dur - 0.55) / 0.4)) : 1;
    syncSegments();
  } else S.endFade = 1;

  if (mouse && !S.dragging && (mouseDirty || (frame % 6 === 0))) {
    const h = pickPart(mouse.x, mouse.y), hv = h ? resolveEntry(ENTRY_OF[S.eng][h.pid]) : null;
    if (hv !== S.hov && (hv || S.hovSrc === '3d')) setHov(hv, '3d');
    const cz = h ? 'pointer' : ''; if (cz !== curCursor) { canvas.style.cursor = cz; curCursor = cz; }
    mouseDirty = false;
  }

  for (const id of ORDER) { const E = ENG[id]; if (E.root.visible) updateEngine(E, dt, t); }
  const cam = updateCamera(dt);
  updateClip();

  scene.environmentIntensity = lerp(1, 0.3, S.dark);
  keyL.intensity = lerp(1.6, 0.45, S.dark);
  rimL.intensity = lerp(0.9, 1.4, S.dark);

  // Effekte je Phase (D3): Flamme/Strahl, Feststoff-Abbrand, Strömungen füllen nur die Phasenstrecke
  for (const id of ORDER) {
    const E = ENG[id], fx = E.fx, isCur = E === cur() && E.root.visible;
    const on = isCur && func && S.cutE > 0.5;
    const ph = on ? PH[id][S.ph] : null;
    const fiT = ph ? ph.fx[0] * S.endFade : 0, piT = ph ? ph.fx[1] * S.endFade : 0;
    fx.fi = reduced ? fiT : damp(fx.fi, fiT, 3, dt); fx.pi = reduced ? piT : damp(fx.pi, piT, 2.2, dt);
    fx.flame.visible = fx.fi > 0.005; fx.plume.visible = fx.pi > 0.005;
    fx.flame.material.uniforms.uI.value = fx.fi * (0.9 + 0.1 * Math.sin(t * 31));
    fx.plume.material.uniforms.uI.value = fx.pi;
    if (fx.burn) {
      const prog = isCur && func ? (S.ph + clamp01(S.phT / phaseDur(S.ph))) / PH[id].length : 0;
      const b = 1 + 0.9 * prog; fx.flame.scale.set(b, 1, b);
    }
    const pOn = isCur && func && S.cutE > 0.3;
    if (isCur && func) updateFlowState(E, dt);
    const pm = E.pts.material.uniforms.uFade;
    pm.value = damp(pm.value, pOn ? 1 : 0, 4, dt);
    E.pts.visible = pm.value > 0.01 && E.root.visible;
    if (E.pts.visible) updateParticles(E, dt);
    if (isCur) {
      _fl.copy(fx.lightPos).applyMatrix4(E.center.matrixWorld);
      fireL.position.copy(_fl); fireL.color.setHex(fx.light);
      fireL.intensity = 1.4 * fx.fi;
    }
  }

  const E = cur();
  const sy = cam.minY * E.root.scale.y + E.root.position.y - 0.1;
  shadow.position.y = damp(shadow.position.y, Math.min(sy, -1.0), 4, dt);
  const ss = Math.max(1.2, cam.rmax * 2.6);
  shadow.scale.x = damp(shadow.scale.x, ss, 4, dt); shadow.scale.z = shadow.scale.x * 0.55;
  shadow.material.opacity = 0.75 * (1 - S.dark) * E.fade * (1 - 0.25 * clamp01(S.E));

  renderer.render(scene, camera);
  layoutTags(dt, cam);
  if (eTween || frame % 15 === 0) syncBar();
}

/* ---------- Start ---------- */
let frame = 0, last = performance.now(), raf = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now; frame++;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
});

for (const id of ORDER) ENG[id].root.visible = true;
try { renderer.compile(scene, camera); } catch (err) { console.warn(err); }
for (const id of ORDER) ENG[id].root.visible = false;

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
const startE = cur(); startE.root.visible = true; startE.dir = 1; startE.pres = reduced ? 0.6 : 0; startE.turn = 0.55;
seedEntry(startE, 0.8);
for (const id of ORDER) if (id !== S.eng) { ENG[id].dir = -1; ENG[id].pres = 0; }
applyDetail();
renderAll();
onResize();
applyStage(); syncPlay();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncSegs(); syncTabs(); rebuildTags(); if (S.tab === 'func') measureCaption(); });
raf = requestAnimationFrame(loop);
</script>
