<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vergleichsboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --line: #e2e2dd; --text: #18181b; --muted: #6b6b70;
    --accent: #ff5a1f; --accent-ink: #ffffff; --chip: #ececea; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0f; --panel: #16161a; --line: #2a2a30; --text: #ededf0; --muted: #8d8d96;
      --accent: #ff6a33; --accent-ink: #0d0d0f; --chip: #222227; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0f; --panel: #16161a; --line: #2a2a30; --text: #ededf0; --muted: #8d8d96;
    --accent: #ff6a33; --accent-ink: #0d0d0f; --chip: #222227; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 "Geist", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  header .meta { color: var(--muted); font-family: "Geist Mono", monospace; font-size: 12px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #stage { position: relative; min-height: 0; padding: 12px; display: grid; gap: 12px; }
  #stage.single { grid-template-columns: 1fr; }
  #stage.grid { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .frame { position: relative; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); min-height: 0; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .frame .tag { position: absolute; left: 10px; top: 10px; background: rgb(0 0 0 / .65); color: #fff; font: 500 12px "Geist Mono", monospace; padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  .frame .open { position: absolute; right: 10px; top: 10px; background: rgb(0 0 0 / .65); color: #fff; font: 500 12px "Geist", sans-serif; padding: 4px 8px; border-radius: 6px; text-decoration: none; }
  #stage.single .frame:not(.active) { display: none; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  aside h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card.current { border-color: var(--accent); }
  .card .title { display: flex; align-items: baseline; gap: 8px; }
  .card .title b { font-family: "Geist Mono", monospace; }
  .card .idea { color: var(--muted); font-size: 12.5px; }
  .stars { display: flex; gap: 2px; }
  .stars button { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--line); padding: 2px; }
  .stars button.on { color: var(--accent); }
  textarea { width: 100%; min-height: 56px; resize: vertical; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  label.radio { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .actions { display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 14px; font: 600 14px "Geist", sans-serif; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--chip); color: var(--text); }
  #status { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 70vh auto; }
    #stage.grid { grid-template-columns: 1fr; grid-auto-rows: 60vh; overflow-y: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Vergleichsboard</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <div class="seg" id="tabs" role="group" aria-label="Variante wählen"></div>
  <div class="seg" role="group" aria-label="Ansicht">
    <button id="viewSingle" aria-pressed="true">Einzeln</button>
    <button id="viewGrid" aria-pressed="false">Alle</button>
  </div>
</header>
<main>
  <section id="stage" class="single"></section>
  <aside>
    <div>
      <h2>Bewertung pro Variante</h2>
      <div id="cards" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
    <div>
      <h2>Favorit</h2>
      <div id="favorite" class="chips"></div>
    </div>
    <div>
      <h2>Kombinieren – was soll übernommen werden?</h2>
      <textarea id="combine" placeholder="z.B. „Look von B, Interaktion von C, Explosionsansicht von D“"></textarea>
    </div>
    <div>
      <h2>Gesamteindruck / nächste Richtung</h2>
      <textarea id="overall" placeholder="Was fehlt? Was soll als Nächstes vertieft werden?"></textarea>
    </div>
    <div class="actions">
      <button class="btn primary" id="send">Feedback an Claude senden</button>
      <button class="btn ghost" id="copy">Als Text kopieren</button>
      <div id="status" role="status"></div>
    </div>
  </aside>
</main>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const DRAFT_KEY = 'board-draft:' + location.pathname;
  let cfg;
  try {
    cfg = await (await fetch('variants.json', { cache: 'no-store' })).json();
  } catch (e) {
    $('#stage').innerHTML = '<p style="padding:24px">variants.json konnte nicht geladen werden. Board bitte über den board_server.py öffnen.</p>';
    return;
  }
  const state = { current: cfg.variants[0].id, view: 'single', ratings: {}, notes: {}, favorite: null };
  try { Object.assign(state, JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'), { view: 'single' }); } catch (e) {}
  const save = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {} };

  document.title = cfg.title || 'Vergleichsboard';
  $('#title').textContent = cfg.title || 'Vergleichsboard';
  $('#meta').textContent = cfg.round ? `Runde ${cfg.round} · ${cfg.variants.length} Varianten` : `${cfg.variants.length} Varianten`;

  // Frames: nur aktive Variante(n) laden, damit nicht 4 WebGL-Kontexte gleichzeitig rendern
  const frames = {};
  for (const v of cfg.variants) {
    const f = document.createElement('div');
    f.className = 'frame';
    f.innerHTML = `<span class="tag">${v.id} · ${v.name}</span><a class="open" href="${v.file}" target="_blank" rel="noopener">Vollbild ↗</a>`;
    $('#stage').appendChild(f);
    frames[v.id] = f;
  }
  const ensureLoaded = (id) => {
    const f = frames[id];
    if (!f.querySelector('iframe')) {
      const v = cfg.variants.find((x) => x.id === id);
      const i = document.createElement('iframe');
      i.src = v.file; i.title = v.name; i.allow = 'fullscreen';
      f.prepend(i);
    }
  };
  const unload = (id) => frames[id].querySelector('iframe')?.remove();

  // Tabs
  for (const v of cfg.variants) {
    const b = document.createElement('button');
    b.textContent = v.id; b.title = v.name; b.dataset.id = v.id;
    b.onclick = () => { state.current = v.id; render(); };
    $('#tabs').appendChild(b);
  }
  $('#viewSingle').onclick = () => { state.view = 'single'; render(); };
  $('#viewGrid').onclick = () => { state.view = 'grid'; render(); };

  // Karten
  for (const v of cfg.variants) {
    const c = document.createElement('div');
    c.className = 'card'; c.dataset.id = v.id;
    c.innerHTML = `
      <div class="title"><b>${v.id}</b><span>${v.name}</span></div>
      <div class="idea">${v.idea || ''}</div>
      <div class="stars" role="group" aria-label="Bewertung ${v.id}">${[1,2,3,4,5].map((n) => `<button data-n="${n}" aria-label="${n} von 5">★</button>`).join('')}</div>
      <textarea placeholder="Was gefällt dir, was nicht?">${state.notes[v.id] || ''}</textarea>`;
    c.querySelectorAll('.stars button').forEach((s) => s.onclick = () => { state.ratings[v.id] = +s.dataset.n; render(); save(); });
    c.querySelector('textarea').oninput = (e) => { state.notes[v.id] = e.target.value; save(); };
    c.onclick = (e) => { if (e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { state.current = v.id; render(); } };
    $('#cards').appendChild(c);

    const l = document.createElement('label');
    l.innerHTML = `<input type="radio" name="fav" value="${v.id}"> ${v.id}`;
    l.querySelector('input').onchange = () => { state.favorite = v.id; save(); };
    if (state.favorite === v.id) l.querySelector('input').checked = true;
    $('#favorite').appendChild(l);
  }
  const none = document.createElement('label');
  none.innerHTML = `<input type="radio" name="fav" value=""> keine`;
  none.querySelector('input').onchange = () => { state.favorite = null; save(); };
  $('#favorite').appendChild(none);
  $('#combine').value = state.combine || ''; $('#combine').oninput = (e) => { state.combine = e.target.value; save(); };
  $('#overall').value = state.overall || ''; $('#overall').oninput = (e) => { state.overall = e.target.value; save(); };

  function render() {
    $('#stage').className = state.view;
    $('#viewSingle').setAttribute('aria-pressed', state.view === 'single');
    $('#viewGrid').setAttribute('aria-pressed', state.view === 'grid');
    for (const v of cfg.variants) {
      const active = v.id === state.current;
      frames[v.id].classList.toggle('active', active);
      if (state.view === 'grid' || active) ensureLoaded(v.id); else unload(v.id);
      $(`#tabs [data-id="${v.id}"]`).setAttribute('aria-pressed', active);
      const card = $(`#cards [data-id="${v.id}"]`);
      card.classList.toggle('current', active);
      card.querySelectorAll('.stars button').forEach((s) => s.classList.toggle('on', +s.dataset.n <= (state.ratings[v.id] || 0)));
    }
  }
  render();

  const payload = () => ({
    exploration: cfg.title, round: cfg.round || 1,
    favorite: state.favorite,
    variants: cfg.variants.map((v) => ({ id: v.id, name: v.name, rating: state.ratings[v.id] || null, notes: (state.notes[v.id] || '').trim() })),
    combine: (state.combine || '').trim(), overall: (state.overall || '').trim(),
  });
  const asText = (p) => [
    `Feedback ${p.exploration} (Runde ${p.round})`,
    `Favorit: ${p.favorite || '–'}`,
    ...p.variants.map((v) => `${v.id} ${v.name}: ${v.rating ? v.rating + '/5' : 'ohne Wertung'}${v.notes ? ' – ' + v.notes : ''}`),
    p.combine && `Kombinieren: ${p.combine}`, p.overall && `Gesamt: ${p.overall}`,
  ].filter(Boolean).join('\n');

  $('#send').onclick = async () => {
    const p = payload();
    try {
      const r = await fetch('/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
      if (!r.ok) throw new Error(r.status);
      $('#status').textContent = '✓ Gespeichert als feedback.json – sag Claude im Terminal einfach „Feedback ist da“.';
    } catch (e) {
      $('#status').textContent = 'Server nicht erreichbar – nutze „Als Text kopieren“ und füge es im Terminal ein.';
    }
  };
  $('#copy').onclick = async () => {
    try { await navigator.clipboard.writeText(asText(payload())); $('#status').textContent = '✓ In die Zwischenablage kopiert.'; }
    catch (e) { $('#status').textContent = 'Kopieren nicht erlaubt – bitte manuell abschreiben.'; }
  };
})();
</script>
</body>
</html>
