<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triebwerke – Geführte Keynote</title>
<meta name="description" content="Raketentriebwerke als geführte 3D-Keynote: Überblick, Bauteile und Funktions-Phasen von Feststoff, Gasgenerator, Stufenverbrennung und Ionentriebwerk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0e13; --ink2:#3b404b; --mute:#737986; --inv:#ffffff;
  --line:rgba(12,14,19,.10); --track:rgba(12,14,19,.14); --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.9); --glass-b:rgba(12,14,19,.07);
  --card-on:#ffffff; --hover:rgba(12,14,19,.06);
  --accent:#0a66ff; --fuel:#ff7a1a; --lox:#12b5e5; --ion:#7c5cff; --hot:#ff9a3c;
  --shadow:0 22px 44px -22px rgba(20,24,40,.28), 0 2px 8px rgba(20,24,40,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-pill:999px; --r-card:20px;
}
body.func{
  --ink:#f2f4f8; --ink2:#c7cdd8; --mute:#8f97a6; --inv:#0c0e13;
  --line:rgba(255,255,255,.12); --track:rgba(255,255,255,.16); --glass:rgba(24,27,36,.62); --glass-strong:rgba(24,27,36,.9); --glass-b:rgba(255,255,255,.08);
  --card-on:rgba(255,255,255,.12); --hover:rgba(255,255,255,.08);
  --shadow:0 22px 44px -22px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#eceef1;color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;transition:color .8s var(--ease)}
button{font-family:inherit;color:inherit}
.bg{position:fixed;inset:0;transition:opacity 1.2s var(--ease)}
.bg-light{background:radial-gradient(115% 90% at 62% 42%,#ffffff 0%,#f5f6f8 36%,#e3e6ea 72%,#d6dae0 100%)}
.bg-dark{background:radial-gradient(110% 90% at 62% 44%,#1c212c 0%,#0e1016 52%,#05060a 100%);opacity:0}
body.func .bg-dark{opacity:1}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}

/* ---------- Einzelnes 3D-Label ---------- */
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;transition:opacity .18s linear;z-index:2}
#lines.show{opacity:1;transition:opacity .45s var(--ease)}
#lines path{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:1}
#lines circle{fill:var(--ink)}
.tag{position:fixed;left:0;top:0;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:var(--r-pill);z-index:2;
  border:1px solid var(--glass-b);background:var(--glass-strong);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  font:600 13px/1 Manrope,sans-serif;color:var(--ink);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .18s linear;box-shadow:0 8px 22px -12px rgba(20,24,40,.4)}
.tag.show{opacity:1;transition:opacity .45s var(--ease)}
.tag .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 11px/1 Sora,sans-serif;flex:none}
.tag.ro{padding:7px 14px 7px 12px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c,#ff9a3c);box-shadow:0 0 10px var(--c,#ff9a3c);flex:none}

/* ---------- Kopfzeile ---------- */
.top{position:fixed;top:0;left:0;right:0;height:76px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;pointer-events:none;z-index:6}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font:600 13px/1 Sora,sans-serif;letter-spacing:.01em;color:var(--ink)}
.brand i{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--fuel),var(--hot),var(--lox),var(--ion),var(--fuel));flex:none}
.brand span{color:var(--mute);font-weight:400}
.levels{position:relative;display:flex;padding:4px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--glass-b);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}
.levels button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;border:0;background:none;font:600 13px/1 Manrope,sans-serif;color:var(--ink2);
  padding:10px 16px;border-radius:var(--r-pill);cursor:pointer;transition:color .4s var(--ease);display:flex;align-items:center;gap:8px;white-space:nowrap}
.levels button:hover{color:var(--ink)}
.levels button .st{display:inline-flex;gap:2px}
.levels button .st b{width:3px;height:9px;border-radius:2px;background:currentColor;opacity:.28}
.levels button .st b.f{opacity:1}
.levels button[aria-checked="true"],.levels button[aria-checked="true"]:hover{color:var(--inv)}
.lvl-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:var(--r-pill);background:var(--ink);transition:transform .55s var(--ease),width .55s var(--ease),background .8s}
.badge{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:6;font:600 10.5px/1 Sora,sans-serif;letter-spacing:.06em;padding:8px 12px;border-radius:var(--r-pill);
  background:var(--glass);border:1px solid var(--glass-b);color:var(--mute);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap}

/* ---------- Bildunterschrift (Keynote-Caption) ---------- */
.cap{position:fixed;left:56px;top:96px;bottom:204px;width:min(440px,36vw);display:flex;flex-direction:column;justify-content:center;z-index:3;pointer-events:none}
.cap-in{pointer-events:auto;max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;opacity:0;padding:0 4px 4px 0}
.cap-in::-webkit-scrollbar{display:none}
.kick{font:600 11px/1.3 Sora,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.kick b{color:var(--ink);font-weight:700}
.hl{font:600 clamp(34px,3.2vw,52px)/1.04 Sora,sans-serif;letter-spacing:-.04em;margin:0 0 20px;color:var(--ink);text-wrap:balance}
.hl.xl{font-size:clamp(46px,5vw,78px);line-height:.95;letter-spacing:-.05em}
.hl .w{display:inline-block;white-space:nowrap}
.hl .c{display:inline-block}
.hl .num{display:inline-grid;place-items:center;width:.82em;height:.82em;border-radius:50%;background:var(--accent);color:#fff;font-size:.5em;letter-spacing:0;vertical-align:.32em;margin-right:.42em}
.body{font:400 17px/1.62 Manrope,sans-serif;color:var(--ink2);margin:0 0 24px;max-width:36ch}
.meta{font:500 13px/1.5 Manrope,sans-serif;color:var(--mute);margin:0 0 24px;max-width:40ch}
.keys{font:500 12px/1.4 Manrope,sans-serif;color:var(--mute);margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
kbd{font:600 11px/1 Sora,sans-serif;padding:4px 7px;border-radius:6px;border:1px solid var(--track);color:var(--ink2);background:var(--glass)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips button{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 5px;border-radius:var(--r-pill);border:1px solid var(--glass-b);
  background:var(--glass);font:600 12.5px/1 Manrope,sans-serif;color:var(--ink);cursor:pointer;transition:background .25s,border-color .25s}
.chips button:hover{background:var(--glass-strong);border-color:var(--track)}
.chips .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--inv);display:grid;place-items:center;font:700 10px/1 Sora,sans-serif}
.legend{list-style:none;margin:0;padding:16px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 20px;font:600 12.5px/1.2 Manrope,sans-serif;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:8px}
.legend li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:0 0 24px}
.stats div{padding:14px 0;border-top:1px solid var(--line)}
.stats dt{font:500 12px/1.3 Manrope,sans-serif;color:var(--mute);margin:0 0 6px}
.stats dd{margin:0;font:600 20px/1.2 Sora,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.formula{font:500 14px/1.55 Sora,sans-serif;color:var(--ink2);margin:0;letter-spacing:.01em}
.phlist{list-style:none;margin:0;padding:0;display:grid}
.phlist li{display:flex;gap:12px;align-items:center;padding:6px 0;color:var(--mute);font:500 14px/1.3 Manrope,sans-serif;transition:color .5s var(--ease)}
.phlist li b{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 10px/1 Sora,sans-serif;flex:none;transition:background .5s,border-color .5s,color .5s,box-shadow .5s}
.phlist li.on{color:var(--ink)}
.phlist li.on b{background:var(--hot);border-color:transparent;color:#0c0e13;box-shadow:0 0 18px rgba(255,154,60,.55)}
body.ion .phlist li.on b{background:#9b7bff;box-shadow:0 0 18px rgba(124,92,255,.6)}

/* ---------- Tour-Navigation ---------- */
.bar{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px;border-radius:var(--r-pill);z-index:5;
  width:min(880px,calc(100% - 48px));background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--shadow);
  transition:opacity .45s var(--ease),visibility 0s}
#freebar{width:auto;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s var(--ease),visibility 0s .45s}
body.free #freebar{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .45s var(--ease),visibility 0s}
body.free #tourbar{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s var(--ease),visibility 0s .3s}
.nb{appearance:none;-webkit-appearance:none;border:0;height:48px;min-width:48px;padding:0 18px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;gap:10px;flex:none;
  background:transparent;color:var(--ink);font:600 14px/1 Sora,sans-serif;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:background .3s,color .3s,opacity .3s,transform .3s var(--ease)}
.nb:hover{background:var(--hover)}
.nb:active{transform:scale(.97)}
.nb.ic{padding:0;width:48px}
.nb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nb.primary{background:var(--ink);color:var(--inv);padding:0 22px 0 24px}
.nb.primary:hover{background:var(--ink);opacity:.9}
.nb[disabled]{opacity:.32;cursor:default}
.nb[disabled]:hover{background:transparent}
.nb:focus-visible,.seg:focus-visible,.chl:focus-visible,.card:focus-visible,.levels button:focus-visible,.chips button:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#btnAuto[aria-pressed="true"]{background:var(--ink);color:var(--inv)}
#btnAuto .pa,#btnAuto[aria-pressed="true"] .pl{display:none}
#btnAuto[aria-pressed="true"] .pa{display:block}
#btnAuto svg path{fill:currentColor;stroke:none}
.sep{width:1px;height:28px;background:var(--line);flex:none}
.prog{flex:1;min-width:0;display:flex;gap:12px;padding:0 10px}
.ch{flex:1 1 0;min-width:min-content;display:flex;flex-direction:column;gap:2px}
.chl{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;font:600 10px/1.2 Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;cursor:pointer;white-space:nowrap;transition:color .4s}
.ch.on .chl{color:var(--ink)}
.segs{display:flex;gap:3px}
.seg{appearance:none;-webkit-appearance:none;border:0;background:none;padding:7px 0;margin:0;flex:1 1 0;min-width:4px;cursor:pointer}
.seg i{display:block;position:relative;height:3px;border-radius:3px;background:var(--track);overflow:hidden;transition:height .3s var(--ease)}
.seg:hover i{height:5px}
.seg b{position:absolute;inset:0;background:var(--ink);transform-origin:left center;transform:scaleX(0);transition:transform .45s var(--ease),opacity .4s}
.seg.done b{transform:scaleX(1);opacity:.42}
.seg.on b{opacity:1;transition:opacity .4s}

/* ---------- Freies Erkunden ---------- */
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:var(--r-pill);height:48px;padding:0 22px;display:inline-flex;align-items:center;gap:10px;flex:none;
  font:600 14px/1 Sora,sans-serif;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:transform .35s var(--ease),background .4s,color .4s,box-shadow .4s}
.pill:active{transform:scale(.97)}
#btnExplode{background:var(--ink);color:var(--inv);min-width:172px;justify-content:center}
#btnExplode .xi{width:18px;height:18px;position:relative;flex:none}
#btnExplode .xi i{position:absolute;left:3px;right:3px;height:4px;border-radius:1.5px;background:currentColor;transition:transform .55s var(--ease)}
#btnExplode .xi i:nth-child(1){top:2px}
#btnExplode .xi i:nth-child(2){top:7px}
#btnExplode .xi i:nth-child(3){top:12px}
#btnExplode[aria-pressed="true"] .xi i:nth-child(1){transform:translateY(-2px) translateX(-2px)}
#btnExplode[aria-pressed="true"] .xi i:nth-child(3){transform:translateY(2px) translateX(2px)}
#btnFunc{background:transparent;color:var(--ink)}
#btnFunc:hover{background:var(--hover)}
#btnFunc svg{width:14px;height:14px;fill:currentColor}
#btnFunc[aria-pressed="true"]{background:linear-gradient(135deg,#ffb054,#ff5a1f);color:#fff;box-shadow:0 10px 28px -10px rgba(255,90,31,.8)}
body.ion #btnFunc[aria-pressed="true"]{background:linear-gradient(135deg,#9f86ff,#4b5bff);box-shadow:0 10px 28px -10px rgba(91,80,255,.8)}
.scrub{display:flex;align-items:center;gap:10px;padding:0 4px 0 8px;min-width:0}
.scrub input{-webkit-appearance:none;appearance:none;width:160px;height:30px;background:transparent;cursor:pointer;margin:0;min-width:0}
.scrub input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--track) var(--p,0%))}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.22);margin-top:-7.5px}
.scrub input::-moz-range-track{height:3px;border-radius:3px;background:var(--track)}
.scrub input::-moz-range-progress{height:3px;border-radius:3px;background:var(--ink)}
.scrub input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.scrub output{font:600 12px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);width:40px;text-align:right}

/* ---------- Triebwerks-Auswahl ---------- */
.carousel{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:10px;z-index:4}
.card{appearance:none;-webkit-appearance:none;position:relative;display:flex;align-items:center;gap:12px;width:176px;height:72px;padding:10px 16px 10px 12px;border-radius:var(--r-card);
  border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);
  cursor:pointer;text-align:left;color:var(--ink);transition:transform .5s var(--ease),background .4s,box-shadow .4s}
.card:hover{transform:translateY(-2px)}
.card svg{width:30px;height:48px;flex:none;fill:var(--ink);opacity:.28;transition:opacity .5s,transform .7s var(--ease)}
.card[aria-current="true"]{background:var(--card-on)}
.card[aria-current="true"] svg{opacity:1;transform:scale(1.05)}
.card .k{display:block;font:700 10px/1 Sora,sans-serif;letter-spacing:.14em;color:var(--mute)}
.card .t{display:block;font:600 14px/1.15 Sora,sans-serif;letter-spacing:-.01em;margin-top:5px}
.card .s{display:block;font:500 12px/1.2 Manrope,sans-serif;color:var(--mute);margin-top:3px}
.card::after{content:"";position:absolute;left:20px;right:20px;bottom:7px;height:2px;border-radius:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.card[aria-current="true"]::after{transform:scaleX(1)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{position:fixed;inset:0;display:grid;place-items:center;font:500 16px Manrope,sans-serif}

@media (max-width:1100px){
  .badge{top:auto;bottom:4px;font-size:9.5px;padding:5px 10px}
  .cap{left:40px}
  .nb.primary{padding:0 18px}
}
@media (max-width:980px){
  .nb .lbl{display:none}
  .nb.primary,.nb.wide{padding:0;width:48px}
}
/* Gestapeltes Layout: Hochformat & schmale Screens (muss zu STACK in JS passen) */
@media (max-aspect-ratio:1/1), (max-width:620px){
  .top{height:60px;padding:0 16px}
  .cap{left:40px;right:40px;width:auto;top:auto;bottom:174px;display:block}
  .cap-in{max-height:min(40vh,420px);padding:0}
  .hl{font-size:36px;margin-bottom:12px}
  .hl.xl{font-size:48px}
  .body{max-width:60ch;margin-bottom:16px}
  .meta{margin-bottom:12px}
  .bar{bottom:98px;left:24px;right:24px;width:auto;transform:none}
  #freebar{width:auto}
  .carousel{left:24px;right:24px;bottom:24px;transform:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .card{width:auto;height:62px;padding:8px 12px}
  .card svg{width:22px;height:36px}
  .card .s{display:none}
  .badge{bottom:4px}
}
@media (max-width:620px){
  .brand{font-size:0;gap:0}
  .levels button{padding:9px 10px;font-size:12px}
  .levels button .st{display:none}
  .cap{left:16px;right:16px;bottom:146px}
  .cap-in{max-height:38vh}
  .kick{font-size:10px;letter-spacing:.14em;margin-bottom:8px}
  .hl{font-size:27px;margin-bottom:8px;letter-spacing:-.035em}
  .hl.xl{font-size:36px;margin-bottom:10px}
  .body{font-size:15px;line-height:1.5;margin-bottom:12px}
  .meta,.keys{display:none}
  .chips{gap:6px}
  .chips button{height:28px;font-size:12px}
  .legend{padding-top:10px;gap:8px 14px;font-size:12px}
  .stats{margin-bottom:12px;gap:0 16px}
  .stats div{padding:8px 0}
  .stats dd{font-size:16px}
  .formula{font-size:12.5px}
  .phlist li{padding:3px 0;font-size:12.5px}
  .phlist li b{width:20px;height:20px}
  .bar{left:12px;right:12px;bottom:84px;padding:4px;gap:4px}
  .nb{height:44px;min-width:44px}
  .nb.ic,.nb.primary,.nb.wide{width:44px}
  .sep{display:none}
  .prog{padding:0 6px;gap:6px}
  .chl{display:none}
  .pill{height:44px;padding:0 14px;font-size:13.5px;gap:8px}
  #btnExplode{min-width:0}
  #btnExplode .lbl{display:none}
  .scrub{flex:1;padding:0 2px}
  .scrub input{width:100%}
  .scrub output{display:none}
  .carousel{left:12px;right:12px;bottom:22px;gap:6px}
  .card{height:54px;flex-direction:column;justify-content:center;gap:3px;padding:6px 4px 9px;border-radius:16px;text-align:center}
  .card svg{width:16px;height:24px}
  .card .k{display:none}
  .card .t{font-size:11px;margin:0}
  .card::after{left:30%;right:30%;bottom:5px}
  .tag{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01s !important;animation-duration:.01s !important}
  .card:hover{transform:none}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="bg bg-light"></div>
<div class="bg bg-dark"></div>

  const E = cur(), W = innerWidth, H = innerHeight, ex = extents(E);
  let minY = ex.minY; if (S.func) minY -= E.fx.plumeLen * 0.62 * S.cutE;
  const cy = E.center.position.y, h = ex.maxY - minY, w = ex.rmax * 2, tgtY = (ex.maxY + minY) / 2 + cy;
  const A = S.avail, vf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dH = (h / 2) / vf * (H / A.h), dW = (w / 2) / (vf * W / H) * (W / A.w);
  const dist = (Math.max(dH, dW) * 1.12 + ex.rmax * 0.45) * S.zoom;
  rig.dist = damp(rig.dist, dist, 2.6, dt); rig.ty = damp(rig.ty, tgtY, 2.6, dt);
  rig.tx = damp(rig.tx, 0, 2.6, dt); rig.tz = damp(rig.tz, 0, 2.6, dt);
  rig.ox = damp(rig.ox, A.cx - W / 2, 3.5, dt); rig.oy = damp(rig.oy, A.cy - H / 2, 3.5, dt);
  _off.copy(camera.position).sub(controls.target).setLength(rig.dist);
  controls.target.set(rig.tx, rig.ty, rig.tz);
  camera.position.copy(controls.target).add(_off);
  camera.setViewOffset(W, H, -rig.ox, -rig.oy, W, H);
  controls.update();
}

const _n = new THREE.Vector3();
function updateClip() {
  _n.set(controls.target.x - camera.position.x, 0, controls.target.z - camera.position.z);
  if (_n.lengthSq() < 1e-6) _n.set(0, 0, -1);
  _n.normalize();
  clipPlane.normal.copy(_n);
  clipPlane.constant = S.cutE > 0.001 ? lerp(2.4, -0.002, S.cutE) : 60;
  capU.value = S.cutE > 0.01 ? 1 : 0;
}

function updateParticles(E, dt) {
  const g = E.pts.geometry, pa = E.phA;
  const P = g.attributes.position.array, Cc = g.attributes.aColor.array, Sz = g.attributes.aSize.array, Al = g.attributes.aAlpha.array;
  const lvl = S.lvl;
  for (let k = 0; k < E.pN; k++) {
    const f = E.flows[E.pPath[k]];
    if (f.min > lvl) { Al[k] = 0; continue; }
    let u = E.pU[k];
    const i0 = Math.min(f.N - 1, (u * (f.N - 1)) | 0);
    u += dt * f.speed * f.spd[i0] / f.len;
    if (u >= 1) u -= 1;
    E.pU[k] = u;
    const x = u * (f.N - 1), i = x | 0, j = Math.min(f.N - 1, i + 1), t = x - i;
    const jt = f.jit;
    P[k * 3] = f.pos[i * 3] + (f.pos[j * 3] - f.pos[i * 3]) * t + E.pJ[k * 3] * jt;
    P[k * 3 + 1] = f.pos[i * 3 + 1] + (f.pos[j * 3 + 1] - f.pos[i * 3 + 1]) * t + E.pJ[k * 3 + 1] * jt;
    P[k * 3 + 2] = f.pos[i * 3 + 2] + (f.pos[j * 3 + 2] - f.pos[i * 3 + 2]) * t + E.pJ[k * 3 + 2] * jt;
    Cc[k * 3] = f.col[i * 3]; Cc[k * 3 + 1] = f.col[i * 3 + 1]; Cc[k * 3 + 2] = f.col[i * 3 + 2];
    Sz[k] = f.siz[i];
    // Phase: Teilchen erscheinen nur in Abschnitten, deren Phase schon erreicht ist (weich an der Grenze)
    const a0 = pa[f.ph[i]], nx = f.nph[i];
    let a = a0;
    if (nx) { const an = pa[nx]; if (an < a0) a = an + (a0 - an) * Math.min(1, f.dn[i] / 0.05); }
    Al[k] = a * Math.min(1, u / 0.03) * Math.min(1, (1 - u) / 0.12);
  }
  g.attributes.position.needsUpdate = true; g.attributes.aColor.needsUpdate = true; g.attributes.aSize.needsUpdate = true; g.attributes.aAlpha.needsUpdate = true;
}

const _fl = new THREE.Vector3();
function tick(dt, t) {
  uTime.value = t;
  if (eTween) {
    eTween.t += dt; const k = clamp01(eTween.t / eTween.dur);
    S.E = lerp(eTween.from, eTween.to, ease.inOut(k));
    if (k >= 1) eTween = null;
    if (S.free) syncExplodeUI();
  }
  const func = S.func;
  S.dark = reduced ? (func ? 1 : 0) : damp(S.dark, func ? 1 : 0, 2.6, dt);
  if (func) { if (S.E < 0.04) S.cutT = Math.min(1, S.cutT + dt / (reduced ? 0.2 : 1.0)); }
  else S.cutT = Math.max(0, S.cutT - dt / (reduced ? 0.2 : 0.7));
  S.cutE = ease.inOut(S.cutT);
  if (func) S.funcT += dt;
  if (S.free && func) {
    const n = PH[S.eng].length, fp = Math.min(n - 1, Math.floor(Math.max(0, S.funcT - 0.6) / 1.2));
    if (fp !== S.freePh) { S.freePh = fp; syncFreePh(); }
  }
  // sanftes Schweben nur in Schritten ohne Label (Überblick/Fazit)
  const floatOn = !reduced && !S.free && S.spec && S.spec.spin && !tg.on;
  S.floatA = damp(S.floatA, floatOn ? 0.035 : 0, 3, dt);
  if (!floatOn && S.floatA < 0.002) S.floatA = 0;

  if (mouse && !S.dragging && (mouseDirty || (frame % 6 === 0))) {
    const h = pickPart(mouse.x, mouse.y); S.hover = h ? h.u : null; mouseDirty = false;
    const ck = h ? 'pointer' : ''; if (ck !== cursorK) { cursorK = ck; canvas.style.cursor = ck; }
  }

  if (!S.free) rigTour(dt);
  anyRim = false;
  for (const id of ORDER) { const E = ENG[id]; if (E.root.visible) updateEngine(E, dt, t); }
  rimMat.uniforms.uI.value = damp(rimMat.uniforms.uI.value, anyRim ? 0.9 : 0, 8, dt);
  if (S.free) camFree(dt); else camApply();
  updateClip();

  scene.environmentIntensity = lerp(1, 0.3, S.dark);
  keyL.intensity = lerp(1.6, 0.45, S.dark);
  rimL.intensity = lerp(0.9, 1.4, S.dark);

  // Effekte je Phase
  for (const id of ORDER) {
    const E = ENG[id], fx = E.fx, isCur = E === cur() && E.root.visible, phs = PH[id];
    const on = isCur && func && S.cutE > 0.5;
    let flT = 0, plT = 0, dimAll = 1, burnT = 1;
    if (on) {
      if (S.free) {
        for (let i = 0; i <= S.freePh && i < phs.length; i++) { flT = Math.max(flT, phs[i].fx.fl); plT = Math.max(plT, phs[i].fx.pl); }
        burnT = 1 + 0.45 * (1 - Math.cos(S.funcT * 0.3));
      } else if (S.phase >= 0) {
        const P = phs[S.phase]; flT = P.fx.fl; plT = P.fx.pl; dimAll = P.dimAll || 1;
        burnT = P.burn || (S.phase === 0 ? 1 : 1 + 0.4 * (1 - Math.cos(S.funcT * 0.35)));
      }
    }
    fx.fi = damp(fx.fi, flT, 3, dt); fx.pi = damp(fx.pi, plT, 2.2, dt);
    fx.flame.visible = fx.fi > 0.005; fx.plume.visible = fx.pi > 0.005;
    fx.flame.material.uniforms.uI.value = fx.fi * (0.9 + 0.1 * Math.sin(t * 31));
    fx.plume.material.uniforms.uI.value = fx.pi;
    if (fx.burn) { fx.bb = damp(fx.bb, burnT, 1.5, dt); fx.flame.scale.set(fx.bb, 1, fx.bb); }
    if (isCur) {
      for (let p = 1; p < 10; p++) {
        const i = p - 1; let tgt = 0;
        if (S.free) tgt = i <= S.freePh ? 1 : 0;
        else if (S.phase >= 0) { const P = phs[S.phase]; tgt = (i < S.phase ? (P.all ? 1 : 0.3) : i === S.phase ? 1 : 0) * dimAll; }
        E.phA[p] = reduced ? tgt : damp(E.phA[p], tgt, 4, dt);
      }
    }
    const pOn = isCur && func && S.cutE > 0.3;
    const pm = E.pts.material.uniforms.uFade;
    pm.value = damp(pm.value, pOn ? 1 : 0, 4, dt);
    E.pts.visible = pm.value > 0.01 && E.root.visible;
    if (E.pts.visible) updateParticles(E, dt);
    if (isCur) {
      _fl.copy(fx.lightPos).applyMatrix4(E.center.matrixWorld);
      fireL.position.copy(_fl); fireL.color.setHex(fx.light);
      fireL.intensity = 1.4 * fx.fi;
    }
  }

  // Kontaktschatten
  const E = cur(), ex = extents(E);
  const sy = (ex.minY + E.center.position.y) * E.root.scale.y + E.root.position.y - 0.1;
  shadow.position.y = damp(shadow.position.y, Math.min(sy, -1.0), 4, dt);
  const ss = Math.max(1.2, ex.rmax * 2.6);
  shadow.scale.x = damp(shadow.scale.x, ss, 4, dt); shadow.scale.z = shadow.scale.x * 0.55;
  shadow.material.opacity = 0.75 * (1 - S.dark) * E.fade * (1 - 0.25 * clamp01(S.E));

  renderer.render(scene, camera);
  if (tg.on) writeTag();

  // Autoplay: Dauer je Schritt nach Textlänge, pausiert bei Hover über dem Text
  if (S.auto && !S.free && S.settled && !S.capHover) {
    S.autoT += dt;
    if (S.autoT >= S.autoDur) { S.autoT = 0; if (S.idx < S.steps.length - 1) goStep(S.idx + 1); else setAuto(false); }
  }
  syncFill();
}

/* ---------- Start ---------- */
let frame = 0, last = performance.now(), raf = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now; frame++;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
});

// Shader vorkompilieren (alle Modelle kurz sichtbar)
for (const id of ORDER) ENG[id].root.visible = true;
try { renderer.compile(scene, camera); } catch (err) { console.warn(err); }
for (const id of ORDER) ENG[id].root.visible = false;

const startE = cur(); startE.root.visible = true; startE.dir = 1; startE.pres = reduced ? 0.6 : -0.1;
seedEntry(startE, 0.8);
for (const id of ORDER) if (id !== S.eng) { ENG[id].dir = -1; ENG[id].pres = 0; }
document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-current', c.dataset.e === S.eng ? 'true' : 'false'));
applyDetail();
buildSteps(); buildProgress();
onResize();
syncExplodeUI(); setAuto(false);
// Intro (≤ 1,5 s): sanfter Dolly auf das zusammengesetzte Triebwerk, dann blendet der Text ein
S.idx = 0; capOut(0); renderCaption(S.steps[0]); computeAvail();
{
  const spec0 = sceneSpec(S.steps[0]); spec0.turn = OV_TURN[S.eng];
  applyScene(spec0);
  const to0 = framing(spec0);
  Object.assign(rig, to0); rig.dist *= 1.14; S.lastTurn = to0.turn; startE.turn = rig.turn;
  syncProgress();
  startTween(to0, 1.1);
  const my = ++seq;
  onSettle = () => { if (my !== seq) return; S.settled = true; capShow(true); };
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncLevelUI(); computeAvail(); retarget(S.settled ? 0.6 : 0); });
raf = requestAnimationFrame(loop);
</script>
