<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triebwerke – Bauteil-Index</title>
<meta name="description" content="Raketentriebwerke als interaktive Explosionszeichnung mit festem Bauteil-Index und Funktions-Phasen: Feststoff, Gasgenerator, Stufenverbrennung und Ionentriebwerk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens: 8er-Raster, eine Typo-Skala, zwei Radien, ein Schatten ---------- */
:root{
  --ink:#0c0e13; --ink2:#3b404b; --mute:#737986; --inv:#ffffff;
  --line:rgba(12,14,19,.09); --line2:rgba(12,14,19,.16);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.92); --glass-b:rgba(12,14,19,.07);
  --row-hl:rgba(12,14,19,.045);
  --accent:#0a66ff; --fuel:#ff7a1a; --lox:#12b5e5; --ion:#7c5cff; --hot:#ff9a3c;
  --hl:var(--accent);
  --shadow:0 24px 48px -24px rgba(20,24,40,.26), 0 2px 8px rgba(20,24,40,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-s:12px; --r-m:16px; --r-l:24px;
  --colW:360px; --edge:24px; --topY:88px; --carH:64px; --ctrlB:112px;
  --cx:50vw; --scx:50vw; --dh:0px; --peek:140px;
}
body.func{
  --ink:#f2f4f8; --ink2:#c7cdd8; --mute:#8b93a3; --inv:#0c0e13;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.2);
  --glass:rgba(24,27,36,.6); --glass-strong:rgba(22,25,33,.92); --glass-b:rgba(255,255,255,.08);
  --row-hl:rgba(255,255,255,.06);
  --hl:#ff9a3c;
  --shadow:0 24px 48px -24px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.2);
}
body.func.ion{--hl:#9b7bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#eceef1;color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:color .8s var(--ease)}
button{font-family:inherit;color:inherit}
.bg{position:fixed;inset:0;transition:opacity 1.2s var(--ease)}
.bg-light{background:radial-gradient(115% 90% at 62% 40%,#ffffff 0%,#f5f6f8 36%,#e3e6ea 72%,#d6dae0 100%)}
.bg-dark{background:radial-gradient(110% 90% at 62% 44%,#1c212c 0%,#0e1016 52%,#05060a 100%);opacity:0}
body.func .bg-dark{opacity:1}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}

/* ---------- Leitlinie (genau eine) ---------- */
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
#lines .ld{fill:none;stroke:var(--hl);stroke-width:1.25;stroke-linecap:round;opacity:0;transition:opacity .3s var(--ease)}
#lines .ldot{fill:var(--hl);opacity:0;transition:opacity .3s var(--ease)}
#lines .lring{fill:none;stroke:var(--hl);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center}
#lines.on .ld,#lines.on .ldot{opacity:1}
#lines.on .lring{animation:ring 1.8s var(--ease) infinite}
#lines.dot-only .ld{opacity:0}
@keyframes ring{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}

/* ---------- Nummern-Tags (nur zerlegt) ---------- */
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;width:22px;height:22px;margin:0;padding:0;border-radius:50%;border:1px solid var(--line2);background:var(--glass-strong);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font:700 10px/20px Sora,sans-serif;text-align:center;font-variant-numeric:tabular-nums;
  cursor:pointer;opacity:0;transition:opacity .35s var(--ease),background .25s,color .25s,border-color .25s;will-change:transform}
.tag::before{content:"";position:absolute;top:10px;width:14px;height:1px;background:var(--line2)}
.tag.r::before{right:100%}
.tag.l::before{left:100%}
#tags.on .tag{opacity:1;pointer-events:auto}
#tags.on.has-hl .tag:not(.hl){opacity:.35}
.tag.hl{background:var(--hl);color:#fff;border-color:transparent}

/* ---------- Kopfzeile ---------- */
.top{position:fixed;top:0;left:0;right:0;height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 var(--edge);pointer-events:none;z-index:6}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font:600 13px/1 Sora,sans-serif;letter-spacing:.01em;color:var(--ink)}
.brand i{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--fuel),var(--hot),var(--lox),var(--ion),var(--fuel))}
.brand span{color:var(--mute);font-weight:400}
.levels{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}
.levels button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;border:0;background:none;font:600 13px/1 Manrope,sans-serif;color:var(--ink2);
  height:36px;padding:0 16px;border-radius:999px;cursor:pointer;transition:color .4s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.levels button:hover{color:var(--ink)}
.levels button .st{display:inline-flex;gap:2px}
.levels button .st b{width:3px;height:9px;border-radius:2px;background:currentColor;opacity:.28}
.levels button .st b.f{opacity:1}
.levels button[aria-checked="true"]{color:var(--inv);font-weight:700}
.lvl-ind{position:absolute;top:4px;left:0;height:36px;width:0;border-radius:999px;background:var(--ink);box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.lvl-ind.ready{transition:transform .55s var(--ease),width .55s var(--ease),background .8s}

/* ---------- Seitenspalte: Kopf + Bauteil-Index / Phasen ---------- */
#col{position:fixed;left:var(--edge);top:var(--topY);bottom:var(--edge);width:var(--colW);z-index:4;display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent);padding-bottom:32px}
#col::-webkit-scrollbar{display:none}
.handle{display:none}
.col-head{order:0}
.eyebrow{font:600 11px/16px Sora,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.eyebrow b{color:var(--ink);font-weight:700}
h1{font:600 clamp(36px,3.6vw,52px)/1 Sora,sans-serif;letter-spacing:-.045em;margin:0 0 16px;color:var(--ink)}
h1 .w{display:inline-block;white-space:nowrap}
h1 .c{display:inline-block}
.lead{order:1;font:400 15px/24px Manrope,sans-serif;color:var(--ink2);margin:0 0 16px;max-width:42ch}
.specs{order:2;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0 0 8px}
.specs:empty{display:none}
.spec{padding:8px 0;border-top:1px solid var(--line);min-width:0}
.spec span{display:block;font:500 11px/16px Manrope,sans-serif;color:var(--mute)}
.spec b{display:block;font:600 13px/18px Sora,sans-serif;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.formula{grid-column:1/-1;font:500 13px/20px Sora,sans-serif;color:var(--ink2);padding:8px 0;border-top:1px solid var(--line)}

.sec-head{order:3;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:48px;margin-top:8px;border-bottom:1px solid var(--line2);
  background:transparent}
.sec-head::before{content:"";position:absolute;inset:-8px -2px 0;z-index:-1;background:linear-gradient(var(--sec-bg,rgba(244,245,247,.94)) 70%,transparent);opacity:0;transition:opacity .3s}
#col.scrolled .sec-head::before{opacity:1}
body.func{--sec-bg:rgba(16,18,24,.94)}
.sec-t{font:600 11px/1 Sora,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.sec-n{font:600 11px/1 Sora,sans-serif;color:var(--mute);font-variant-numeric:tabular-nums}
.sec-tools{margin-left:auto;display:flex;align-items:center;gap:4px}
.ib{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  font:500 14px/1 Manrope,sans-serif;color:var(--ink);transition:background .25s,border-color .25s,opacity .25s}
.ib:hover{background:var(--row-hl)}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:12px;height:12px;fill:currentColor}
.pos{font:600 12px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:44px;text-align:center}
.auto{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:transparent;height:32px;padding:0 12px 0 10px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font:600 12px/1 Manrope,sans-serif;color:var(--ink);margin-left:4px;transition:background .3s,color .3s,border-color .3s}
.auto svg{width:10px;height:10px;fill:currentColor}
.auto[aria-pressed="true"]{background:var(--hl);border-color:transparent;color:#0c0e13}
.auto .pa{display:none}.auto[aria-pressed="true"] .pa{display:block}.auto[aria-pressed="true"] .pl{display:none}
.tog{display:none}

/* Bauteil-Index */
.list{order:4;list-style:none;margin:0;padding:4px 0 0}
.row{appearance:none;-webkit-appearance:none;display:grid;grid-template-columns:32px 1fr 16px;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 8px 8px 0;margin:0;
  border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;color:var(--ink);border-radius:0;
  transition:opacity .3s var(--ease),background .25s var(--ease),padding .3s var(--ease)}
.row .rn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);
  border:1px solid var(--line2);transition:background .25s,color .25s,border-color .25s}
.row .rt{font:600 15px/20px Manrope,sans-serif;letter-spacing:-.005em;min-width:0}
.row .ra{font:500 14px/1 Manrope,sans-serif;color:var(--mute);opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s var(--ease)}
.row:hover,.row.hl{background:linear-gradient(90deg,var(--row-hl),transparent)}
.row:hover .ra,.row.hl .ra,.row.sel .ra{opacity:1;transform:none}
.row.hl .rn,.row:hover .rn{border-color:var(--hl);color:var(--hl)}
.row.sel .rn{background:var(--hl);border-color:transparent;color:#fff}
.row.sel .rt{color:var(--hl)}
.list.has-hl .row:not(.hl):not(.sel){opacity:.5}
.list.in .row{animation:rowIn .6s var(--ease) backwards;animation-delay:calc(var(--i) * 28ms + 120ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Phasen-Zeitleiste */
.phs{order:4;list-style:none;margin:0;padding:8px 0 0;position:relative}
.ph{position:relative;padding-left:32px}
.ph::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:1px;background:var(--line2)}
.ph:first-child::before{top:22px}
.ph:last-child::before{bottom:calc(100% - 22px)}
.ph-h{appearance:none;-webkit-appearance:none;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 0;border:0;background:none;cursor:pointer;text-align:left;color:var(--mute);
  transition:color .4s var(--ease)}
.ph-h:hover{color:var(--ink)}
.pd{position:absolute;left:5px;top:15px;width:13px;height:13px;border-radius:50%;border:1px solid var(--line2);background:var(--sec-bg,#f4f5f7);transition:background .4s,border-color .4s,box-shadow .4s}
.pn{font:700 10px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.06em;width:20px}
.pt{font:600 15px/20px Manrope,sans-serif}
.ph.done .pd{background:var(--mute);border-color:transparent}
.ph.on .pd{background:var(--hl);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--hl) 22%,transparent),0 0 16px var(--hl)}
.ph.on .ph-h{color:var(--ink)}
.ph.on .pt{font:600 20px/24px Sora,sans-serif;letter-spacing:-.02em}
.ph-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.ph.on .ph-b{grid-template-rows:1fr}
.ph-in{overflow:hidden;min-height:0}
.ph-in p{margin:0 0 12px;font:400 15px/24px Manrope,sans-serif;color:var(--ink2);opacity:0;transition:opacity .4s var(--ease)}
.ph.on .ph-in p{opacity:1;transition-delay:.15s}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:0}
.kv:empty{display:none}
.kv div{padding:8px 12px;border-radius:var(--r-s);border:1px solid var(--line2);min-width:0}
.kv dt{font:500 11px/14px Manrope,sans-serif;color:var(--mute)}
.kv dd{margin:2px 0 0;font:600 13px/18px Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)}
.prog{display:block;height:2px;border-radius:2px;background:var(--line);margin:0 0 16px;overflow:hidden;opacity:0;transition:opacity .3s}
.prog i{display:block;height:100%;width:100%;background:var(--hl);transform:scaleX(0);transform-origin:left}
body.autoplay .ph.on .prog{opacity:1}
body.autoplay .ph.on .prog i{animation:fill var(--dur,8s) linear forwards}
body.autoplay .ph.on .ph-in:hover .prog i{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}

/* ---------- Bedienleiste & Karussell (zentriert in der Bühne) ---------- */
.controls{position:fixed;left:var(--cx);bottom:var(--ctrlB);transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:4;padding:6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--shadow);
  transition:left .75s var(--ease),bottom .5s var(--ease)}
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;height:48px;padding:0 24px;display:inline-flex;align-items:center;gap:10px;
  font:600 15px/1 Sora,sans-serif;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:transform .35s var(--ease),background .4s,color .4s,box-shadow .4s}
.pill:active{transform:scale(.97)}
.pill:focus-visible,.card:focus-visible,.levels button:focus-visible,.row:focus-visible,.ph-h:focus-visible,.ib:focus-visible,.auto:focus-visible,.tag:focus-visible,.sheet button:focus-visible,.handle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#btnExplode{background:var(--ink);color:var(--inv);min-width:176px;justify-content:center}
#btnExplode .xi{width:18px;height:18px;position:relative;flex:none}
#btnExplode .xi i{position:absolute;left:3px;right:3px;height:4px;border-radius:1.5px;background:currentColor;transition:transform .55s var(--ease)}
#btnExplode .xi i:nth-child(1){top:2px}
#btnExplode .xi i:nth-child(2){top:7px}
#btnExplode .xi i:nth-child(3){top:12px}
#btnExplode[aria-pressed="true"] .xi i:nth-child(1){transform:translateY(-2px) translateX(-2px)}
#btnExplode[aria-pressed="true"] .xi i:nth-child(3){transform:translateY(2px) translateX(2px)}
#btnFunc{background:transparent;color:var(--ink)}
#btnFunc svg{width:14px;height:14px;fill:currentColor}
#btnFunc[aria-pressed="true"]{background:linear-gradient(135deg,#ffb054,#ff5a1f);color:#fff;box-shadow:0 10px 28px -10px rgba(255,90,31,.8)}
body.ion #btnFunc[aria-pressed="true"]{background:linear-gradient(135deg,#9f86ff,#4b5bff);box-shadow:0 10px 28px -10px rgba(91,80,255,.8)}
.scrub{display:flex;align-items:center;gap:8px;padding:0 4px 0 8px}
.scrub input{-webkit-appearance:none;appearance:none;width:160px;height:32px;background:transparent;cursor:pointer;margin:0}
.scrub input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--line2) var(--p,0%))}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.22);margin-top:-7.5px}
.scrub input::-moz-range-track{height:3px;border-radius:3px;background:var(--line2)}
.scrub input::-moz-range-progress{height:3px;border-radius:3px;background:var(--ink)}
.scrub input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.scrub output{font:600 12px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);width:40px;text-align:right}

.carousel{position:fixed;left:var(--scx);bottom:var(--edge);transform:translateX(-50%);display:flex;gap:8px;z-index:4;transition:left .75s var(--ease)}
.card{appearance:none;-webkit-appearance:none;position:relative;display:flex;align-items:center;gap:12px;width:160px;height:var(--carH);padding:8px 16px 8px 12px;border-radius:var(--r-m);
  border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);
  cursor:pointer;text-align:left;color:var(--ink);transition:transform .5s var(--ease),background .4s,box-shadow .4s}
.card:hover{transform:translateY(-2px)}
.card svg{width:26px;height:42px;flex:none;fill:var(--ink);opacity:.28;transition:opacity .5s,transform .7s var(--ease)}
.card[aria-current="true"]{background:var(--glass-strong)}
.card[aria-current="true"] svg{opacity:1}
.card .k{display:block;font:700 10px/1 Sora,sans-serif;letter-spacing:.14em;color:var(--mute)}
.card .t{display:block;font:600 13px/16px Sora,sans-serif;letter-spacing:-.01em;margin-top:4px;white-space:nowrap}
.card .ts{display:none}
.card .s{display:block;font:500 11px/14px Manrope,sans-serif;color:var(--mute);margin-top:2px}
.card::after{content:"";position:absolute;left:16px;right:16px;bottom:6px;height:2px;border-radius:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.card[aria-current="true"]::after{transform:scaleX(1)}

/* ---------- Detail-Panel (fährt von rechts herein, Modell weicht aus) ---------- */
.sheet{position:fixed;right:var(--edge);top:var(--topY);width:400px;max-height:calc(100% - var(--topY) - var(--ctrlB) - 76px);overflow:auto;z-index:7;padding:24px;border-radius:var(--r-l);
  background:var(--glass-strong);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);box-shadow:var(--shadow);
  transform:translateX(calc(100% + 48px));opacity:0;visibility:hidden;transition:transform .75s var(--ease),opacity .5s var(--ease),visibility 0s .75s;scrollbar-width:thin}
.sheet.open{transform:none;opacity:1;visibility:visible;transition:transform .75s var(--ease),opacity .5s var(--ease),visibility 0s}
.sh-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-num{width:32px;height:32px;border-radius:50%;background:var(--hl);color:#fff;display:grid;place-items:center;font:700 12px/1 Sora,sans-serif;font-variant-numeric:tabular-nums}
.sh-lvl{font:600 11px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sh-x{margin-left:auto;appearance:none;-webkit-appearance:none;border:0;background:var(--line);width:32px;height:32px;border-radius:50%;cursor:pointer;font:400 18px/1 Manrope,sans-serif;display:grid;place-items:center;color:var(--ink)}
.sheet h2{font:600 28px/32px Sora,sans-serif;letter-spacing:-.035em;margin:0 0 8px}
.sheet .sh-k{font:500 13px/20px Manrope,sans-serif;color:var(--mute);margin:0 0 16px}
.sheet p.sh-t{font:400 15px/24px Manrope,sans-serif;color:var(--ink2);margin:0 0 24px}
.sh-ph{margin:0 0 24px}
.sh-ph:empty{display:none}
.sh-ph h3{font:600 11px/16px Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.sh-ph div{display:flex;flex-wrap:wrap;gap:8px}
.sh-ph button{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:transparent;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;font:600 12px/1 Manrope,sans-serif;color:var(--ink)}
.sh-ph button:hover{background:var(--row-hl)}
.sh-ph button b{font:700 10px/1 Sora,sans-serif;color:var(--mute);margin-right:6px}
.sh-nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{position:fixed;inset:0;display:grid;place-items:center;font:500 16px Manrope,sans-serif}

@media (max-width:1280px){
  :root{--colW:320px}
  .card{width:132px;gap:8px;padding:8px 12px 8px 8px}
  .card .s{display:none}
  .scrub input{width:120px}
  .sheet{width:360px}
}
@media (max-width:1180px){
  .badge{top:auto;bottom:4px;left:auto;right:8px;transform:none;font-size:9px;padding:4px 8px}

@media (max-width:1100px) and (min-width:961px){

  .scrub output{display:none}
  #btnExplode{min-width:0}
  .pill{padding:0 16px}
  .levels button .st{display:none}
}

  .controls{left:12px;right:12px;bottom:calc(var(--dh) + 12px);transform:none;gap:4px;padding:4px;transition:bottom .6s var(--ease)}
  .pill{height:44px;padding:0 14px;font-size:13.5px;gap:8px}
  #btnExplode{min-width:0}
  .scrub{flex:1;min-width:0;padding:0 2px}

  .sheet{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:62vh;padding:16px 16px 12px;border-radius:var(--r-l);transform:translateY(calc(100% + 40px))}
  .sheet h2{font-size:22px;line-height:26px}
  .sheet p.sh-t{font-size:14px;line-height:22px;margin-bottom:16px}
  .hint{left:50%;transform:translateX(-50%);bottom:calc(var(--dh) + 76px);font-size:11px}
  .badge{top:auto;bottom:auto;top:108px;right:12px;left:auto;font-size:9px;padding:4px 8px}
}
@media (max-width:400px){
  .levels button{font-size:11.5px;padding:0 6px}

}
@media (prefers-reduced-motion: reduce){

  .card:hover{transform:none}
}

  const A = (id, objs, min) => addPart(E, id, objs, min);
  A('tank', [mesh(new THREE.SphereGeometry(0.42, 64, 40), M.comp(), { pos: [0, 1.78, 0] }), ring(0.425, 0.014, 1.78, M.gold()), mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.08, 24), M.steel(), { pos: [0, 1.34, 0] })]);
  A('leitung', [pipe([[0, 1.32, 0], [0.05, 1.2, 0], [0.3, 1.0, 0], [0.42, 0.82, 0], [0.47, 0.64, 0]], 0.026, M.steel()),
    mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), M.steelDark(), { pos: [0.26, 1.04, 0], rot: [0, 0, -0.7], min: 2 })]);
  A('kammer', [mesh(lathe(shell([[0.6, -0.24], [0.6, 0.32], [0.5, 0.52], [0.32, 0.7], [0.12, 0.76]], 0.02)), M.steel())]);
  A('magnete', [ring(0.615, 0.016, -0.12, M.steelDark()), ring(0.615, 0.016, 0.16, M.steelDark()), ring(0.43, 0.016, 0.6, M.steelDark())]);
  const foil = shell([[0.665, -0.2], [0.665, 0.34], [0.55, 0.56], [0.36, 0.74]], 0.012);
  A('deckeA', [mesh(lathe(foil, 64, 0, Math.PI), M.gold())], 3);
  A('deckeB', [mesh(lathe(foil, 64, Math.PI, Math.PI), M.gold())], 3);
  A('kathode', [mesh(lathe(solid([[0.035, 0.42], [0.045, 0.45], [0.045, 0.86], [0.07, 0.88], [0.07, 0.95]]), 32), M.steelDark()), mesh(new THREE.SphereGeometry(0.02, 16, 12), M.copper(), { pos: [0, 0.42, 0] })]);
  A('schirm', [mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.012, 96), M.moly(false), { pos: [0, -0.27, 0] })]);

  A('maske', [mesh(lathe([V2(0.62, -0.42), V2(0.74, -0.42), V2(0.74, -0.2), V2(0.66, -0.2), V2(0.66, -0.36), V2(0.62, -0.36), V2(0.62, -0.42)]), M.steel()), bolts(0.7, -0.19, 24, M.steelDark(), { min: 3 })]);
  const neu = new THREE.Group();

  neu.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.04, 24), M.steel(), { pos: [0, -0.16, 0] }));
  neu.add(ring(0.047, 0.01, 0.06, M.gold()));
  neu.position.set(0.86, -0.42, 0); neu.rotation.z = 0.55;
  A('neutralisator', [neu, rod([0.74, -0.32, 0], [0.84, -0.36, 0], 0.016, M.steel())]);

  const xe = '#c9cde4', ionC = '#a070ff', beam = '#7d8bff';
  for (let k = 0; k < 12; k++) {
    const a = Math.random() * Math.PI * 2, rr = 0.08 + 0.44 * Math.sqrt(Math.random());
    const gxp = rr * Math.cos(a), gzp = rr * Math.sin(a);
    const w1 = [0.1 + Math.random() * 0.3, 0.35 + Math.random() * 0.2, (Math.random() - 0.5) * 0.5];
    const w2 = [(Math.random() - 0.5) * 0.8, 0.1 + Math.random() * 0.2, (Math.random() - 0.5) * 0.8];
    addFlow(E, [[0, 1.32, 0], [0.05, 1.2, 0], [0.3, 1.0, 0], [0.42, 0.82, 0], [0.47, 0.64, 0], [0.36, 0.52, 0], w1, w2, [gxp * 0.85, -0.05, gzp * 0.85], [gxp, -0.27, gzp], [gxp, -0.4, gzp], [gxp * 1.15, -1.2, gzp * 1.15], [gxp * 1.45, -3.3, gzp * 1.45]],
      { tag: 'xe', win: 'y', n: 34, colFn: (p, u, out) => { if (p.y > 0.18) return out.set(xe); if (p.y > -0.3) return out.set(ionC); return out.set(beam); }, sizeFn: (p) => (p.y < 0.2 && p.y > 0.08) ? 0.085 : (p.y < -0.3 ? 0.06 : 0.045), spdFn: (p) => p.y > -0.28 ? 0.38 : 4.2, start: 0, rev: 2.3, speed: 0.8, jit: 0.012 });
  }
  for (let k = 0; k < 5; k++) {
    const a0 = k / 5 * Math.PI * 2, pts = [];
    for (let i = 0; i <= 26; i++) { const t = i / 26, r = 0.03 + 0.45 * t, an = a0 + t * 11; pts.push([r * Math.cos(an), 0.42 - 0.5 * t, r * Math.sin(an)]); }

  }
  for (let k = 0; k < 4; k++) {
    const dz = (k - 1.5) * 0.06;
    addFlow(E, [[0.76, -0.55, dz], [0.6, -0.8, dz], [0.35, -1.3, dz * 2], [0.16, -2.2, dz * 3], [0.08, -3.1, dz * 3]], { tag: 'neut', n: 22, col: [[0, '#e9fdff'], [1, '#7ee8ff']], size: 0.034, start: 2.6, rev: 1.4, speed: 1.4 });
  }
  makeFX(E, {
    flameGeo: lathe([V2(0.56, -0.24), V2(0.56, 0.3), V2(0.46, 0.5), V2(0.3, 0.66)], 48), c1: '#c9a8ff', c2: '#5b3cff',
    rExit: 0.58, yExit: -0.42, plume: 3.0, spread: 1.6, pc1: '#b9a2ff', pc2: '#4b6bff', diam: false, light: 0x8a6bff, lightPos: [0, 0.05, 0], flameAt: 1.0, plumeAt: 1.8
  });
  finalize(E, {
    units: {
      1: [{ id: 'tank', parts: ['tank', 'leitung'], off: [0, 0.9, 0] }, { id: 'kammer', parts: ['kathode', 'kammer', 'magnete', 'deckeA', 'deckeB', 'maske'], off: [0, 0, 0] }, { id: 'gitter', parts: ['schirm', 'beschl'], off: [0, -0.75, 0] }, { id: 'neutralisator', parts: ['neutralisator'], radial: 0.7 }],
      2: [{ id: 'tank', parts: ['tank'], off: [0, 1.5, 0] }, { id: 'leitung', parts: ['leitung'], off: [0.45, 0.9, 0] }, { id: 'kathode', parts: ['kathode'], off: [0, 0.75, 0] }, { id: 'kammer', parts: ['kammer', 'magnete', 'deckeA', 'deckeB', 'maske'], off: [0, 0, 0] }, { id: 'schirm', parts: ['schirm'], off: [0, -0.55, 0] }, { id: 'beschl', parts: ['beschl'], off: [0, -0.95, 0] }, { id: 'neutralisator', parts: ['neutralisator'], radial: 0.8 }],
      3: [{ id: 'tank', parts: ['tank'], off: [0, 1.6, 0] }, { id: 'leitung', parts: ['leitung'], off: [0.5, 0.95, 0] }, { id: 'kathode', parts: ['kathode'], off: [0, 0.8, 0] }, { id: 'deckeA', parts: ['deckeA'], radial: 0.75 }, { id: 'deckeB', parts: ['deckeB'], radial: 0.75 }, { id: 'magnete', parts: ['magnete'], off: [0, 0, 0] }, { id: 'kammer', parts: ['kammer'], off: [0, 0, 0] }, { id: 'schirm', parts: ['schirm'], off: [0, -0.55, 0] }, { id: 'beschl', parts: ['beschl'], off: [0, -0.9, 0] }, { id: 'maske', parts: ['maske'], off: [0, -1.25, 0] }, { id: 'neutralisator', parts: ['neutralisator'], radial: 0.9, off: [0, -0.2, 0] }]
    },
    readouts: {
      1: [[[0.3, 1.0, 0], 'Xenon-Gas', xe], [[-0.25, 0.15, 0], 'Gas wird elektrisch geladen', ionC], [[-0.55, -0.3, 0], 'Elektrische Schleuder', beam], [[0.76, -0.6, 0], 'Elektronen dazu', '#7ee8ff'], [[0, -2.3, 0], 'Ionenstrahl → Schub', beam]],
      2: [[[0.3, 1.0, 0], 'Xenon', xe], [[-0.25, 0.12, 0], 'Ionisation (Elektronenstöße)', ionC], [[0.55, -0.27, 0], 'Schirmgitter', '#c9cde4'], [[-0.55, -0.33, 0], 'Beschleunigungsgitter', beam], [[0.76, -0.6, 0], 'Neutralisator: e⁻', '#7ee8ff'], [[0, -2.0, 0], 'Ionen ca. 30–40 km/s', beam]],
      3: [[[-0.25, 0.12, 0], 'Xe → Xe⁺ + e⁻', ionC], [[0.55, -0.3, 0], 'ca. 1 kV', '#c9cde4'], [[-0.55, -0.55, 0], 'Raumladung: Child-Langmuir', beam], [[0.76, -0.6, 0], 'Neutralisator', '#7ee8ff'], [[0, -1.8, 0], 'Isp ca. 3100 s', beam], [[0, -2.7, 0], 'max. ca. 92 mN · ca. 2,3 kW', beam]]

  });
  return E;
}

function staggerE(Ev, i, n) {
  const s = n > 1 ? Math.min(0.07, 0.45 / (n - 1)) : 0;
  return clamp01((Ev - s * i) / (1 - s * (n - 1)));
}
function partTarget(E, p, lvl, Ev, out) {
  const u = E.unitOf[lvl][p.id];
  if (!u) return out.set(0, 0, 0);
  const le = staggerE(Ev, u.i, E.units[lvl].length);
  const off = u.off || [0, 0, 0];
  out.set(off[0], off[1], off[2]);
  if (u.radial) {
    const c = p.restCenter, L = Math.hypot(c.x, c.z);
    let dx = 1, dz = 0; if (L > 0.05) { dx = c.x / L; dz = c.z / L; }
    out.x += dx * u.radial; out.z += dz * u.radial;
  }

}
const seedV = new THREE.Vector3();
// Einflug: kurz und ruhig (≤ 1,5 s), Ruhezustand = montiertes Triebwerk
function seedEntry(E, amount) {
  for (const p of E.partList) {

  }
}

  capU.value = S.cutE > 0.01 ? 1 : 0;
}

/* ---------- Strömungen: pro Phase nur die passenden Abschnitte ---------- */
function phaseFlowTargets(E, dt) {
  const ph = S.mode === 'func' && E === cur() ? PH[E.id][S.phase] : null;
  const seen = ph ? SEEN[E.id][S.phase] : null;
  const k = ph && ph.burnout ? 1 - clamp01((S.phaseT - 1.2) / 3.5) : 1;
  for (const f of E.flows) {
    const w = ph && ph.flows[f.tag];
    let tact = 0;
    if (w) {
      tact = k;
      if (f.act < 0.03) { f.a = w[0]; f.b = w[1]; }        // neu aktiv: Fenster springt (unsichtbar), dann einblenden
      else { f.a = damp(f.a, w[0], 3, dt); f.b = damp(f.b, w[1], 3, dt); }   // aktiv: Fenster gleitet weiter
    }
    const tg = (seen && seen.has(f.tag)) ? 0.12 * k : 0;
    f.act = reduced ? tact : damp(f.act, tact, 3.5, dt);
    f.ghost = reduced ? tg : damp(f.ghost, tg, 3, dt);
  }
}
const sstep = (a, b, x) => { const t = clamp01((x - a) / ((b - a) || 1e-6)); return t * t * (3 - 2 * t); };
function updateParticles(E, dt) {
  const g = E.pts.geometry;
  const P = g.attributes.position.array, Cc = g.attributes.aColor.array, Sz = g.attributes.aSize.array, Al = g.attributes.aAlpha.array;
  const lvl = S.lvl;
  for (let k = 0; k < E.pN; k++) {
    const f = E.flows[E.pPath[k]];
    if (f.min > lvl || (f.act < 0.004 && f.ghost < 0.004)) { Al[k] = 0; continue; }
    let u = E.pU[k];
    const i0 = Math.min(f.N - 1, (u * (f.N - 1)) | 0);
    u += dt * f.speed * f.spd[i0] / f.len;
    if (u >= 1) u -= 1;
    E.pU[k] = u;
    const x = u * (f.N - 1), i = x | 0, j = Math.min(f.N - 1, i + 1), t = x - i;
    const jt = f.jit;
    P[k * 3] = f.pos[i * 3] + (f.pos[j * 3] - f.pos[i * 3]) * t + E.pJ[k * 3] * jt;
    const py = f.pos[i * 3 + 1] + (f.pos[j * 3 + 1] - f.pos[i * 3 + 1]) * t;
    P[k * 3 + 1] = py + E.pJ[k * 3 + 1] * jt;
    P[k * 3 + 2] = f.pos[i * 3 + 2] + (f.pos[j * 3 + 2] - f.pos[i * 3 + 2]) * t + E.pJ[k * 3 + 2] * jt;
    Cc[k * 3] = f.col[i * 3]; Cc[k * 3 + 1] = f.col[i * 3 + 1]; Cc[k * 3 + 2] = f.col[i * 3 + 2];
    Sz[k] = f.siz[i];
    let w;
    if (f.win === 'y') { const hi = f.a, lo = f.b; w = sstep(lo - 0.12, lo + 0.12, py) * (1 - sstep(hi - 0.12, hi + 0.12, py)); }
    else { const a = f.a, b = f.b; w = (a <= 0.001 ? 1 : sstep(a - 0.03, a + 0.03, u)) * (b >= 0.999 ? 1 : 1 - sstep(b - 0.03, b + 0.03, u)); }
    const env = Math.min(1, u / 0.03) * Math.min(1, (1 - u) / 0.12);
    Al[k] = Math.max(f.ghost, f.act * w) * env;
  }
  g.attributes.position.needsUpdate = true; g.attributes.aColor.needsUpdate = true; g.attributes.aSize.needsUpdate = true; g.attributes.aAlpha.needsUpdate = true;
}

const _fl = new THREE.Vector3();
function tick(dt, t) {
  uTime.value = t;
  // 1) DOM lesen (vor allen Schreibzugriffen)
  const tg = leaderTarget();
  readLeaderSource(tg);

  if (eTween) {
    eTween.t += dt; const k = clamp01(eTween.t / eTween.dur);
    S.E = lerp(eTween.from, eTween.to, ease.inOut(k));
    if (k >= 1) eTween = null;
    syncExplodeUI();
  }
  const func = S.mode === 'func';
  S.dark = reduced ? (func ? 1 : 0) : damp(S.dark, func ? 1 : 0, 2.6, dt);
  if (func) { if (S.E < 0.04) S.cutT = Math.min(1, S.cutT + dt / (reduced ? 0.2 : 1.1)); }
  else S.cutT = Math.max(0, S.cutT - dt / (reduced ? 0.2 : 0.8));
  S.cutE = ease.inOut(S.cutT);
  if (func) { S.funcT += dt; if (S.cutE > 0.5) S.phaseT += dt; }

  if (mouse && !S.dragging && (mouseDirty || (frame % 6 === 0))) {
    const h = pickPart(mouse.x, mouse.y); const nh = h ? h.u : null;
    if (nh !== S.hover) { S.hover = nh; syncHL(); }
    const cur_ = h ? 'pointer' : ''; if (canvas.style.cursor !== cur_) canvas.style.cursor = cur_;
    mouseDirty = false;
  }

  rimMat.uniforms.uColor.value.copy(HL_VIEW);
  for (const id of ORDER) { const E = ENG[id]; if (E.root.visible) updateEngine(E, dt, t); }
  const cam = updateCamera(dt);
  updateClip();

  scene.environmentIntensity = lerp(1, 0.3, S.dark);
  keyL.intensity = lerp(1.6, 0.45, S.dark);
  rimL.intensity = lerp(0.9, 1.4, S.dark);
  rimMat.uniforms.uI.value = 0.7;

  // Effekte je Phase
  for (const id of ORDER) {
    const E = ENG[id], fx = E.fx, isCur = E === cur() && E.root.visible;
    const on = isCur && func && S.cutE > 0.5;
    const ph = on ? PH[id][S.phase] : null;
    let fiT = ph ? (ph.flame || 0) : 0, piT = ph ? (ph.plume || 0) : 0;
    if (ph && ph.burnout) { const k = 1 - clamp01((S.phaseT - 1.2) / 3.5); fiT *= k; piT *= k; }
    fx.fi = damp(fx.fi, fiT, 3, dt); fx.pi = damp(fx.pi, piT, 2.2, dt);
    fx.flame.visible = fx.fi > 0.005; fx.plume.visible = fx.pi > 0.005;
    fx.flame.material.uniforms.uI.value = fx.fi * (0.9 + 0.1 * Math.sin(t * 31));
    fx.plume.material.uniforms.uI.value = fx.pi;
    if (fx.burn) {
      const n = PH[id].length, bT = ph ? 1 + 0.9 * (ph.burnout ? clamp01(S.phaseT / 4) * 0.4 + 0.6 : S.phase / (n - 1) * 0.6) : 1;
      fx.b = damp(fx.b || 1, bT, 1.5, dt); fx.flame.scale.set(fx.b, 1, fx.b);
    }
    phaseFlowTargets(E, dt);
    const pOn = isCur && func && S.cutE > 0.3;
    const pm = E.pts.material.uniforms.uFade;
    pm.value = damp(pm.value, pOn ? 1 : 0, 4, dt);
    E.pts.visible = pm.value > 0.01 && E.root.visible;
    if (E.pts.visible) updateParticles(E, dt);
    if (isCur) {
      _fl.copy(fx.lightPos).applyMatrix4(E.center.matrixWorld);
      fireL.position.copy(_fl); fireL.color.setHex(fx.light);
      fireL.intensity = 1.4 * fx.fi;
    }
  }

  // Kontaktschatten
  const E = cur();
  const sy = cam.minY * E.root.scale.y + E.root.position.y - 0.1;
  shadow.position.y = damp(shadow.position.y, Math.min(sy, -1.0), 4, dt);
  const ss = Math.max(1.2, cam.rmax * 2.6);
  shadow.scale.x = damp(shadow.scale.x, ss, 4, dt); shadow.scale.z = shadow.scale.x * 0.55;
  shadow.material.opacity = 0.75 * (1 - S.dark) * E.fade * (1 - 0.25 * clamp01(S.E));

  renderer.render(scene, camera);
  // 2) DOM schreiben – nur bei Änderung, ganze Pixel
  E.root.updateMatrixWorld();
  layoutTags(dt);
  drawLeader(tg);
}

/* ---------- Start ---------- */
let frame = 0, last = performance.now(), raf = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now; frame++;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
});

// Shader vorkompilieren (alle Modelle kurz sichtbar)
for (const id of ORDER) ENG[id].root.visible = true;
try { renderer.compile(scene, camera); } catch (err) { console.warn(err); }
for (const id of ORDER) ENG[id].root.visible = false;

const startE = cur(); startE.root.visible = true; startE.dir = 1; startE.pres = reduced ? 0.6 : 0; startE.turn = 0.55;
seedEntry(startE, 0.6);
for (const id of ORDER) if (id !== S.eng) { ENG[id].dir = -1; ENG[id].pres = 0; }
document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-current', c.dataset.e === S.eng ? 'true' : 'false'));
applyDetail();
onResize();
renderCol(true);
syncExplodeUI();
requestAnimationFrame(() => lvlInd.classList.add('ready'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncLevelUI(); fitTitle(); measureDrawer(); computeAvail(); sidesDirty = true; leaderKey = ''; });
raf = requestAnimationFrame(loop);
</script>
