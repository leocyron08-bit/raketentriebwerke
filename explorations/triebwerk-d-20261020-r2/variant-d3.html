<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triebwerke – Hotspots</title>
<meta name="description" content="Raketentriebwerke als ruhige Explosionszeichnung mit nummerierten Hotspots und Phasen-Zeitleiste: Feststoff, Gasgenerator, Stufenverbrennung und Ionentriebwerk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0e13; --ink2:#3b404b; --mute:#737986; --inv:#ffffff;
  --line:rgba(12,14,19,.10); --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.90); --glass-b:rgba(12,14,19,.07);
  --card-on:#ffffff;
  --accent:#0a66ff; --fuel:#ff7a1a; --lox:#12b5e5; --ion:#7c5cff; --hot:#ff9a3c; --phase:#ff8a2a;
  --shadow:0 22px 44px -22px rgba(20,24,40,.28), 0 2px 8px rgba(20,24,40,.05);
  --shadow-s:0 10px 22px -12px rgba(20,24,40,.42), 0 1px 3px rgba(20,24,40,.08);
  --r-l:28px; --r-m:22px; --r-s:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gut:32px;
}
body.func{
  --ink:#f2f4f8; --ink2:#c7cdd8; --mute:#8d95a5; --inv:#0c0e13;
  --line:rgba(255,255,255,.12); --glass:rgba(24,27,36,.62); --glass-strong:rgba(22,25,33,.88); --glass-b:rgba(255,255,255,.08);
  --card-on:rgba(255,255,255,.12);
  --shadow:0 22px 44px -22px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.2);
}
body.ion{--phase:#9b7bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#eceef1;color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;transition:color .8s var(--ease)}
button{font-family:inherit;color:inherit}
.bg{position:fixed;inset:0;transition:opacity 1.2s var(--ease)}
.bg-light{background:radial-gradient(115% 90% at 58% 40%,#ffffff 0%,#f5f6f8 36%,#e3e6ea 72%,#d6dae0 100%)}
.bg-dark{background:radial-gradient(110% 90% at 58% 44%,#1c212c 0%,#0e1016 52%,#05060a 100%);opacity:0}
body.func .bg-dark{opacity:1}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}

/* ---------- Hotspots ---------- */
#dots{position:fixed;inset:0;pointer-events:none;z-index:2}
.hs{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;cursor:pointer;
  opacity:0;visibility:hidden;pointer-events:none;will-change:transform,opacity;-webkit-tap-highlight-color:transparent;
  transition:opacity .38s var(--ease),visibility 0s .38s}
.hs.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .38s var(--ease),visibility 0s}
.hs .disc{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.94);color:#0c0e13;font:700 11px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  box-shadow:0 0 0 1px rgba(12,14,19,.09),var(--shadow-s);
  -webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);
  transition:transform .45s var(--ease),background .3s,color .3s,box-shadow .3s,opacity .3s}
.hs .ring{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(10,102,255,.55);opacity:0;pointer-events:none;
  animation:pulse 3.2s cubic-bezier(.3,.6,.3,1) infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:0}18%{opacity:.5}100%{transform:scale(1.75);opacity:0}}
.hs:hover .disc,.hs.hl .disc{transform:scale(1.12)}
.hs.dim .disc{opacity:.5}
.hs.dim .ring,body.seen .hs:not(.sel) .ring{animation:none}
.hs.sel .disc{background:var(--accent);color:#fff;transform:scale(1.18);box-shadow:0 0 0 4px rgba(10,102,255,.18),0 10px 24px -8px rgba(10,102,255,.7)}
.hs.sel .ring{border-color:rgba(10,102,255,.8);animation-duration:2s}
.hs:focus-visible{outline:none}
.hs:focus-visible .disc{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.hs .tip{position:absolute;top:50%;left:42px;transform:translate(-4px,-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:8px 12px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-b);box-shadow:var(--shadow-s);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  font:600 13px/1 Manrope,sans-serif;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .3s var(--ease)}
.hs .tip em{font-style:normal;font-weight:500;color:var(--mute);font-size:12px}
.hs.tl .tip{left:auto;right:42px;transform:translate(4px,-50%)}
.hs.hl .tip{opacity:1;transform:translate(0,-50%)}
.hs.sel .tip{opacity:0}

/* ---------- Kopfzeile ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px var(--gut);pointer-events:none;z-index:6}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font:600 13px/1 Sora,sans-serif;letter-spacing:.01em;color:var(--ink)}
.brand i{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--fuel),var(--hot),var(--lox),var(--ion),var(--fuel))}
.brand span{color:var(--mute);font-weight:400}
.levels{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-b);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}
.levels button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;border:0;background:none;font:600 13px/1 Manrope,sans-serif;color:var(--ink2);
  height:36px;padding:0 16px;border-radius:999px;cursor:pointer;transition:color .35s var(--ease);display:flex;align-items:center;gap:8px;white-space:nowrap}
.levels button:hover{color:var(--ink)}
.levels button .st{display:inline-flex;gap:2px}
.levels button .st b{width:3px;height:10px;border-radius:2px;background:currentColor;opacity:.28}
.levels button .st b.f{opacity:1}
.levels button[aria-checked="true"],.levels button[aria-checked="true"]:hover{color:var(--inv)}
.lvl-ind{position:absolute;top:4px;left:0;height:36px;width:0;border-radius:999px;background:var(--ink);box-shadow:0 4px 12px -4px rgba(12,14,19,.4)}
.lvl-ind.ready{transition:transform .55s var(--ease),width .55s var(--ease),background .8s}

/* ---------- Hero ---------- */
.hero{position:fixed;left:var(--gut);top:104px;width:min(400px,32vw);max-height:calc(100% - 104px - 236px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:3;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 24px),transparent);mask-image:linear-gradient(#000 calc(100% - 24px),transparent);padding-bottom:16px}
body.func .hero{max-height:calc(100% - 104px - var(--dockH,320px) - 24px)}
.hero::-webkit-scrollbar{display:none}
.hero>*{pointer-events:auto}
.eyebrow{font:600 11px/1.3 Sora,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.eyebrow b{color:var(--ink);font-weight:700}
h1{font:600 clamp(42px,5.4vw,76px)/.94 Sora,sans-serif;letter-spacing:-.05em;margin:0 0 20px;color:var(--ink)}
h1 .w{display:inline-block;white-space:nowrap}
h1 .c{display:inline-block}
.lead{font:400 16px/1.6 Manrope,sans-serif;color:var(--ink2);margin:0 0 12px;max-width:40ch}
.ex{font:500 12.5px/1.5 Manrope,sans-serif;color:var(--mute);margin:0 0 20px}
body.func .ex,body.func .specs{display:none}
.specs{display:block;margin:0;font-size:13px;max-width:400px}
.specs:empty{display:none}
.spec{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
.spec:last-of-type{border-bottom:1px solid var(--line)}
.spec span{color:var(--mute)}
.spec b{font:600 13px/1.3 Sora,sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.formula{font:500 13px/1.5 Sora,sans-serif;color:var(--ink2);margin-top:12px;letter-spacing:.01em}

/* ---------- Ansicht-Steuerung ---------- */
.controls{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:4;padding:6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--shadow);
  transition:opacity .5s var(--ease),transform .6s var(--ease),visibility 0s}
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;height:48px;padding:0 24px;display:inline-flex;align-items:center;gap:10px;
  font:600 15px/1 Sora,sans-serif;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:transform .35s var(--ease),background .4s,color .4s,box-shadow .4s}
.pill:active{transform:scale(.97)}
.pill:focus-visible,.card:focus-visible,.levels button:focus-visible,.sheet button:focus-visible,.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#btnExplode{background:var(--ink);color:var(--inv);min-width:184px;justify-content:center}
#btnExplode .xi{width:18px;height:18px;position:relative;flex:none}
#btnExplode .xi i{position:absolute;left:3px;right:3px;height:4px;border-radius:1.5px;background:currentColor;transition:transform .55s var(--ease)}
#btnExplode .xi i:nth-child(1){top:2px}
#btnExplode .xi i:nth-child(2){top:7px}
#btnExplode .xi i:nth-child(3){top:12px}
#btnExplode[aria-pressed="true"] .xi i:nth-child(1){transform:translateY(-2px) translateX(-2px)}
#btnExplode[aria-pressed="true"] .xi i:nth-child(3){transform:translateY(2px) translateX(2px)}
#btnFunc{background:transparent;color:var(--ink)}
#btnFunc:hover{background:var(--line)}
#btnFunc svg{width:14px;height:14px;fill:currentColor}
.scrub{display:flex;align-items:center;gap:10px;padding:0 4px 0 8px}
.scrub input{-webkit-appearance:none;appearance:none;width:160px;height:32px;background:transparent;cursor:pointer;margin:0}
.scrub input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--line) var(--p,0%))}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.22);margin-top:-7.5px}
.scrub input::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
.scrub input::-moz-range-progress{height:3px;border-radius:3px;background:var(--ink)}
.scrub input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.scrub output{font:600 12px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);width:40px;text-align:right}

.carousel{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:8px;z-index:4;transition:opacity .5s var(--ease),transform .6s var(--ease),visibility 0s}
.card{appearance:none;-webkit-appearance:none;position:relative;display:flex;align-items:center;gap:12px;width:176px;height:84px;padding:12px 16px 12px 12px;border-radius:var(--r-m);
  border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);
  cursor:pointer;text-align:left;color:var(--ink);transition:transform .5s var(--ease),background .4s,box-shadow .4s}
.card:hover{transform:translateY(-3px)}
.card svg{width:36px;height:58px;flex:none;fill:var(--ink);opacity:.28;transition:opacity .5s,transform .7s var(--ease)}
.card[aria-current="true"]{background:var(--card-on)}
.card[aria-current="true"] svg{opacity:1;transform:scale(1.05)}
.card .k{display:block;font:700 10px/1 Sora,sans-serif;letter-spacing:.14em;color:var(--mute)}
.card .t{display:block;font:600 14px/1.15 Sora,sans-serif;letter-spacing:-.01em;margin-top:6px}
.card .s{display:block;font:500 12px/1.2 Manrope,sans-serif;color:var(--mute);margin-top:4px}
.card::after{content:"";position:absolute;left:20px;right:20px;bottom:8px;height:2px;border-radius:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.card[aria-current="true"]::after{transform:scaleX(1)}
body.func .controls{opacity:0;transform:translate(-50%,24px);visibility:hidden;pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease),visibility 0s .5s}
body.func .carousel{opacity:0;transform:translate(-50%,32px);visibility:hidden;pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease),visibility 0s .5s}

/* ---------- Bauteil-Karte ---------- */
.sheet{position:fixed;right:24px;top:96px;width:376px;max-height:calc(100% - 96px - 132px);overflow:auto;z-index:7;padding:24px;border-radius:var(--r-l);
  background:var(--glass-strong);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);box-shadow:var(--shadow);
  transform:translateX(calc(100% + 48px));opacity:0;visibility:hidden;transition:transform .7s var(--ease),opacity .45s var(--ease),visibility 0s .7s}
.sheet.open{transform:none;opacity:1;visibility:visible;transition:transform .7s var(--ease),opacity .45s var(--ease),visibility 0s}
.sh-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sh-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 12px/1 Sora,sans-serif;flex:none;box-shadow:0 0 0 4px rgba(10,102,255,.14)}
.sh-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.sh-lvl{font:600 10.5px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sh-k{font:500 12.5px/1.2 Manrope,sans-serif;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-x{margin-left:auto;appearance:none;-webkit-appearance:none;border:0;background:var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer;font:400 20px/1 Manrope,sans-serif;display:grid;place-items:center;flex:none}
.sheet h2{font:600 28px/1.08 Sora,sans-serif;letter-spacing:-.035em;margin:0 0 12px}
.sheet p.sh-t{font:400 15px/1.6 Manrope,sans-serif;color:var(--ink2);margin:0 0 24px}
.sh-nav{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.sh-nav>button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;font:600 16px/1 Manrope,sans-serif;display:grid;place-items:center;flex:none}
.sh-nav>button:hover{background:var(--line)}
.pips{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.pips button{appearance:none;-webkit-appearance:none;border:0;background:none;width:14px;height:20px;padding:0;cursor:pointer;display:grid;place-items:center}
.pips button i{width:6px;height:6px;border-radius:3px;background:var(--ink);opacity:.2;transition:width .4s var(--ease),opacity .3s,background .3s}
.pips button:hover i{opacity:.45}
.pips button[aria-current="true"]{width:22px}
.pips button[aria-current="true"] i{width:16px;opacity:1;background:var(--accent)}

/* ---------- Funktion: Kapitel-Zeitleiste ---------- */
.dock{position:fixed;left:50%;bottom:28px;width:min(760px,calc(100% - 48px));transform:translate(-50%,28px);z-index:5;display:flex;flex-direction:column;gap:12px;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s var(--ease),transform .6s var(--ease),visibility 0s .6s}
body.func .dock{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0);transition:opacity .6s var(--ease) .15s,transform .7s var(--ease) .15s,visibility 0s}
.cap{position:relative;padding:20px 24px 20px;border-radius:var(--r-m);background:var(--glass-strong);border:1px solid var(--glass-b);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4)}
.cap-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cap-k{display:flex;align-items:center;gap:8px;font:600 11px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.cap-k i{width:8px;height:8px;border-radius:50%;background:var(--phase);box-shadow:0 0 12px var(--phase)}
.cap-k b{color:var(--ink);font-weight:700}
.cap-lvl{margin-left:auto;font:600 10.5px/1 Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cap-body{overflow:auto;scrollbar-width:thin}
.cap h3{font:600 22px/1.12 Sora,sans-serif;letter-spacing:-.03em;margin:0 0 8px;color:var(--ink)}
.cap p{font:400 15px/1.6 Manrope,sans-serif;color:var(--ink2);margin:0;max-width:68ch}
.cap-measure{position:absolute;left:24px;top:0;visibility:hidden;pointer-events:none}
.tl{display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
.tl-btn{appearance:none;-webkit-appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .3s}
.tl-btn:hover{background:var(--line)}
.tl-btn svg{width:14px;height:14px;fill:currentColor}
.tl-play{background:var(--phase);color:#0c0e13;box-shadow:0 8px 22px -10px var(--phase)}
.tl-play:hover{background:var(--phase);filter:brightness(1.08)}
.tl-play .i-pause{display:none}
.tl-play[aria-pressed="true"] .i-play{display:none}
.tl-play[aria-pressed="true"] .i-pause{display:block}
.tl-bar{flex:1;min-width:0;display:flex;gap:4px;padding:0 6px;touch-action:none;cursor:pointer}
.seg{position:relative;flex:1;min-width:0;height:40px;appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center}
.seg .tr{position:relative;display:block;width:100%;height:4px;border-radius:3px;background:var(--line);overflow:hidden;transition:height .35s var(--ease)}
.seg .fi{position:absolute;inset:0;border-radius:inherit;background:var(--ink);opacity:.55;transform-origin:left;transform:scaleX(0)}
.seg.on .tr{height:6px}
.seg.on .fi{background:var(--phase);opacity:1}
.seg .n{position:absolute;left:0;top:4px;font:600 9.5px/1 Sora,sans-serif;color:var(--mute);letter-spacing:.04em;font-variant-numeric:tabular-nums;transition:color .3s}
.seg.on .n{color:var(--ink)}
.seg .tip{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translate(-50%,4px);white-space:nowrap;padding:7px 10px;border-radius:10px;background:var(--ink);color:var(--inv);
  font:600 12px/1 Manrope,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.seg:hover .tip,.seg:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.seg:first-child .tip{left:0;transform:translate(0,4px)}
.seg:first-child:hover .tip,.seg:first-child:focus-visible .tip{transform:none}
.seg:last-child .tip{left:auto;right:0;transform:translate(0,4px)}
.seg:last-child:hover .tip,.seg:last-child:focus-visible .tip{transform:none}
.tl-x{appearance:none;-webkit-appearance:none;border:0;height:40px;padding:0 16px;border-radius:999px;background:var(--line);cursor:pointer;font:600 13px/1 Manrope,sans-serif;display:flex;align-items:center;gap:8px;flex:none}
.tl-x:hover{background:rgba(255,255,255,.18)}
.tl-x span{font-size:17px;line-height:1}

.badge{position:fixed;left:50%;top:28px;transform:translateX(-50%);z-index:6;font:600 10.5px/1 Sora,sans-serif;letter-spacing:.06em;padding:8px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-b);color:var(--mute);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap;pointer-events:none}
.hint{position:fixed;left:50%;bottom:204px;transform:translateX(-50%);z-index:3;font:500 12px/1 Manrope,sans-serif;color:var(--mute);letter-spacing:.02em;white-space:nowrap;transition:opacity 1s var(--ease);pointer-events:none}
.hint.off{opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{position:fixed;inset:0;display:grid;place-items:center;font:500 16px Manrope,sans-serif}

@media (max-width:1180px){

  .cap{padding:14px 16px}

  .cap h3{font-size:18px;margin-bottom:6px}

  .tl{gap:2px;padding:4px}

  .tl-x{width:40px;padding:0;justify-content:center}

@media (max-width:420px){

  *,*::before,*::after{transition-duration:.01s !important;animation-duration:.01s !important}

    const fiT = ph ? ph.fx[0] * S.endFade : 0, piT = ph ? ph.fx[1] * S.endFade : 0;
    fx.fi = damp(fx.fi, fiT, 3, dt); fx.pi = damp(fx.pi, piT, 2.2, dt);
    fx.flame.visible = fx.fi > 0.005; fx.plume.visible = fx.pi > 0.005;
    fx.flame.material.uniforms.uI.value = fx.fi * (0.9 + 0.1 * Math.sin(t * 31));
    fx.plume.material.uniforms.uI.value = fx.pi;
    if (fx.burn) {
      const prog = isCur && func ? (S.ph + clamp01(S.phT / phaseDur(S.ph))) / PH[id].length : 0;
      const b = 1 + 0.9 * prog; fx.flame.scale.set(b, 1, b);
    }
    const pOn = isCur && func && S.cutE > 0.3;
    if (isCur && func) updateFlowState(E, dt);
    const pm = E.pts.material.uniforms.uFade;
    pm.value = damp(pm.value, pOn ? 1 : 0, 4, dt);
    E.pts.visible = pm.value > 0.01 && E.root.visible;
    if (E.pts.visible) updateParticles(E, dt);
    if (isCur) {
      _fl.copy(fx.lightPos).applyMatrix4(E.center.matrixWorld);
      fireL.position.copy(_fl); fireL.color.setHex(fx.light);
      fireL.intensity = 1.4 * fx.fi;
    }
  }

  // Kontaktschatten
  const E = cur();
  const sy = cam.minY * E.root.scale.y + E.root.position.y - 0.1;
  shadow.position.y = damp(shadow.position.y, Math.min(sy, -1.0), 4, dt);
  const ss = Math.max(1.2, cam.rmax * 2.6);
  shadow.scale.x = damp(shadow.scale.x, ss, 4, dt); shadow.scale.z = shadow.scale.x * 0.55;
  shadow.material.opacity = 0.75 * (1 - S.dark) * E.fade * (1 - 0.25 * clamp01(S.E));

  renderer.render(scene, camera);
  layoutDots(dt);
  if (frame % 20 === 0) computeAvail();
}

/* ---------- Start ---------- */
let frame = 0, last = performance.now(), raf = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now; frame++;
  tick(dt, now / 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
});

// Shader vorkompilieren (alle Modelle kurz sichtbar)
for (const id of ORDER) ENG[id].root.visible = true;
try { renderer.compile(scene, camera); } catch (err) { console.warn(err); }
for (const id of ORDER) ENG[id].root.visible = false;

const startE = cur(); startE.root.visible = true; startE.dir = 1; startE.pres = reduced ? 0.6 : -0.05; startE.turn = 0.55;
seedEntry(startE, 0.6);
for (const id of ORDER) if (id !== S.eng) { ENG[id].dir = -1; ENG[id].pres = 0; }
document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-current', c.dataset.e === S.eng ? 'true' : 'false'));
S.engT = performance.now();
applyDetail();
rebuildDots();
buildSegments(); fillCaption(); syncPlay();
onResize();
renderHero('full');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncLevelUI(); fitTitle(); measureTips(); measureCaption(); computeAvail(); });
raf = requestAnimationFrame(loop);
</script>
